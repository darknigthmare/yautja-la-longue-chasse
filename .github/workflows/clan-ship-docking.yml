name: Clan Ship docking and campaign resume

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/game/ClanShipHub*'
      - 'app/game/GameClient.tsx'
      - 'app/game/ShipHub.tsx'
      - 'app/game/CampaignMainMenu.tsx'
      - 'app/game/save.ts'
      - 'app/game/types.ts'
      - 'app/game/systems/clanShipDocking.ts'
      - 'app/game/systems/campaignSlots.ts'
      - 'app/game/systems/completeArchive.ts'
      - 'tests/clan-ship-*.test.mjs'
      - 'scripts/qa-clan-ship-browser.mjs'
      - '.github/workflows/clan-ship-docking.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clan-ship-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docking:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /desktop/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/prologue/v47/village.png
            /public/game/prologue/v47/arena.png
            /public/game/ships/v14/avp-predator-mothership.webp
            /public/game/ships/v12/classic-predator-spaceship.webp
            /public/game/ships/v13/classic-predator-spaceship-top.webp
            /public/game/backgrounds/ship-hub-v4.webp
            /public/game/ship-interior/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Strict lint of the docking integration
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
          app/game/ClanShipHub.tsx app/game/GameClient.tsx app/game/ShipHub.tsx
          app/game/CampaignMainMenu.tsx app/game/save.ts app/game/types.ts
          app/game/systems/clanShipDocking.ts app/game/systems/campaignSlots.ts
          app/game/systems/completeArchive.ts scripts/qa-clan-ship-browser.mjs
          tests/clan-ship-docking.test.mjs tests/clan-ship-save.test.mjs
      - name: Docking, saves, archives and campaign regressions
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          tests/clan-ship-docking.test.mjs tests/clan-ship-save.test.mjs
          tests/complete-archive.test.mjs tests/campaign-slots.test.mjs
          tests/cloud-account-archives-v71.test.mjs
          tests/game-client-ship-flow.test.mjs tests/campaign-resume-priority-v94.test.mjs
          tests/ship-hub-input-runtime.test.mjs
      - name: Install the pinned Chromium browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Play the real campaign and restore its clan berth
        run: node scripts/qa-clan-ship-browser.mjs
      - name: Upload browser evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clan-ship-browser-${{ github.sha }}
          path: outputs/qa-clan-ship/
          if-no-files-found: warn
          retention-days: 14
