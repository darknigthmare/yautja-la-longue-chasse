name: Clan Ship campaign, interior, crew and tactical operations

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/game/ClanShipHub*'
      - 'app/game/ClanShipInterior*'
      - 'app/game/ClanShipOperationsPanel*'
      - 'app/game/ClanShipSpaceEncounter*'
      - 'app/game/clanShipCrew.ts'
      - 'app/game/GameClient.tsx'
      - 'app/game/ShipHub.tsx'
      - 'app/game/CampaignMainMenu.tsx'
      - 'app/game/save.ts'
      - 'app/game/types.ts'
      - 'app/game/systems/clanShipDocking.ts'
      - 'app/game/systems/clanShipInterior.ts'
      - 'app/game/systems/clanShipOperations.ts'
      - 'app/game/systems/clanShipSpaceEncounter.ts'
      - 'app/game/systems/campaignSlots.ts'
      - 'app/game/systems/completeArchive.ts'
      - 'tests/clan-ship-*.test.mjs'
      - 'public/game/clan-ship/**'
      - 'tests/fixtures/clan-ship-browser-assets.json'
      - 'scripts/qa-clan-ship-browser.mjs'
      - 'scripts/qa-clan-ship-operations.mjs'
      - '.github/workflows/clan-ship-docking.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clan-ship-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docking:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CLAN_SHIP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CLAN_SHIP_HEADLESS: '0'
      CLAN_OPERATIONS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CLAN_OPERATIONS_HEADED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /desktop/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/prologue/v47/village.png
            /public/game/prologue/v47/arena.png
            /public/game/ships/v14/avp-predator-mothership.webp
            /public/game/ships/v12/classic-predator-spaceship.webp
            /public/game/ships/v13/classic-predator-spaceship-top.webp
            /public/game/backgrounds/ship-hub-v4.webp
            /public/game/ship-interior/
      - name: Include the interior artwork and shared ship services
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { paths } = JSON.parse(readFileSync('tests/fixtures/clan-ship-browser-assets.json', 'utf8'));
          assert.equal(new Set(paths).size, paths.length);
          for (const file of paths) {
            assert.match(file, /^public\/game\/[A-Za-z0-9._/-]+$/);
            assert.ok(file.split('/').every(part => part && part !== '.' && part !== '..'));
          }
          execFileSync('git', ['sparse-checkout', 'add', '--stdin'], { input: paths.map(file => '/' + file).join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'] });
          assert.deepEqual(paths.filter(file => !existsSync(file)), [], 'Every declared route asset must exist in this exact checkout');
          console.log('Interior and shared service assets included:', paths.length);
          NODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Strict lint of the interior and docking integration
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
          app/game/ClanShipHub.tsx app/game/ClanShipInterior.tsx
          app/game/ClanShipOperationsPanel.tsx app/game/ClanShipSpaceEncounter.tsx
          app/game/clanShipCrew.ts
          app/game/GameClient.tsx app/game/ShipHub.tsx
          app/game/CampaignMainMenu.tsx app/game/save.ts app/game/types.ts
          app/game/systems/clanShipDocking.ts app/game/systems/clanShipInterior.ts
          app/game/systems/clanShipOperations.ts app/game/systems/clanShipSpaceEncounter.ts
          app/game/systems/campaignSlots.ts
          app/game/systems/completeArchive.ts scripts/qa-clan-ship-browser.mjs scripts/qa-clan-ship-operations.mjs
          tests/clan-ship-docking.test.mjs tests/clan-ship-save.test.mjs
          tests/clan-ship-interior.test.mjs
          tests/clan-ship-operations.test.mjs tests/clan-ship-space-encounter.test.mjs tests/clan-ship-operations-save.test.mjs
      - name: Interior geometry, docking, saves, archives and campaign regressions
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          tests/clan-ship-docking.test.mjs tests/clan-ship-save.test.mjs
          tests/clan-ship-interior.test.mjs
          tests/clan-ship-operations.test.mjs tests/clan-ship-space-encounter.test.mjs tests/clan-ship-operations-save.test.mjs
          tests/complete-archive.test.mjs tests/campaign-slots.test.mjs
          tests/cloud-account-archives-v71.test.mjs
          tests/game-client-ship-flow.test.mjs tests/campaign-resume-priority-v94.test.mjs
          tests/ship-hub-input-runtime.test.mjs
      - name: Install the pinned Chromium browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Walk the real interior and restore its clan berth
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" node scripts/qa-clan-ship-browser.mjs
      - name: Earn the mandate, recruit crew and command the three tactical operations
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" node scripts/qa-clan-ship-operations.mjs
      - name: Upload browser evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clan-ship-browser-${{ github.sha }}
          path: |
            outputs/qa-clan-ship/
            outputs/qa-clan-ship-operations/
          if-no-files-found: warn
          retention-days: 14
