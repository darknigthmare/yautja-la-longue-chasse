name: P0 In-play full-load search
on:
  push:
    branches: [codex/qa-rem112-loaded-focus-20261121]
permissions:
  contents: read
jobs:
  scenario:
    name: Full-load packing - ${{ matrix.mission }} ${{ matrix.armor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mission: ice-cryostalker, armor: scout, seed: 6}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /public/**/manifest.json
            /docs/qa/v112-ground-campaign/campaign-origin-save.json
            /docs/qa/v112-ground-campaign/tool-origin.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce the real admission and tune coverage without changing the game
        env:
          MISSION: ${{ matrix.mission }}
          ARMOR: ${{ matrix.armor }}
          MAX_SEED: ${{ matrix.seed }}
        run: |
          origin=docs/qa/v112-ground-campaign/campaign-origin-save.json
          root="outputs/rem112-08-focus/$MISSION-$ARMOR"
          mkdir -p "$root"
          for seed in $(seq 1 "$((MAX_SEED-1))"); do
            advance="$root/advance-$seed"
            if ! node scripts/qa-hunt-ground-campaign-v112.mjs --mission="$MISSION" --armor=hunter --baseSave="$origin" --replay=true --requireComplete=true --seconds=300 --output="$advance" --successSave="$advance/after-win.json" > "$root/advance-$seed.log" 2>&1; then
              tail -30 "$root/advance-$seed.log"
              exit 1
            fi
            origin="$advance/after-win.json"
          done
          full=0
          for variant in early-120 early-160 early-190 early-240 normal-120 normal-160 normal-190 normal-240; do
            params=("--sweepDistance=${variant#*-}" "--leaveSpecimens=harvest-tissue:ice-brutes-1")
            if [[ "$variant" == early-* ]]; then params+=(--sweepEarly=true); fi
            output="$root/$variant"
            if node scripts/qa-hunt-ground-campaign-v112.mjs --mission="$MISSION" --armor="$ARMOR" --baseSave="$origin" --insertion=visible-ship --harvest=true --harvestSweep=true "${params[@]}" --minimumRetainedLoad=1 --replay=true --seconds=360 --output="$output" > "$root/$variant.log" 2>&1; then full=1; fi
            if [ -f "$output/report.json" ]; then
            else
              tail -30 "$root/$variant.log"
            fi
            if [ "$full" -eq 1 ]; then break; fi
          done
          test "$full" -eq 1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rem112-08-focus-${{ matrix.mission }}-${{ matrix.armor }}
          path: outputs/rem112-08-focus/
          if-no-files-found: ignore
