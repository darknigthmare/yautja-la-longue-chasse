name: Mobility review snapshot
on:
  push:
    branches: [feat/mobility-garage-gameplay-20261108]
    paths: [.github/workflows/mobility-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/game/
            /tests/
            /scripts/
            /docs/campagne/mobilite/
            /production/mobility-20261108/
            /public/game/mobility/
      - name: Archive bounded source and proof files without executing them
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,zipfile
          from pathlib import Path
          patterns=['app/game/systems/mobility/*','app/game/Mobility*','tests/mobility/*','tests/mobility-*.mjs','scripts/*mobility*','docs/campagne/mobilite/GAMEPLAY_GARAGE_V1.md','production/mobility-20261108/**/*','public/game/mobility/**/*']
          paths={Path(p) for p in ['app/game/GameClient.tsx','app/game/HomeworldHub.tsx','app/game/save.ts','app/game/types.ts','app/game/systems/homeworld.ts','.github/workflows/mobility-publish-source-20261108.yml']}
          for pat in patterns: paths.update(Path('.').glob(pat))
          paths=sorted(p for p in paths if p.is_file())
          records=[]
          with zipfile.ZipFile('mobility-review-snapshot.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in paths:
              body=p.read_bytes();assert len(body)<8_000_000
              z.writestr(str(p),body);records.append({'path':str(p),'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body)})
            z.writestr('REVIEW_SNAPSHOT.json',json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':records},indent=2))
          print(len(paths),'files; source inspection only')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-review-snapshot
          path: mobility-review-snapshot.zip
          retention-days: 7
