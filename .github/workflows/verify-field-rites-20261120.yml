          done
          for commit in HEAD 5417bafe9b2fe3ed064693d9e0f12d9d591217d3 09c42b77932f05160b956f731e2087c71a15dfdc 6e2a5546bd75e95901235af8d503621d0bc2201d 2d1d006628e7e657cda66470ed06f5055f4919c5 4ef1eb48e45278db4606d8ee9999647c62c80a21 d71e995ae886df69c4165a1a153291449e8f22f6; do
            git ls-tree -r --format='%(objectname)' "$commit" -- public/game/production/enforcers-v610 docs/suivi-production/v613/recovery/native-checkpoint.json
          done | sort -u | while read -r object; do
            git cat-file blob "$object" > /dev/null
          done
          node scripts/audit-enforcer-historical-recovery.mjs 5417bafe9b2fe3ed064693d9e0f12d9d591217d3 09c42b77932f05160b956f731e2087c71a15dfdc 6e2a5546bd75e95901235af8d503621d0bc2201d 2d1d006628e7e657cda66470ed06f5055f4919c5 4ef1eb48e45278db4606d8ee9999647c62c80a21 d71e995ae886df69c4165a1a153291449e8f22f6 > outputs/enforcer-provenance/report.json
          node -e 'const r=require("./outputs/enforcer-provenance/report.json"); if(r.v610.preservedTraceCount!==36||r.v613.finalCount!==36) process.exit(1); console.log(JSON.stringify({v610:r.v610.originalPngMatches,v613:r.v613.matchingPublishedReceipts,missingV613:r.v613.missingPublishedReceipts.length}))'
          mkdir -p "$RUNNER_TEMP/enforcer-scans"
          git cat-file blob d71e995ae886df69c4165a1a153291449e8f22f6:docs/suivi-production/v613/recovery/native-checkpoint.json > "$RUNNER_TEMP/enforcer-scans/historical-checkpoint.json"
          printf 'non-original test content\n' > "$RUNNER_TEMP/enforcer-scans/unrelated.png"
          node scripts/audit-enforcer-historical-recovery.mjs --archive "$RUNNER_TEMP/enforcer-scans" --checkpoint "$RUNNER_TEMP/enforcer-scans/historical-checkpoint.json" 5417bafe9b2fe3ed064693d9e0f12d9d591217d3 09c42b77932f05160b956f731e2087c71a15dfdc 6e2a5546bd75e95901235af8d503621d0bc2201d 2d1d006628e7e657cda66470ed06f5055f4919c5 4ef1eb48e45278db4606d8ee9999647c62c80a21 d71e995ae886df69c4165a1a153291449e8f22f6 > outputs/enforcer-provenance/local-options.json
          node -e 'const r=require("./outputs/enforcer-provenance/local-options.json"); if(r.archiveCandidates[0].originalImages.length||r.checkpointCandidates[0].finalReceipts.length!==15||r.v610.originalPngMatches!==0||r.v613.matchingPublishedReceipts!==15||r.v613.missingPublishedReceipts.length!==21) process.exit(1); console.log("Originals 0/36, receipts 15/36, missing 21/36; local flags verified");'
