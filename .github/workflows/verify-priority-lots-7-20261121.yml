name: Verify the seventh priority workbook
on:
  push:
    branches: [codex/verify-priority-lots-7-20261121]
permissions:
  contents: read
jobs:
  workbook:
    name: Check exact product tree and reproducible Excel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_HEAD: 'bd99a770077ff69efceed8e4cefb0f1976043952'
      VERIFIED_CODE: 'cdb87f4a77503bcbc8a8c5f513904d14f791e639'
      EXPECTED_INVENTORY: '4ef812f07c98671f733cc1dd1abc7fac5041f384'
    steps:
      - name: Read the released tree and workbook inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'bd99a770077ff69efceed8e4cefb0f1976043952'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/build-priority-lots-workbook-20261121.mjs
            /scripts/lib/workbook-ooxml.mjs
            /production/YAUTJA_LOTS_P0_P3*20261121.json
            /production/YAUTJA_LOTS_P0_P3*20261121.xlsx
            /production/p3-source-audit-lot7-20261121.json
            /docs/qa/current-integration-20261103/runtime-inputs.json
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check the verified application and canonical runtime inventory
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_HEAD"
          git diff --exit-code "$VERIFIED_CODE" HEAD -- app public
          test "$(git diff --name-only "$VERIFIED_CODE" HEAD -- scripts tests)" = "$(printf '%s\n' 'scripts/build-priority-lots-workbook-20261121.mjs')"
          test "$(git rev-parse HEAD:scripts/build-priority-lots-workbook-20261121.mjs)" = 2c5a23a61e5cc4e7254c69f5a4b5b202f78ab801
          test "$(git rev-parse HEAD:docs/qa/current-integration-20261103/runtime-inputs.json)" = "$EXPECTED_INVENTORY"
          git diff --check "$VERIFIED_CODE" HEAD
      - name: Reproduce the seven published workbooks exactly
        run: |
          node scripts/build-priority-lots-workbook-20261121.mjs --check
          for lot in 2 3 4 5 6 7; do
            node scripts/build-priority-lots-workbook-20261121.mjs "--lot-$lot" --check
          done
      - name: Inspect Excel package, row counts and P3 provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          from xml.etree import ElementTree as ET

          prod = Path('production')
          prefix = 'YAUTJA_LOTS_P0_P3_LOT7_20261121'
          summary = json.loads((prod / (prefix + '.json')).read_text())
          assert [lot['priority'] for lot in summary['lots']] == ['P0', 'P1', 'P2', 'P3']
          counts = [len(lot['entries']) for lot in summary['lots']]
          assert counts == [2,1,2,2]
          assert all(0 <= count <= 10 for count in counts)
          assert len(summary['deliveries']) <= 10
          assert {entry['id'] for entry in summary['lots'][-1]['entries']} == {'ENFORCERS-V613-RECEIPTS', 'ENFORCERS-V610-TRACES'}
          p3 = json.loads(Path('production/p3-source-audit-lot7-20261121.json').read_text())
          assert p3['sourceCommit'] == summary['baseCommit']
          assert {entry['id'] for entry in p3['requirements']} == {'ENFORCERS-V613-RECEIPTS', 'ENFORCERS-V610-TRACES'}
          totals = p3['physicalWorkbooks']['totals']
          assert (totals['workbooks'], totals['sheets'], totals['rows']) == (4, 526, 58674)
          assert p3['v613C2paTimestamp']['summary']['allFinalFiles']['states']['Trusted'] == 36
          ns = {'s': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          with zipfile.ZipFile(prod / (prefix + '.xlsx')) as pack:
              assert pack.testzip() is None
              root = ET.fromstring(pack.read('xl/workbook.xml'))
              names = [sheet.get('name') for sheet in root.findall('s:sheets/s:sheet', ns)]
              assert names == ['Synthèse', 'P0', 'P1', 'P2', 'P3', 'Livraisons']
              for idx, count in enumerate(counts + [len(summary['deliveries'])], start=2):
                  sheet = ET.fromstring(pack.read(f'xl/worksheets/sheet{idx}.xml'))
                  assert len(sheet.findall('s:sheetData/s:row', ns)) == count + 4
                  assert sheet.find('s:autoFilter', ns).get('ref') == f'A4:G{count + 4}'
          print('PASS official source counts, reproducible workbook and delivery records:', counts, len(summary['deliveries']))
          PY
