name: Homeworld V160 PNG and workbook integrity

# Binary import completed at d57b93f608a36f95557bf623a390e12a640fe947.
# This workflow is now read-only: no remote packages, no auto-commit, no push.
on:
  pull_request:
    paths:
      - 'production/homeworld-v158/**'
      - 'production/homeworld-v160/**'
      - 'scripts/verify-homeworld-v158.mjs'
      - 'tests/homeworld-v158-intake.test.mjs'
      - 'app/game/systems/homeworldGeometryV64.ts'
      - 'app/game/data/homeworldAssetCatalogueTargetV81.json'
      - '.github/workflows/homeworld-v160-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-art-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/homeworld-v158/
            /production/homeworld-v160/
            /scripts/verify-homeworld-v158.mjs
            /tests/homeworld-v158-intake.test.mjs
            /app/game/systems/homeworldGeometryV64.ts
            /app/game/data/homeworldAssetCatalogueTargetV81.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated image verifier dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Verify V158 actual PNGs and native camera
        run: node scripts/verify-homeworld-v158.mjs
      - name: Missing and corrupt PNG regression tests
        run: node --test tests/homeworld-v158-intake.test.mjs
      - name: Verify 107 PNGs, nine-sheet workbook and 354 target identities
        run: python production/homeworld-v160/tools/verify.py
