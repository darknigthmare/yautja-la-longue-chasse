name: Vérification RTS, infiltration et quai W3
on:
  push:
    branches: [codex/p1-rts-coop-check-20261121]
permissions:
  contents: read
jobs:
  w3-shuttle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            app
            scripts
            tests
            public/game/homeworld/v64
            public/game/homeworld/v77
            public/audio
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test --test-reporter=spec tests/clan-supply-route-v109.test.mjs tests/space-routes-v159.test.mjs
      - run: node scripts/qa-w3-s18-campaign-route-20261121.mjs
      - run: npx --no-install eslint --max-warnings 0 app/game/ClanSupplyRouteV109.tsx app/game/ClanWarBibleV6Panel.tsx app/game/ClanWarPanelV85.tsx scripts/qa-w3-s18-campaign-route-20261121.mjs tests/browser/clan-w3-s18-campaign-route.fixture.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-w3-s18-v159
          path: outputs/qa-w3-s18-campaign-route-20261121
