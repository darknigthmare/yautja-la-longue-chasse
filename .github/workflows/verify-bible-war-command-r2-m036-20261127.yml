name: Verify Bible field command
on:
  push:
    branches: [codex/verify-bible-war-command-r2-m036-20261127]
permissions:
  contents: read
jobs:
  native:
    name: Native field command · ${{ matrix.choice }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        choice: [resupply, detour]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      WAR_COMMAND_INTRO_CHOICE: ${{ matrix.choice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /worker/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
            /.openai/hosting.json
            /public/**/manifest.json
      - name: Restore original declared assets without modifying their contents
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path.cwd()
          files={x['path'] for x in json.loads((root/'docs/qa/current-integration-20261103/runtime-inputs.json').read_text())['entries']}
          files.update(json.loads((root/'tests/fixtures/clan-ship-browser-assets.json').read_text())['paths'])
          files.update('public'+x['src'] for x in json.loads((root/'app/game/data/buriedCradleArt.json').read_text())['assets'].values())
          files.update(['public/game/prologue/v47/village.png','public/game/prologue/v47/arena.png','public/game/ships/v14/avp-predator-mothership.webp','public/game/ships/v12/classic-predator-spaceship.webp','public/game/ships/v13/classic-predator-spaceship-top.webp','public/game/backgrounds/ship-hub-v4.webp','public/game/backgrounds/jungle-depth-v4.webp','public/game/youth/v48/unblooded-left.png','public/game/youth/v48/unblooded-right.png'])
          for name in files:
            path=pathlib.PurePosixPath(name);assert not path.is_absolute() and '..' not in path.parts
          subprocess.run(['git','sparse-checkout','add','--stdin'],input='\n'.join('/'+p for p in sorted(files))+'\n',text=True,check=True)
          assert all((root/p).is_file() for p in files)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the command sortie and browser proof
        run: npx eslint app/game/ClanShipOperationsPanel.tsx app/game/WarCommandIntroR2M036Panel.tsx app/game/systems/warCommandIntroR2M036.ts app/game/systems/clanShipOperations.ts tests/war-command-intro-r2-m036.test.mjs scripts/qa-war-command-r2-m036.mjs
      - name: Check W3 orders, real ground tile traversal and save compatibility
        if: matrix.choice == 'resupply'
        run: node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/war-command-intro-r2-m036.test.mjs tests/clan-war-rts-squads-v133.test.mjs tests/clan-ship-operations-save.test.mjs
      - name: Typecheck the application
        if: matrix.choice == 'resupply'
        run: npm run typecheck
      - name: Play the command table and ground passage in GameClient
        run: node scripts/qa-war-command-r2-m036.mjs
      - name: Preserve original screenshots and receipts
        if: ${{ !cancelled() && hashFiles('outputs/qa-war-command-r2-m036/report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bible-war-command-${{ matrix.choice }}
          path: outputs/qa-war-command-r2-m036/
          if-no-files-found: error
