name: Verify Acheron and play its new signals in Chromium
on:
  push:
    branches: ['codex/verify-bible-acheron-vacuum-20261127']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 4
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.openai/
            /app/
            /tests/
            /scripts/
            /lib/
            /types/
            /desktop/
            /worker/
            /build/
            /docs/campagne/
            /public/game/backgrounds/ruins-depth-v8.png
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/sprites/v62/heads/
            /public/game/sprites/v62/masks/
            /public/game/assets/v139/rig-gauntlets/
            /public/game/assets/v47/
            /public/game/sprites/v7/enemies/
            /public/game/sprites/v8/ecology/
            /public/game/planet-arrival/
            /public/game/ship/
            /public/game/homeworld/v47/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues-index.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Acheron contacts, attack behavior, sound and resume
        run: node --experimental-strip-types --test tests/acheron-vacuum.test.mjs tests/hunt-systems.test.mjs tests/sound-lifecycle.test.mjs tests/hunt-pod-recovery.test.mjs tests/active-hunt-save.test.mjs
      - name: Typecheck the native hunt
        run: npm run typecheck
      - name: Lint changed sources and tests
        run: node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/HuntCanvas.tsx app/game/sound.ts app/game/systems/acheronVacuum.ts app/game/systems/huntSystems.ts tests/acheron-vacuum.test.mjs

      - name: Play scan and movement before the Guardian
        run: |
          node node_modules/playwright-core/cli.js install chromium
          node scripts/qa-acheron-vacuum.mjs
          cat outputs/qa-acheron-vacuum/report.json
      - name: Save screenshots and tested receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acheron-vacuum-chromium
          path: outputs/qa-acheron-vacuum/
          if-no-files-found: warn
