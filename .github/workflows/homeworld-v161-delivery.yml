name: Homeworld V161 native module integrity
# Import completed at 46a7ec54b2821f254c7e4292bb23c4a4460d8ed2.
# Read-only validation; no package download, commit or push.
on:
  pull_request:
    paths:
      - 'production/homeworld-v161/**'
      - '.github/workflows/homeworld-v161-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/homeworld-v161/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Verify three native PNGs, rejected-output record and workbook
        run: python production/homeworld-v161/tools/verify.py
