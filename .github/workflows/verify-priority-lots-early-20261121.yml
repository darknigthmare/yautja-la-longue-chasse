name: Verify authored extraction with a full field bag
on:
  push:
    branches: [codex/verify-swamp-payload-20261121]
permissions:
  contents: read
jobs:
  harvest:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: jungle-visible-seed6-shared
            mission: jungle-vey
            previousWins: 5
            args: --insertion=visible-ship --policy=shared
          - profile: jungle-visible-seed6-native
            mission: jungle-vey
            previousWins: 5
            args: --insertion=visible-ship
          - profile: jungle-visible-seed6-early
            mission: jungle-vey
            previousWins: 5
            args: --insertion=visible-ship --policy=shared --sweepEarly=true --sweepDistance=210
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /scripts/
            /tests/
            /docs/qa/v112-ground-campaign/campaign-origin-save.json
            /docs/qa/v112-ground-campaign/tool-origin.json
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify ground-policy unit regressions
        run: node --test tests/qa-hunt-ground-policy-v112.test.mjs
      - name: Earn the documented encounter number by playing prior victories
        env:
          HUNT_MISSION: ${{ matrix.mission }}
          SEED_WINS: ${{ matrix.previousWins }}
        run: |
          save=docs/qa/v112-ground-campaign/campaign-origin-save.json
          for (( attempt=1; attempt<=SEED_WINS; attempt++ )); do
            out="outputs/qa-origin/$attempt"
            node scripts/qa-hunt-ground-campaign-v112.mjs --mission="$HUNT_MISSION" --armor=hunter --replay=true --seconds=240 --baseSave="$save" --output="$out" --successSave="$out/after-win.json"
            save="$out/after-win.json"
          done
          printf 'EARNED_SAVE=%s\n' "$save" >> "$GITHUB_ENV"
      - name: Play the declared extraction with a real empty bag
        run: node scripts/qa-hunt-ground-campaign-v112.mjs --mission=${{ matrix.mission }} --armor=scout --baseSave="$EARNED_SAVE" --harvest=true --harvestSweep=true ${{ matrix.args }} --replay=true --seconds=360 --minimumRetainedLoad=1 --output=outputs/qa-native-load
      - name: Describe the observed stock after the attempt
        if: always()
        run: |
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const file = JSON.parse(await readFile("outputs/qa-native-load/" + process.argv[1] + "-scout.json", "utf8"));
            console.log(JSON.stringify({
              profile: process.argv[2],
              full: file.retainedLoad.qualified,
              harvest: file.harvestDecisions,
              phases: file.events.map(({phase,t,x,health,message,kills})=>({phase,t,x,health,message,kills})),
              final: {threats:file.terminal.threats,result:file.result?.outcome,load:file.retainedLoad.atExtraction?.load},
            }));
          ' "${{ matrix.mission }}" "${{ matrix.profile }}"
      - name: Preserve the complete native outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.profile }}
          path: |
            outputs/qa-origin/
            outputs/qa-native-load/
          if-no-files-found: error
