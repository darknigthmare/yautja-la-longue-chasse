name: QA campaign coop existing save contracts
on:
  push:
    branches: [codex/qa-bible-campaign-coop-20261127]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '1b8be6a0f46e72fb3677b1c22c28f19fbe867268'
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: test "$(git rev-parse HEAD)" = 1b8be6a0f46e72fb3677b1c22c28f19fbe867268
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test --test-concurrency=1 tests/honor-sources-v169.test.mjs tests/honor-progression-v166.test.mjs tests/save-recovery-import.test.mjs tests/active-hunt-save.test.mjs
