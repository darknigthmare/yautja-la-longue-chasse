      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize source assets actually used by the scenes
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs catalogue
          ASSET_RACCORDS_PREPARE_ONLY=1 node scripts/qa-asset-raccords-browser-20261120.mjs
      - name: Build and start the production application
        id: server
        run: |
          mkdir -p outputs/p0p1-native
          npm run build:production
          npm run start:production -- --hostname 127.0.0.1 --port 3121 > outputs/p0p1-native/next-server.log 2>&1 &
          for attempt in {1..70}; do
            if curl --fail --silent http://127.0.0.1:3121/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3121/ > /dev/null
          printf 'YAUTJA_QA_BUILD_ID=%s\n' "$(cat .next/BUILD_ID)" >> "$GITHUB_ENV"
      - name: Physical clan logistics, keyboard and conflicting tabs
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/qa-clan-supply-route-v109.mjs
      - name: Workshop palette, masks and durable equipment
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/qa-phg-decal-parity.mjs
      - name: Native stealth controls and map descriptions
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          YAUTJA_WAR_STEALTH_OUTPUT: outputs/p0p1-native/stealth-v114
        run: node scripts/qa-clan-war-stealth-accessibility-v114.mjs
      - name: Native mentor approach, examination and receipt after reload
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          CRADLE_RETURN_QA_URL: http://127.0.0.1:3121/
          CRADLE_RETURN_QA_COMMIT: f9bf35ea2553b512d15aea76049fd4bc4afb1b66
          CRADLE_RETURN_QA_OUTPUT: outputs/p0p1-native/cradle-return
