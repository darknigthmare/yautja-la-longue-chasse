      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact locked dependencies without lifecycle scripts
        id: dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Next route and environment types
        run: node node_modules/next/dist/bin/next typegen
      - name: Check application TypeScript
        run: npm run typecheck
      - name: Exercise current V112 hunting mechanics and invariants
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/*-v112.test.mjs
      - name: Verify deterministic V112 workbook and discovery resources
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node scripts/build-hunt-mechanics-workbook-v112.mjs --check
          python3 scripts/verify-hunt-mechanics-workbook-v112.py
          node scripts/build-discovery-signals-v112.mjs --check
      - name: Exercise actual V112 controls, workshop, corpse rites and canopy in Chromium
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-hunt-mechanics-browser-v112.mjs
      - name: Upload bounded V112 browser report and inspected-capture candidates
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunt-v112-browser-${{ github.run_id }}
          path: outputs/qa-hunt-v112/
          retention-days: 7
          if-no-files-found: ignore
      - name: Verify V111 hunt compatibility guards and reproducible hunting workbook
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/hunt-jump-assist-runtime.test.mjs tests/jump-assist.test.mjs tests/enemy-trophy-runtime-v18.test.mjs tests/hunt-rites-v77.test.mjs tests/trophy-ritual.test.mjs
          node scripts/build-hunt-mechanics-workbook.mjs --check
          python3 scripts/verify-hunt-mechanics-workbook-v111.py
      - name: Verify V6.14 native images, cumulative history and unchanged sprite defaults
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --experimental-strip-types --test tests/enforcer-production-v614.test.mjs
      - name: Verify V6.15 infants, all 144 native PNGs and all 17 prior workbooks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --experimental-strip-types --test tests/npc-production-v615.test.mjs
      - name: Compile Next application source (not full release packaging)
        id: compile
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node node_modules/next/dist/bin/next build --webpack
      - name: Smoke the compiled Next HTTP server and protected QA routes
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: npm run qa:next-production
      - name: Lint changed game runtime
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
