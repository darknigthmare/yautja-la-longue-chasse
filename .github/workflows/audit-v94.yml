permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Targeted V94 regressions (not full game QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout only source required by these tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /vercel.json
            /.vercelignore
            /app/game/Mausoleum.tsx
            /app/game/useHomeworldMotionAssetsV74.ts
            /app/game/useNativeImageAssetsV94.ts
            /app/game/systems/campaignWorldResumeV70.ts
            /app/game/systems/*V94.ts
            /scripts/build-production-v94.mjs
            /tests/*-v94.test.mjs
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run targeted regression tests (no dependency install)
        run: npm run test:audit:v94

  application:
    name: Application compile, types, runtime lint and browser integration
    runs-on: ubuntu-24.04
    # V106 used about 25 minutes; keep room for the additional V107 checks.
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      AUDIT_CHROME_CHANNEL: chrome
    steps:
      - name: Checkout application source and real manifests without multi-gigabyte artwork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
