name: V94 regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'desktop/**'
      - 'build/**'
      - 'public/**/manifest.json'
      - 'public/game/homeworld/v74/**'
      - '.openai/hosting.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'eslint.config.mjs'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/audit-v94.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Targeted V94 regressions (not full game QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout only source required by these tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /vercel.json
            /.vercelignore
            /app/game/Mausoleum.tsx
            /app/game/useHomeworldMotionAssetsV74.ts
            /app/game/useNativeImageAssetsV94.ts
            /app/game/systems/campaignWorldResumeV70.ts
            /app/game/systems/*V94.ts
            /scripts/build-production-v94.mjs
            /tests/*-v94.test.mjs
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run targeted regression tests (no dependency install)
        run: npm run test:audit:v94

  application:
    name: Application compile, types, runtime lint and browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      AUDIT_CHROME_CHANNEL: chrome
    steps:
      - name: Checkout application source and real manifests without multi-gigabyte artwork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /desktop/
            /scripts/
            /tests/
            /db/
            /worker/
            /drizzle/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/homeworld/v74/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact locked dependencies without lifecycle scripts
        id: dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Next route and environment types
        run: node node_modules/next/dist/bin/next typegen
      - name: Check application TypeScript
        run: npm run typecheck
      - name: Compile Next application source (not full release packaging)
        id: compile
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node node_modules/next/dist/bin/next build --webpack
      - name: Smoke the compiled Next HTTP server and protected QA routes
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: npm run qa:next-production
      - name: Lint changed game runtime
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
          app/game/Mausoleum.tsx app/game/useHomeworldMotionAssetsV74.ts
          app/game/useNativeImageAssetsV94.ts app/game/useTrophyWorkshopRuntimeV94.ts
          app/game/TrainingDrill.tsx app/game/useTrainingDrillRuntimeV94.ts
          app/game/useMenuGamepad.ts
          app/game/systems/campaignWorldResumeV70.ts
          app/game/systems/campaignResumePriorityV94.ts
          app/game/systems/heldDirectionV94.ts
          app/game/systems/nativeImagePreloadV94.ts
          app/game/systems/pageActivityV94.ts
          app/game/systems/phaseClockV94.ts
          app/game/GalaxyMapPanel.tsx app/game/GlassDesertExpedition.tsx
          app/game/HomeworldExpedition.tsx app/game/HomeworldHub.tsx
          app/game/HomeworldPassageV67.tsx app/game/HomeworldRegionV68.tsx
          app/game/HomeworldSpatialCodex.tsx app/game/HomeworldWayfindingV75.tsx
          app/game/HomeworldWorldMapV77.tsx app/game/PhysicalShipDeck.tsx
          app/game/PitCanvas.tsx app/game/ShipHub.tsx app/game/TrophyWorkshop.tsx
          app/game/ClanWarPanelV85.tsx app/game/systems/clanWarSessionV85.ts app/game/systems/clanWarCanyonV85.ts
          app/game/ClanWarAtlasV95.tsx app/game/systems/clanWarAtlasV95.ts
          app/game/HuntCanvas.tsx app/game/GameClient.tsx app/game/systems/huntStructuralBarrierV94.ts
      - name: Exercise input resilience, fixed-step edges and original V74 metadata
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1
          tests/homeworld-input-runtime.test.mjs tests/ship-hub-input-runtime.test.mjs
          tests/ash-expedition-input-runtime.test.mjs tests/regional-input-edges-v94.test.mjs
          tests/homeworld-motion-assets-v74.test.mjs tests/hunt-input-runtime.test.mjs
          tests/pit-gamepad-assignments.test.mjs
          tests/regional-lifecycle-v94.test.mjs tests/scene-image-loader-v94.test.mjs
      - name: Verify combat structural barriers and boss whiffs
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          tests/hunt-structural-gates-v94.test.mjs
          tests/hunt-melee-combat.test.mjs
          tests/hunt-projectile-runtime.test.mjs
          tests/platform-collision.test.mjs
      - name: Validate imported V6 dialogue archive references
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test tests/dialogues-v6-import.test.mjs
      - name: Exercise menu control unit regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:menu-controls:v94
      - name: Exercise disabled controls with the real menu gamepad hook
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-menu-controls-browser-v94.mjs
      - name: Exercise historical persistence regressions (not the entire test suite)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1
          tests/campaign-slots.test.mjs
          tests/active-hunt-save.test.mjs
          tests/active-hunt-ownership.test.mjs
          tests/archive-transfer-guard.test.mjs
          tests/campaign-import-slot-v89.test.mjs
      - name: Exercise native storage and cross-tab locks (seeded campaigns)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-campaign-storage-browser-v94.mjs
      - name: Exercise React image lifecycle and native PNG decoding (1x1 fixtures)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-native-assets-browser-v94.mjs
      - name: Exercise scene image deadlines and refresh with the native decoder
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-scene-images-browser-v94.mjs
      - name: Exercise actual Mausoleum React component (placeholder art, emulated pad)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-mausoleum-browser-v94.mjs
      - name: Exercise free clan-war durability, lifecycle and planetary atlas regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node --test --test-reporter=spec --test-concurrency=1
          tests/clan-war-session-v85.test.mjs tests/clan-war-durability-v94.test.mjs
          tests/clan-war-lifecycle-v94.test.mjs tests/clan-war-canyon-validity-v94.test.mjs
          tests/clan-war-atlas-v95.test.mjs tests/clan-war-atlas-ui-v95.test.mjs
      - name: Exercise actual clan-war panel and native locked storage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          AUDIT_CHROME_HEADED: '1'
        run: xvfb-run -a node scripts/qa-clan-war-browser-v94.mjs
      - name: Exercise trophy workshop lifecycle and historical ritual rules
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1
          tests/trophy-workshop-lifecycle-v94.test.mjs tests/trophy-workshop.test.mjs tests/trophy-ritual.test.mjs
      - name: Complete all four workshop sequences in the actual React panel
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-trophy-workshop-browser-v94.mjs
      - name: Exercise training lifecycle and all existing drill rules
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1
          tests/training-lifecycle-v94.test.mjs tests/training-drill.test.mjs
      - name: Play all five native training sequences and input interruption cases
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-training-browser-v94.mjs
