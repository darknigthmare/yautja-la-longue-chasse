name: Verify the Quatza-Rij preflight in compiled Next
on:
  push:
    branches: [codex/verify-quatza-final-20261121]
    paths: ['.github/workflows/verify-quatza-next-20261121.yml']
permissions:
  contents: read
jobs:
  browser:
    name: Play the Quatza solo preflight and recover its exact position
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '${{ github.sha }}'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      AUDIT_CHROME_CHANNEL: chrome
      PHG_QA_URL: http://127.0.0.1:3121
      YAUTJA_QA_BASE_URL: http://127.0.0.1:3121
      YAUTJA_QA_MODE: compiled-app
      AUDIT_CHROME_EXECUTABLE: /usr/bin/google-chrome
      YAUTJA_QA_RUNTIME_COMMIT: '${{ github.sha }}'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
