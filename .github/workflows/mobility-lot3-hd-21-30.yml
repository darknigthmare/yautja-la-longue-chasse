name: Mobility - individual HD sources 21-30
on:
  push:
    branches: [claude/bible-de-campagne]
    paths:
      - .github/workflows/mobility-lot3-hd-21-30.yml
      - docs/campagne/mobilite/IMPORT_LOT3_HD_21_30_20261106.json
      - docs/campagne/mobilite/import_lot3_hd_20261106.py
permissions:
  contents: write
concurrency:
  group: mobility-lot3-hd-21-30-pr116
  cancel-in-progress: true
jobs:
  import-verify:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse' && github.ref == 'refs/heads/claude/bible-de-campagne'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUEST_SHA: 9f5762ce9b047850a39a26fad5ec7111111756a5e147d4fd3610ac3bd8164778
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            docs/campagne/mobilite
            art-source/mobilite
      - name: Verify audited importer and historical source receipt
        run: |
          echo '08f59e10d842e9b437d92c088e3ba57e4a4622532cabbe03a49e06d5f5b60362  docs/campagne/mobilite/import_lot3_hd_20261106.py' | sha256sum --check
          echo '04cc66509c183e78075d9069d02371da51163aabcfcc8c5af5b43bdde7fe785e  docs/campagne/mobilite/DEPOT_COMPLET_SPRITES_20261106.json' | sha256sum --check
      - name: Import ten exact native PNGs and document the remaining twenty
        run: python3 docs/campagne/mobilite/import_lot3_hd_20261106.py --request-sha256 "$REQUEST_SHA"
      - name: Read back 97 PNGs and their metadata without writes
        run: python3 docs/campagne/mobilite/import_lot3_hd_20261106.py --request-sha256 "$REQUEST_SHA" --check-only
      - name: Stage only source art and its documentation, then test idempotence
        shell: bash
        run: |
          set -euo pipefail
          git add -- art-source/mobilite/vehicules-montures/v0.2-individual-hd art-source/mobilite/INDEX_SOURCES_ACTUEL.md docs/campagne/mobilite/LOT3_HD_21_30_20261106.json docs/campagne/mobilite/ETAT_SPRITES_HD_20261106.json docs/campagne/mobilite/LOT3_HD_21_30_20261106.md docs/campagne/mobilite/REPRISE_HD_31_50.json docs/campagne/mobilite/README.md docs/campagne/mobilite/PRODUCTION_VISUELLE.md
          python3 docs/campagne/mobilite/import_lot3_hd_20261106.py --request-sha256 "$REQUEST_SHA"
          git diff --exit-code -- art-source/mobilite docs/campagne/mobilite
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          doc=Path('docs/campagne/mobilite')
          lot=json.loads((doc/'LOT3_HD_21_30_20261106.json').read_text())
          current=json.loads((doc/'ETAT_SPRITES_HD_20261106.json').read_text())
          queue=json.loads((doc/'REPRISE_HD_31_50.json').read_text())
          images={e['path'] for e in lot['entries']}
          documents={str(doc/name) for name in ['LOT3_HD_21_30_20261106.json','ETAT_SPRITES_HD_20261106.json','LOT3_HD_21_30_20261106.md','REPRISE_HD_31_50.json','README.md','PRODUCTION_VISUELLE.md']}
          documents.add('art-source/mobilite/INDEX_SOURCES_ACTUEL.md')
          staged=set(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          assert not staged or staged==images|documents, sorted(staged^(images|documents))
          assert not staged or len(staged)==17
          assert len(images)==10 and current['png_count']==97 and current['catalogue_individual_hd_count']==30
          assert [j['index'] for j in queue['jobs']]==list(range(31,51))
          assert all(j['generated'] is False for j in queue['jobs'])
          assert all(not e['runtime_integrated'] and not e['canonical_1_to_1_certified'] and not e['human_art_validated'] for e in lot['entries'])
          print(json.dumps({'staged_files':len(staged),'new_individual_hd':10,'all_png':97,'missing_individual_hd':20,'runtime_modified':False}))
          PY
          git diff --cached --check
      - name: Commit into the existing bible PR without force or merge
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'art(mobilite): ajouter dix PNG HD 21-30 et garder 31-50 ouverts [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/claude/bible-de-campagne; then
              git log -1 --format='Published source commit: %H'
              exit 0
            fi
            git fetch --no-tags origin claude/bible-de-campagne
            git rebase FETCH_HEAD || exit 1
            python3 docs/campagne/mobilite/import_lot3_hd_20261106.py --request-sha256 "$REQUEST_SHA" --check-only
          done
          exit 1
