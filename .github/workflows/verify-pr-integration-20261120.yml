name: Verify save controls and physical route persistence

on:
  push:
    branches: [codex/verify-pr-integration-20261120]

permissions:
  contents: read

jobs:
  legacy-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '57cb3c0f9379279a8e1de6228afcfaa43d0067d5'
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '57cb3c0f9379279a8e1de6228afcfaa43d0067d5'
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /build/
            /worker/
            /.openai/
            /.github/workflows/
            /docs/
            /public/**/manifest.json
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize the official inputs
        run: node scripts/materialize-asset-raccords-20261120.mjs runtime
      - name: Install dependencies and exercise the two changed fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/save-v2.test.mjs tests/homeworld-passage-persistence-v67.test.mjs
