name: Verify legacy replay rewards under the new honor limits

on:
  push:
    branches:
      - codex/verify-pr-integration-20261120

permissions:
  contents: read

concurrency:
  group: yautja-warp-honor-qualification-20261120
  cancel-in-progress: true

env:
  FINAL_CANDIDATE_SHA: '767e71348b2275a7c8869230a953aa9dc5a2e6f8'

jobs:
  save-regression:
    name: Legacy saves, trophy rewards and replay honor
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      INTEGRATION_MAIN: fc4252e3e50535ec1b7e3b7470c42d29dea51568
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.FINAL_CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 3
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /tests/
            /scripts/
            /build/
            /worker/
            /.openai/
            /.github/workflows/
            /docs/
            /public/**/manifest.json
            /public/game/warp/w02/
            /public/game/hounds/v147/
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
            /art-source/v113/20261120-integration/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize runtime and install pinned dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise the updated rewards and the prior save tests
        run: node --experimental-strip-types --test --test-reporter=spec tests/save-v2.test.mjs
