name: Verify the legacy save controls with the hound action

on:
  push:
    branches: [codex/verify-pr-integration-20261120]

permissions:
  contents: read

jobs:
  save-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout the pinned save test and game
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '532da0de5d651111c08a1d636f55c4f4aaacf6b3'
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /build/
            /worker/
            /docs/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the dependency lock and run the save suite
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test --test-reporter=spec tests/save-v2.test.mjs
