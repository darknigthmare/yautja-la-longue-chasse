name: Reserve V6 route typecheck

on:
  pull_request:
    branches: [claude/reserve-grand-hunts]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.ts
            /*.mts
            /*.json
            /eslint.config.mjs
            /.openai/
            /app/
            /desktop/
            /scripts/
            /tests/
            /build/
            /drizzle/
            /supabase/
            /public/game/assets/v14/hunter-kit/manifest.json
            /public/game/assets/v15/trophies/manifest.json
            /public/game/assets/v16/franchise-trophies/manifest.json
            /public/game/assets/v17/enemy-trophies/manifest.json
            /public/game/assets/v18/enemy-trophy-gameplay/manifest.json
            /public/game/assets/v28/sprite-review/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Next route types and check application TypeScript
        run: npx --no-install next typegen && npm run typecheck -- --incremental false
      - name: Lint reserve UI
        run: npx --no-install eslint app/game/GameReserveV66.tsx
