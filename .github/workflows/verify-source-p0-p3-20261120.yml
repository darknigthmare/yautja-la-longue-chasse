name: Verify final Cradle and hunt regression tests

on:
  push:
    branches: [codex/verify-field-rites-20261120]

permissions:
  contents: read

concurrency:
  group: yautja-p0-p3-final-test-20261120
  cancel-in-progress: false

jobs:
  source:
    name: Final Cradle, ship flow, field receipts and scene audio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: 'a063a1becb853eba16db2cb9204e64c172976c75'
      BASE_COMMIT: '04d493265a14fb51faa4d811553beb8ff26767cc'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'a063a1becb853eba16db2cb9204e64c172976c75'
          persist-credentials: false
          fetch-depth: 3
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /public/game/xeno-prime/berceau-v1/
            /public/**/manifest.json
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise the canonical campaign and hearing contracts
        run: |
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/buried-cradle-campaign.test.mjs tests/game-client-ship-flow.test.mjs tests/harvest-inventory-v112.test.mjs tests/clan-war-four-modes-v138.test.mjs tests/scene-audio.test.mjs
      - name: Strict lint of final test
        run: node node_modules/eslint/bin/eslint.js --max-warnings=0 tests/buried-cradle-campaign.test.mjs
