name: QA ouverture R2-M001
on:
  push:
    branches: [codex/qa-bible-m001-20261127]
permissions:
  contents: read
jobs:
  courtyard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*
            /package.json
            /package-lock.json
            /tsconfig.json
            /eslint.config.mjs
            /next-env.d.ts
            /app/
            /lib/
            /types/
            /tests/
            /worker/
            /docs/
            /scripts/
            /public/game/prologue/
            /public/game/homeworld/v72/
            /public/game/youth/v48/
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint app/game/NurseryPrologueScreen.tsx app/game/nurseryRendering.ts app/game/systems/nursery{Opening,Prologue,Campaign,ContinuityV72}.ts tests/nursery-opening.test.mjs
      - run: node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/nursery-opening.test.mjs tests/nursery-cohort-v172.test.mjs tests/nursery-continuity-v72.test.mjs tests/nursery-campaign.test.mjs tests/nurseryPrologue.test.ts
      - run: npx tsc --noEmit --incremental false 2>&1 | tee /tmp/opening-typescript.log
      - run: |
          if rg 'app/game/(ClanChroniclePanel|NurseryPrologueScreen|nurseryRendering|systems/nursery(CohortV172|Opening|Prologue|Campaign|ContinuityV72))' /tmp/opening-typescript.log; then exit 1; fi
      - run: node tests/qa-nursery-opening.playwright.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-ouverture-r2-m001
          path: opening-*.png
