      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Include the interior artwork and shared ship services
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { paths } = JSON.parse(readFileSync('tests/fixtures/clan-ship-browser-assets.json', 'utf8'));
          assert.equal(new Set(paths).size, paths.length);
          for (const file of paths) {
            assert.match(file, /^public\/game\/[A-Za-z0-9._/-]+$/);
            assert.ok(file.split('/').every(part => part && part !== '.' && part !== '..'));
          }
          execFileSync('git', ['sparse-checkout', 'add', '--stdin'], { input: paths.map(file => '/' + file).join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'] });
          assert.deepEqual(paths.filter(file => !existsSync(file)), [], 'Every declared route asset must exist in this exact checkout');
          console.log('Interior and shared service assets included:', paths.length);
          NODE
      - name: Materialize source assets actually used by the scenes
        id: inputs
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs catalogue
          ASSET_RACCORDS_PREPARE_ONLY=1 node scripts/qa-asset-raccords-browser-20261120.mjs
      - name: Validate the repair transaction and registered armor layers
        run: |
          set -o pipefail
          mkdir -p outputs/p0-p3-20261121
          node --experimental-strip-types --test --test-reporter=spec tests/hunter-forge-wear-v172.test.mjs tests/hunter-share-pattern-v146.test.mjs tests/hunter-customization-v146.test.mjs tests/hunter-armor-chromatic-clipping.test.mjs tests/harvest-inventory-v112.test.mjs 2>&1 | tee outputs/p0-p3-20261121/hunter-forge-node.log
      - name: Strict lint of the armor and workshop paths
        if: ${{ !cancelled() && steps.inputs.conclusion == 'success' }}
        run: node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/systems/hunterCustomizationPersistenceV146.ts app/game/HunterPieceForgeV146.tsx tests/hunter-forge-wear-v172.test.mjs scripts/qa-hunter-forge-wear-20261121.mjs
      - name: Build and start the production application
        id: server
        if: ${{ !cancelled() && steps.inputs.conclusion == 'success' }}
        run: |
          mkdir -p outputs/p0-p3-20261121
          set -o pipefail
          npm run build:production 2>&1 | tee outputs/p0-p3-20261121/build.log
          npm run start:production -- --hostname 127.0.0.1 --port 3121 > outputs/p0-p3-20261121/next-server.log 2>&1 &
          for attempt in {1..70}; do
            if curl --fail --silent http://127.0.0.1:3121/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3121/ > /dev/null
          printf 'YAUTJA_QA_BUILD_ID=%s\n' "$(cat .next/BUILD_ID)" >> "$GITHUB_ENV"
      - name: Confirm the bone debit and the durable tool reinforcement
        if: ${{ !cancelled() && steps.server.conclusion == 'success' }}
        env:
          HUNTER_FORGE_QA_COMMIT: 'de055c0582c6caebfd9e033300f36b13f12eb272'
        run: node scripts/qa-hunter-forge-wear-20261121.mjs
      - name: Preserve the compiled browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-forge-wear-${{ github.sha }}
          path: |
            outputs/p0-p3-20261121/
            outputs/qa-hunter-forge-wear/
          if-no-files-found: error

  durable-field:
    name: Skin, harvest, reload and verify the reinforced wear at extraction
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      SKINNING_CANOPY_QA_CASE: 'field'
      SKINNING_CANOPY_QA_TOOL: 'reinforced'
      SKINNING_CANOPY_QA_OUTPUT: outputs/qa-skinning-canopy-20261109
    steps:
      - name: Checkout current application and exact asset index
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'de055c0582c6caebfd9e033300f36b13f12eb272'
          persist-credentials: false
          fetch-depth: 3
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /tests/
            /scripts/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
            /docs/qa/current-integration-20261103/runtime-inputs.json
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize and verify the original assets actually used by this recipe
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,lstatSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const index=JSON.parse(readFileSync('tests/fixtures/skinning-canopy-browser-assets-20261109.json','utf8'));
          assert.equal(index.schemaVersion,1);
          assert.ok(index.assets.length>0);
          const trackedCatalog = 'public/audio/manifest.json';
          const current = JSON.parse(readFileSync('docs/qa/current-integration-20261103/runtime-inputs.json','utf8'));
          // The live sound catalog can gain entries. Keep the historical pin for
          // old snapshots and verify the live catalog against the release inventory.
          const releaseCatalog = current.entries.find(asset => asset.path === trackedCatalog);
          const assets = index.assets.map(asset => asset.path === trackedCatalog && releaseCatalog
            ? {...releaseCatalog,gitBlob:execFileSync('git',['rev-parse','HEAD:'+trackedCatalog],{encoding:'utf8'}).trim()}
            : asset);
          const seen=new Set();
          for(const asset of assets){
            assert.ok(asset.path.startsWith('public/')&&!asset.path.includes('..')&&!asset.path.includes('\\'));
            assert.ok(!seen.has(asset.path));seen.add(asset.path);
            assert.match(asset.gitBlob,/^[a-f0-9]{40}$/);
            assert.match(asset.sha256,/^[a-f0-9]{64}$/);
          }
          execFileSync('git',['sparse-checkout','add','--stdin'],{input:[...seen].sort().map(p=>'/'+p).join('\n')+'\n',stdio:['pipe','inherit','inherit']});
          let bytes=0;
          for(const asset of assets){
            const info=lstatSync(asset.path);assert.ok(info.isFile()&&!info.isSymbolicLink());
            const raw=readFileSync(asset.path);bytes+=raw.length;
            assert.equal(raw.length,asset.bytes,asset.path);
            assert.equal(createHash('sha256').update(raw).digest('hex'),asset.sha256,asset.path);
            assert.equal(execFileSync('git',['hash-object','--',asset.path],{encoding:'utf8'}).trim(),asset.gitBlob,asset.path);
          }
          console.log(JSON.stringify({originalAssets:seen.size,bytes,substituteAssets:false}));
          NODE
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize current V19 sector bindings without rewriting the historical index
        run: node scripts/materialize-asset-raccords-20261120.mjs hunt-runtime
      - name: Strict lint of the full GameClient browser recipe
        run: node node_modules/eslint/bin/eslint.js --max-warnings=0 scripts/qa-skinning-canopy-durable-browser-20261109.mjs tests/browser/skinning-canopy-durable-20261109.fixture.jsx
      - name: Play field work, durable reloads, extraction, workshop and canopy
        run: node scripts/qa-skinning-canopy-durable-browser-20261109.mjs
      - name: Preserve the actual browser report and original captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skinning-canopy-durable-${{ github.sha }}
          path: |
            outputs/qa-skinning-canopy-20261109/
            outputs/qa-asset-raccords-20261120/materialization-hunt-runtime.json
          if-no-files-found: error
          retention-days: 30
