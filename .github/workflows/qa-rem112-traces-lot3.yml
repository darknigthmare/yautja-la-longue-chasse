name: P0 Ice field HUD and ground-policy regressions
on:
  push:
    branches: [codex/qa-rem112-traces-lot3-20261121]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /tests/
            /scripts/
            /public/**/manifest.json
            /public/game/assets/v19/biome-decor/ice/plt/plt-glacier-shelf-01-low-wide.webp
            /public/game/assets/v19/biome-decor/ice/plt/plt-mine-gantry-01-low-wide.webp
            /public/game/assets/v19/biome-decor/ice/orn/orn-emergency-beacon-01-single.webp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check real Ice copy, lower crossing decision, and legal harvest preferences
        run: |
          node --experimental-strip-types --test --test-concurrency=1 --test-reporter=spec             tests/ice-exploration-region.test.mjs tests/qa-hunt-ground-policy-v112.test.mjs tests/hunt-canopy-runtime-v112.test.mjs tests/hunt-input-runtime.test.mjs
      - name: Lint changed native HUD, physics hint and verification scripts
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
          app/game/HuntCanvas.tsx app/game/systems/iceExplorationRegion.ts
          scripts/lib/qa-hunt-campaign-input-v112.mjs
          scripts/lib/qa-hunt-ground-harvest-v112.mjs
          scripts/qa-hunt-ground-campaign-v112.mjs scripts/qa-hunt-campaign-browser-v112.mjs
          tests/ice-exploration-region.test.mjs tests/qa-hunt-ground-policy-v112.test.mjs
