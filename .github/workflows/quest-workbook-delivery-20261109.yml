name: Publish verified quest workbook 20261109
on:
  push:
    branches: [feat/quetes-vivantes-bible-20261109]
    paths: [.github/workflows/quest-workbook-delivery-20261109.yml]
permissions:
  contents: write
concurrency:
  group: quest-workbook-delivery-20261109
  cancel-in-progress: false
jobs:
  workbook:
    if: github.ref == 'refs/heads/feat/quetes-vivantes-bible-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/quetes-vivantes-20261109/
      - name: Verify immutable package and reconstruct the original native XLSX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,json,lzma,os,pathlib,urllib.request,zipfile,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          ids=['11faca022d4d9c07618aa1408525cf10f8d328c7','17cd9660771700190fc59a2bb96aefa6a00d816d','ae162f8a58b7cd9913b34ae8dfe518d77f70f979','e0a269ef260ea3640b258fd57249a70a0e3b486a','93afec64405ea125704b961356bfdc2acd9ba5ef','9ff5c777511271ee3c4aba189dca5a57abd10a0d']
          parts=[]
          for sha in ids:
            req=urllib.request.Request('https://api.github.com/repos/darknigthmare/yautja-la-longue-chasse/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=60) as response:data=json.load(response)
            raw=base64.b64decode(data['content'])
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
            parts.append(raw)
          packed=base64.b64decode(b''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='fe11da03cee765ab1c3a4e58676c40f6d63d58a0d912d09387cee022f4916f15'
          payload=json.loads(lzma.decompress(packed))
          name='production/quetes-vivantes-20261109/Yautja_Quetes_Vivantes_Bible_20261109.xlsx'
          receipt='production/quetes-vivantes-20261109/verification-classeur.json'
          assert payload['xlsxPath']==name and payload['zipEntriesEncoding']=='utf-8'
          assert set(payload['textFiles'])=={receipt}
          for path in [name,receipt]:
            p=root/path
            assert not p.exists() and all(not q.is_symlink() for q in [p,*p.parents]),path
          output=io.BytesIO()
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_STORED) as z:
            for path,content in sorted(payload['zipEntries'].items()):
              p=pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts
              info=zipfile.ZipInfo(path,date_time=(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.create_system=3;info.external_attr=0o600<<16
              z.writestr(info,content.encode('utf-8'))
          raw=output.getvalue();sha=hashlib.sha256(raw).hexdigest()
          assert sha==payload['xlsxSha256']=='5344019af67069a48268ae866498b4552fdad83ae996cbe002868cfefde2931c'
          assert len(raw)==427081
          ns={'s':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            assert z.testzip() is None
            sheets=ET.fromstring(z.read('xl/workbook.xml')).findall('s:sheets/s:sheet',ns)
            assert [s.attrib['name'] for s in sheets]==['Synthese','Chantiers','Criteres','Quetes','Voix','Reecritures','Validation','Sources','References']
            formulas=0
            for path in z.namelist():
              if path.startswith('xl/worksheets/') and path.endswith('.xml'):
                xml=ET.fromstring(z.read(path));formulas+=len(xml.findall('.//s:f',ns));assert not xml.findall('.//s:c[@t="e"]',ns)
            assert formulas==5
          (root/name).parent.mkdir(parents=True,exist_ok=True)
          (root/name).write_bytes(raw)
          (root/receipt).write_text(payload['textFiles'][receipt])
          meta=json.loads((root/receipt).read_text());assert meta['sha256']==sha and meta['bytes']==len(raw)
          print(json.dumps({'file':name,'sha256':sha,'bytes':len(raw),'sheets':9,'formulas':5,'errors':0,'note':'Exact artifact_tool package members; only canonical ZIP container reproduced.'}))
          PY
      - name: Commit only workbook and its receipt, without force push
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/quetes-vivantes-bible-20261109
          test "$(git ls-remote origin refs/heads/feat/quetes-vivantes-bible-20261109 | cut -f1)" = "$GITHUB_SHA"
          git add -- production/quetes-vivantes-20261109/Yautja_Quetes_Vivantes_Bible_20261109.xlsx production/quetes-vivantes-20261109/verification-classeur.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: suivi XLSX des 73 chantiers et 118 criteres, avec preuves natives des quetes'
          git push origin HEAD:refs/heads/feat/quetes-vivantes-bible-20261109
          git rev-parse HEAD
