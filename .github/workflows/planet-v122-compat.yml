name: V122 Planet V103 / V115 compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/game/PlanetGeneratorV103.tsx'
      - 'app/game/systems/clanWarPlanetStrategyV114.ts'
      - 'app/game/systems/clanWarDeploymentV103.ts'
      - 'tests/planet-v122-compat.test.mjs'
      - '.github/workflows/planet-v122-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  versioned-worlds:
    name: World versions V103 and V115 both play
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/game/
            /tests/planet-v122-compat.test.mjs
            /tests/planet-generator-v115.test.mjs
            /tests/planet-strategy-v114.test.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/planet-v122-compat.test.mjs tests/planet-generator-v115.test.mjs tests/planet-strategy-v114.test.mjs
