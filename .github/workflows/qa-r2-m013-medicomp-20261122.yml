name: QA medicomp R2-M013
on:
  push:
    branches: [codex/qa-r2-m013-medicomp-20261122]
permissions:
  contents: read
jobs:
  medicomp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*
            /package.json
            /package-lock.json
            /tsconfig.json
            /next-env.d.ts
            /app/
            /lib/
            /types/
            /tests/
            /worker/
            /docs/
            /scripts/
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/youth-training.test.ts tests/youth-campaign.test.mjs tests/youth-cage-v53.test.mjs tests/youth-patrol-v52.test.mjs
      - run: npx tsc --noEmit --incremental false
