name: Verify Bible Oseris revisit
on:
  push:
    branches: [codex/verify-bible-oseris-r2-m053-20261122]
permissions:
  contents: read
jobs:
  native:
    name: Native Oseris revisit · ${{ matrix.choice }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        choice: [maintain, adapt]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      OSERIS_RETURN_CHOICE: ${{ matrix.choice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /worker/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
            /.openai/hosting.json
            /public/**/manifest.json
      - name: Restore original declared assets without modifying their contents
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path.cwd()
          files={x['path'] for x in json.loads((root/'docs/qa/current-integration-20261103/runtime-inputs.json').read_text())['entries']}
          files.update(json.loads((root/'tests/fixtures/clan-ship-browser-assets.json').read_text())['paths'])
          files.update('public'+x['src'] for x in json.loads((root/'app/game/data/buriedCradleArt.json').read_text())['assets'].values())
          files.update(['public/game/prologue/v47/village.png','public/game/prologue/v47/arena.png','public/game/ships/v14/avp-predator-mothership.webp','public/game/ships/v12/classic-predator-spaceship.webp','public/game/ships/v13/classic-predator-spaceship-top.webp','public/game/backgrounds/ship-hub-v4.webp','public/game/backgrounds/jungle-depth-v4.webp'])
          for name in files:
            path=pathlib.PurePosixPath(name);assert not path.is_absolute() and '..' not in path.parts
          subprocess.run(['git','sparse-checkout','add','--stdin'],input='\n'.join('/'+p for p in sorted(files))+'\n',text=True,check=True)
          assert all((root/p).is_file() for p in files)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the Oseris field visit and browser proof
        run: npx eslint app/game/ClanShipOperationsPanel.tsx app/game/OserisReturnR2M053Panel.tsx app/game/systems/oserisReturnR2M053.ts app/game/systems/clanShipOperations.ts tests/oseris-return-r2-m053.test.mjs tests/helpers/elder-recognition-r2-m051.mjs scripts/qa-oseris-return-r2-m053.mjs
      - name: Check the original hunt requirement and both durable paths
        if: matrix.choice == 'maintain'
        run: node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/oseris-return-r2-m053.test.mjs tests/clan-ship-operations.test.mjs tests/clan-ship-operations-save.test.mjs tests/elder-assembly-v168.test.mjs
      - name: Compare the restored map in GameClient, cross and reload
        run: node scripts/qa-oseris-return-r2-m053.mjs
      - name: Preserve original screenshots and receipts
        if: ${{ !cancelled() && hashFiles('outputs/qa-oseris-r2-m053/report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bible-oseris-${{ matrix.choice }}
          path: outputs/qa-oseris-r2-m053/
          if-no-files-found: error
