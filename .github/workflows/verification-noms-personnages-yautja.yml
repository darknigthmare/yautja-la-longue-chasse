name: Vérification des noms de personnages
on:
  push:
    branches: [codex/verification-noms-personnages-yautja]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8112718ecfc2a856b93ed5dff3a3d7d34110d93a
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            app
            scripts
            tests
            docs/campagne
            public/game/homeworld/v64
            public/game/homeworld/v67
            public/game/assets/v15/trophies
            public/game/assets/v37/tribes
            public/game/backgrounds
            public/game/sprites/v8/ecology
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Reproduire l’échec de SC-1 sur la branche principale
        run: node --experimental-strip-types --test --test-name-pattern='SC-1 de bout en bout' tests/minor-arcs-v160.test.mjs
