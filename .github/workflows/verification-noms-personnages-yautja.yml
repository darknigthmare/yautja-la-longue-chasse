name: Vérification des noms de personnages
on:
  push:
    branches: [codex/verification-noms-personnages-yautja]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25f867f271bc89604acafd73767e5a7ef4c675aa
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            app
            scripts
            tests
            docs/campagne
            public/game/homeworld/v64
            public/game/homeworld/v67
            public/game/assets/v15/trophies
            public/game/assets/v37/tribes
            public/game/backgrounds
            public/game/sprites/v8/ecology
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tester les scènes et les dialogues du Clan Ship
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          tests/clan-ship-dialogue.test.mjs
          tests/clan-ship-crew-dialogue.test.mjs
          tests/clan-ship-crew-dialogue-ui.test.mjs
          tests/clan-ship-trophy-hearing.test.mjs
          tests/clan-ship-trophy-hearing-presentation.test.mjs
          tests/clan-ship-return-escort.test.mjs
          tests/clan-ship-operations-save.test.mjs
          tests/clan-hull-project-v171.test.mjs
