name: Render the original R2-M006 audio
on:
  push:
    branches: [codex/qa-m006-ceremonie-render-20261128]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/generate-m006-ceremony-score.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the pinned Linux Opus encoder
        run: |
          archive=$(npm pack @ffmpeg-installer/linux-x64@4.1.0 --pack-destination "$RUNNER_TEMP" --silent)
          mkdir "$RUNNER_TEMP/m006-ffmpeg"
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/m006-ffmpeg" package/ffmpeg
          echo "$RUNNER_TEMP/m006-ffmpeg/package" >> "$GITHUB_PATH"
      - name: Check deterministic render and media envelope
        run: |
          ffmpeg -version | sed -n '1p'
          node scripts/generate-m006-ceremony-score.mjs --write > /tmp/m006-ceremony-hashes.txt
          node scripts/generate-m006-ceremony-score.mjs --verify | diff -u /tmp/m006-ceremony-hashes.txt -
          frames=$(ffmpeg -v error -i public/audio/music/ceremony-m006/mus-06-clan-ceremonie.ogg -ac 1 -ar 24000 -f s16le pipe:1 | wc -c)
          test "$frames" = '5040000'
      - name: Transfer bounded authoring bytes
        run: node scripts/generate-m006-ceremony-score.mjs --emit
