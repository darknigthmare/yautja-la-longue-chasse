name: Compagnons - intégrité des PNG individuels

# The one-off binary transfer completed at 1a9ddbd18008438d03f722f4e532c03dffce5a4f.
# No remote bundle download, auto-commit, or push remains in this workflow.
on:
  push:
    branches: ['art/compagnons-individuels-20261106']
    paths:
      - 'production/compagnons/20261106-sprites-individuels-revue/**'
      - '.github/workflows/compagnons-sources-20261106.yml'
  pull_request:
    paths:
      - 'production/compagnons/20261106-sprites-individuels-revue/**'
      - '.github/workflows/compagnons-sources-20261106.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-individual-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            production/compagnons/20261106-sprites-individuels-revue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Verify actual PNG files, hashes, transparency and review-only state
        run: python production/compagnons/20261106-sprites-individuels-revue/verify.py
      - name: No working tree modifications
        run: git diff --exit-code
