      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate legacy and delivery reducer, trajectory and controlled writes
        run: |
          set -o pipefail
          mkdir -p outputs/mobility-forge-delivery-qa
          npm run typecheck
          node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/MobilityGarage.tsx app/game/MobilityDrivingYard.tsx app/game/systems/mobility/{course,controller,ledger}.ts scripts/{mobility-qa-driver,qa-mobility-campaign-20261109}.mjs tests/mobility-forge-delivery.test.mjs
          node --experimental-strip-types --test --test-reporter=spec tests/mobility-{core,hardening,controls-workshop,qa-driver,training-reward,forge-delivery}.test.mjs | tee outputs/mobility-forge-delivery-qa/node-tests.log
      - name: Materialize canonical runtime assets used by the Homeworld
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs catalogue
          ASSET_RACCORDS_PREPARE_ONLY=1 node scripts/qa-asset-raccords-browser-20261120.mjs
      - name: Build and run the exact Next production game
        run: |
          set -o pipefail
          npm run build:production 2>&1 | tee outputs/mobility-forge-delivery-qa/build.log
          npm run start:production -- --hostname 127.0.0.1 --port 3121 > outputs/mobility-forge-delivery-qa/next-server.log 2>&1 &
          for attempt in {1..70}; do
            if curl --fail --silent http://127.0.0.1:3121/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3121/ > /dev/null
      - name: Play the full contract via actual GameClient with native keyboard input
        run: |
          MOBILITY_CAMPAIGN_QA_OUTPUT=outputs/mobility-forge-delivery-qa/browser node scripts/qa-mobility-campaign-20261109.mjs --forge-delivery
      - name: Retain results, production build, and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-delivery-evidence-${{ github.run_id }}
          path: outputs/mobility-forge-delivery-qa/
          if-no-files-found: error
