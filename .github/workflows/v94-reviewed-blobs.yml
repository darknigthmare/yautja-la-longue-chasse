name: V94 reviewed source blobs (temporary)
on:
  push:
    branches: [fix/v94-audit-reliability-20261016]
    paths: [scripts/v94-native-hydration-review.py, .github/workflows/v94-reviewed-blobs.yml]
permissions:
  contents: read
jobs:
  reviewed-blobs:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/game/ClanWarPanelV85.tsx
            /scripts/qa-clan-war-browser-v94.mjs
            /scripts/v94-native-hydration-review.py
      - name: Apply two reviewed hydration adaptations and create blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/v94-native-hydration-review.py
