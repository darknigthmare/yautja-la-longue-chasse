name: Verify the sixth priority workbook
on:
  push:
    branches: [codex/verify-priority-lots-6-20261121]
permissions:
  contents: read
jobs:
  workbook:
    name: Check exact product tree and reproducible Excel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_HEAD: '5bb378a40f73aebccaf336f2460715c19e4e21e8'
      VERIFIED_CODE: 'a274fe7085e8b9ff228a6efd5f382f1d5369eaaf'
      EXPECTED_INVENTORY: '53a77231870f7165230f85738783302e99f9105e'
    steps:
      - name: Read the released tree and workbook inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '5bb378a40f73aebccaf336f2460715c19e4e21e8'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/build-priority-lots-workbook-20261121.mjs
            /scripts/lib/workbook-ooxml.mjs
            /production/YAUTJA_LOTS_P0_P3*20261121.json
            /production/YAUTJA_LOTS_P0_P3*20261121.xlsx
            /docs/suivi-production/v613/recovery/png-metadata-index-20261121.json
            /docs/qa/current-integration-20261103/runtime-inputs.json
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check the verified application and canonical runtime inventory
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_HEAD"
          git diff --exit-code "$VERIFIED_CODE" HEAD -- app public
          test "$(git diff --name-only "$VERIFIED_CODE" HEAD -- scripts tests)" = "$(printf '%s\n' 'scripts/build-priority-lots-workbook-20261121.mjs' 'scripts/historical-shared-inputs-homeworld-v113.mjs' 'scripts/qa-quatza-triad-return-20261121.mjs' 'tests/homeworld-v112-history-v113.test.mjs')"
          test "$(git rev-parse HEAD:scripts/build-priority-lots-workbook-20261121.mjs)" = 1117901231b6311661d05b8c25f170e9a17e7570
          test "$(git rev-parse HEAD:scripts/historical-shared-inputs-homeworld-v113.mjs)" = 4c2673d878003aef16d98f9244115f2b25a00c5f
          test "$(git rev-parse HEAD:scripts/qa-quatza-triad-return-20261121.mjs)" = 8c69e880ff0b9aaddb489d91b77bb9b3e9d481da
          test "$(git rev-parse HEAD:tests/homeworld-v112-history-v113.test.mjs)" = 3ac7d9777d86139858c4a1fde10020575336a21f
          test "$(git rev-parse HEAD:docs/qa/current-integration-20261103/runtime-inputs.json)" = "$EXPECTED_INVENTORY"
          git diff --check "$VERIFIED_CODE" HEAD
      - name: Reproduce the six published workbooks exactly
        run: |
          node scripts/build-priority-lots-workbook-20261121.mjs --check
          for lot in 2 3 4 5 6; do
            node scripts/build-priority-lots-workbook-20261121.mjs "--lot-$lot" --check
          done
      - name: Inspect Excel package, row counts and P3 provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          from xml.etree import ElementTree as ET

          prod = Path('production')
          prefix = 'YAUTJA_LOTS_P0_P3_LOT6_20261121'
          summary = json.loads((prod / (prefix + '.json')).read_text())
          assert [lot['priority'] for lot in summary['lots']] == ['P0', 'P1', 'P2', 'P3']
          counts = [len(lot['entries']) for lot in summary['lots']]
          assert counts == [2,1,3,2]
          assert all(0 <= count <= 10 for count in counts)
          assert len(summary['deliveries']) <= 10
          assert {entry['id'] for entry in summary['lots'][-1]['entries']} == {'ENFORCERS-V613-RECEIPTS', 'ENFORCERS-V610-TRACES'}
          p3 = json.loads(Path('docs/suivi-production/v613/recovery/png-metadata-index-20261121.json').read_text())
          assert p3['sourceCommit'] == summary['baseCommit']
          assert p3['v610']['expectedPngCount'] == 36 and p3['v610']['originalPngRecovered'] == 0
          assert p3['v613']['finalPngCount'] == 36 and p3['v613']['missingPublishedReceipts'] == 21
          ns = {'s': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          with zipfile.ZipFile(prod / (prefix + '.xlsx')) as pack:
              assert pack.testzip() is None
              root = ET.fromstring(pack.read('xl/workbook.xml'))
              names = [sheet.get('name') for sheet in root.findall('s:sheets/s:sheet', ns)]
              assert names == ['Synthèse', 'P0', 'P1', 'P2', 'P3', 'Livraisons']
              for idx, count in enumerate(counts + [len(summary['deliveries'])], start=2):
                  sheet = ET.fromstring(pack.read(f'xl/worksheets/sheet{idx}.xml'))
                  assert len(sheet.findall('s:sheetData/s:row', ns)) == count + 4
                  assert sheet.find('s:autoFilter', ns).get('ref') == f'A4:G{count + 4}'
          print('PASS official source counts, reproducible workbook and delivery records:', counts, len(summary['deliveries']))
          PY
