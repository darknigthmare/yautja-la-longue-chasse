name: Verify lot six progression
on:
  push:
    branches: [codex/verify-priority-lots-6-20261121]
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Validate campaign progress and Homeworld recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '68f571e873f473af48c8615f26fa7da1cc7e3fd2'
      BASE_COMMIT: 'd5e95fba7358924108e425cf7056a5a38fe2b944'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '68f571e873f473af48c8615f26fa7da1cc7e3fd2'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /public/game/xeno-prime/berceau-v1/
            /public/audio/
            /public/game/quatza-rij/
            /public/game/assets/v37/tribes/v2/homeworld-darkjungle-v2--fbc392bc9618642d.webp
            /public/game/assets/v37/tribes/v2/homeworld-forest-v2--8fdc633789dcd9c0.webp
            /public/game/assets/v37/tribes/v2/homeworld-lava-v2--ecd85e06796799d2.webp
            /public/game/backgrounds/ice-depth-v4.webp
            /public/game/backgrounds/ocean-depth-v8.png
            /public/game/backgrounds/ruins-depth-v8.png
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/homeworld/v67/ash-causeway-vista.png
            /public/game/homeworld/v67/glass-processional-vista.png
            /public/game/sprites/v8/ecology/cinder-12/basalt-ram-sheet.png
            /public/game/sprites/v8/ecology/cinder-12/smoke-wyvern-sheet.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
            /public/game/sprites/v8/ecology/nivalis-k/snow-prowler-sheet.png
            /public/game/sprites/v8/ecology/oseris-iv/amber-jaw-stalker-sheet.png
            /public/game/sprites/v8/ecology/pelagos-m/shellback-sheet.png
            /public/game/sprites/v8/ecology/serekh-9/burrow-snake-sheet.png
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/assets/v139/rig-gauntlets/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/assets/v133/concept-masks/
            /public/game/assets/v133/decals/decal-atlas.webp
            /public/game/sprites/v62/heads/
            /public/game/assets/v134/
            /public/game/assets/v135/
            /public/game/assets/v136/
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize exact shared evidence for the historical Homeworld context
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {lstatSync, readFileSync} from 'node:fs';
          const bytes = readFileSync('tests/fixtures/excel-history-v111-homeworld-v112.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), 'd4bf56b2e785959bc2c0217bfd308d321707a9ecb5bc52b22dd70a1b6154572a');
          const manifest = JSON.parse(bytes);
          assert.equal(manifest.schemaVersion, 1);
          assert.equal(manifest.sourceCommit, 'def899ad07fea582053c5c204e4e578d8e0d7f9b');
          assert.ok(Array.isArray(manifest.shared));
          const paths = [], seen = new Set();
          let alreadyIncludedTests = 0;
          for (const row of manifest.shared) {
            assert.ok(typeof row.path === 'string' && /^(?:public|art-source|docs|tests)\/[A-Za-z0-9._/-]+$/.test(row.path), 'Unreviewed shared prefix or Git pattern metacharacter');
            assert.ok(row.path.split('/').every(part => part && part !== '.' && part !== '..'), 'Nonlocal shared path');
            assert.ok(!seen.has(row.path), 'Duplicate shared path');
            seen.add(row.path);
            if (row.path.startsWith('tests/')) {
              // /tests/ is already included by checkout; do not broaden another prefix.
              const info = lstatSync(row.path);
              assert.ok(info.isFile() && !info.isSymbolicLink(), 'Missing checked-out test fixture');
              alreadyIncludedTests++;
            } else paths.push('/' + row.path);
          }
          assert.equal(paths.length, 1173);
          assert.equal(alreadyIncludedTests, 46);
          assert.ok(paths.includes('/art-source/v107/enforcer-poses/augmentes-assassin--enforcers-comics-10-first-attempt.png'));
          assert.equal(execFileSync('git', ['config', '--bool', '--default', 'false', '--get', 'core.sparseCheckoutCone'], {encoding:'utf8'}).trim(), 'false');
          execFileSync('git', ['sparse-checkout', 'add', '--stdin'], {
            input: paths.sort().join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'],
          });
          for (const file of paths) {
            const info = lstatSync(file.slice(1));
            assert.ok(info.isFile() && !info.isSymbolicLink(), 'Missing shared evidence after sparse checkout');
          }
          console.log(JSON.stringify({historicalSharedPaths:seen.size, addedExactPatterns:paths.length, alreadyIncludedTests}));
          NODE
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate canonical runtime evidence
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs candidate || { cat outputs/qa-asset-raccords-20261120/runtime-generator.log; exit 1; }
          node scripts/check-hunt-integration-source-v112.mjs --current
      - name: Verify Next types
        if: ${{ !cancelled() }}
        run: |
          node node_modules/next/dist/bin/next typegen
          node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Verify lint on changed source
        if: ${{ !cancelled() }}
        run: >-
          npx eslint
          app/game/GameClient.tsx
          app/game/systems/clanShipDialogue.ts
          tests/clan-ship-dialogue.test.mjs
          tests/clan-ship-operations.test.mjs
          scripts/historical-excel-context-homeworld-v112.mjs
          app/game/systems/w3S18RoutePost.ts
          app/game/W3S18RoutePostContext.ts
          app/game/systems/clanSupplySessionV109.ts
          app/game/systems/spaceRoutesV159.ts
          app/game/ClanSupplyRouteV109.tsx
          app/game/SpaceRoutesPanelV159.tsx
          scripts/qa-w3-s18-campaign-route-20261121.mjs
          tests/space-routes-v159.test.mjs
          app/game/systems/quatzaRij.ts
          app/game/QuatzaRijScene.tsx
          tests/quatza-rij.test.mjs
          scripts/qa-quatza-triad-return-20261121.mjs
          app/game/systems/pitWorkbookCampaignV108.ts
          app/game/PitWorkbookCampaignV108.tsx
          tests/pit-workbook-campaign-v108.test.mjs
      - name: Verify durable progression and source regressions
        if: ${{ !cancelled() }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1
          tests/clan-ship-dialogue.test.mjs
          tests/clan-ship-operations.test.mjs
          tests/clan-ship-operations-save.test.mjs
          tests/clan-ship-crew-dialogue-ui.test.mjs
          tests/clan-ship-return-escort.test.mjs
          tests/homeworld-mobility-v112.test.mjs
          tests/homeworld-dynamic-navigation-v109.test.mjs
          tests/homeworld-geometry-recovery-v112.test.mjs
          tests/homeworld-geometry-recovery-integration-v112.test.mjs
          tests/space-routes-v159.test.mjs
          tests/quatza-rij.test.mjs
          tests/pit-workbook-campaign-v108.test.mjs
          tests/pit-workbook-save-session-v108.test.mjs
      - name: Report canonical inventory differences
        if: ${{ !cancelled() && hashFiles('outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const prior = JSON.parse(readFileSync('docs/qa/current-integration-20261103/runtime-inputs.json'));
          const next = JSON.parse(readFileSync('outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json'));
          const old = new Map(prior.entries.map(item => [item.path, item]));
          const paths = new Set(next.entries.map(item => item.path));
          const changes = next.entries.filter(item => JSON.stringify(old.get(item.path)) !== JSON.stringify(item));
          const removed = prior.entries.filter(item => !paths.has(item.path)).map(item => item.path);
          console.log('V113_DELTA ' + JSON.stringify({ files: next.files, bytes: next.bytes, changes, removed }));
          NODE

