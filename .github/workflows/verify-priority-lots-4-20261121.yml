name: Verify the fourth delivery and all workbooks
on:
  push:
    branches: [codex/verify-priority-lots-4-20261121]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERIFIED_CODE: '82fae2372c7687497c7a84a0240eebb8e2292b57'
      VERIFIED_INVENTORY: '0d0033368533e4aaa21559ff3f78059156cbf7e0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'a7bf6bf8510080b8d865219f56c42de31541eb8a'
          persist-credentials: false
          fetch-depth: 8
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build-priority-lots-workbook-20261121.mjs
            /scripts/lib/workbook-ooxml.mjs
            /scripts/qa-hunt-campaign-browser-v112.mjs
            /docs/qa/current-integration-20261103/runtime-inputs.json
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT4_20261121.*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirm that the tested code and official inventory match the delivery
        run: |
          git diff --exit-code "$VERIFIED_CODE" HEAD -- app tests scripts ':!scripts/qa-hunt-campaign-browser-v112.mjs'
          node --check scripts/qa-hunt-campaign-browser-v112.mjs
          test "$(git hash-object scripts/qa-hunt-campaign-browser-v112.mjs)" = "f0189adf3a6e118d1b8f9566194f12e3e08b80ea"
          test "$(git hash-object docs/qa/current-integration-20261103/runtime-inputs.json)" = "$VERIFIED_INVENTORY"
      - name: Reproduce the four workbooks and inspect the final archive
        run: |
          node scripts/build-priority-lots-workbook-20261121.mjs --check
          node scripts/build-priority-lots-workbook-20261121.mjs --lot-2 --check
          node scripts/build-priority-lots-workbook-20261121.mjs --lot-3 --check
          node scripts/build-priority-lots-workbook-20261121.mjs --lot-4 --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          book = Path("production/YAUTJA_LOTS_P0_P3_LOT4_20261121")
          data = json.loads(book.with_suffix(".json").read_text(encoding="utf-8"))
          counts = [len(lot["entries"]) for lot in data["lots"]]
          assert counts == [10, 10, 10, 2]
          ids = [entry["id"] for lot in data["lots"] for entry in lot["entries"]]
          assert len(ids) == len(set(ids))
          assert "R2-M047" in ids and "R2-M045" not in ids
          ns = {"x": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
          with ZipFile(book.with_suffix(".xlsx")) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith((".xml", ".rels")):
                      ET.fromstring(z.read(name))
              sheets = ET.fromstring(z.read("xl/workbook.xml"))
              assert [item.attrib["name"] for item in sheets.findall(".//x:sheet", ns)] == ["Synthèse", "P0", "P1", "P2", "P3"]
              for index, count in enumerate(counts, start=2):
                  sheet = ET.fromstring(z.read(f"xl/worksheets/sheet{index}.xml"))
                  assert len(sheet.findall(".//x:sheetData/x:row", ns)) == count + 4
                  assert sheet.find("./x:autoFilter", ns).attrib["ref"] == f"A4:G{count + 4}"
          print("LOT4_XLSX_OK", counts)
          PY
