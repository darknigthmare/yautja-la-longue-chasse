name: Planet V114 focused regressions
on:
  pull_request:
    paths:
      - 'app/game/**/clanWarPlanet*'
      - 'app/game/**/planet*'
      - 'app/game/PlanetLayerExportV102.tsx'
      - 'app/game/PlanetMaterialCanvasV101.tsx'
      - 'app/game/PlanetGeneratorV103.tsx'
      - 'app/game/ClanWarAtlasV95.tsx'
      - 'app/game/PlanetRegionalPreviewV129.tsx'
      - 'app/game/PlanetShapePreviewV125.tsx'
      - 'app/game/PlanetShapeLibraryV137.tsx'
      - 'app/game/**/clanWarRegionalMaterialKit*'
      - 'app/game/**/clanWarTextureLibrary*'
      - 'app/game/**/clanWarShape*'
      - 'tests/planet*'
      - 'tests/planet-*'
      - '.github/workflows/planet-v114.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planet-v114-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout only game source and focused tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/game/
            /tests/
            /package.json
            /package-lock.json
            /eslint.config.mjs
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run planet V114 and historical generator domain tests
        run: >-
          node --test --test-reporter=spec --test-concurrency=1
          tests/planet-export-zip-v114.test.mjs
          tests/planet-modular-export-v124.test.mjs
          tests/planet-physical-material-v125.test.mjs
          tests/planet-region-material-kit-v128.test.mjs
          tests/planet-regional-shader-v129.test.mjs
          tests/planet-extra-materials-v130.test.mjs
          tests/planet-coastal-regions-v131.test.mjs
          tests/planet-regional-pbr-v131.test.mjs
          tests/planet-visual-fidelity-v132.test.mjs
          tests/planet-visual-profile-v134.test.mjs
          tests/planet-surface-fallback-v135.test.mjs
          tests/planet-surface-budget-v136.test.mjs
          tests/planet-shape-library-v137.test.mjs
          tests/planet-projection-parity-v138.test.mjs
          tests/planet-topology-advisor-v139.test.mjs
          tests/planet-strategy-v114.test.mjs
          tests/planet-generator-draft-v103.test.mjs
          tests/planet-generator-v103.test.mjs
          tests/planet-generator-v115.test.mjs
          tests/planet-material-v101.test.mjs
      - name: Lint new planet modules
        run: >-
          npx eslint
          app/game/systems/clanWarPlanetStrategyV114.ts
          app/game/planetModularExportV124.ts
          app/game/planetRegionKitRasterV128.ts
          app/game/planetRegionalShaderAtlasV129.ts
          app/game/planetCoastalRegionsV131.ts
          app/game/planetRegionalPbrAtlasesV131.ts
          app/game/planetRegionalSurfaceAlbedoV135.ts
          app/game/PlanetRegionalPreviewV129.tsx
          app/game/systems/clanWarRegionalMaterialKitV128.ts
          app/game/PlanetLayerExportV102.tsx
          app/game/planetMaterialRendererV101.ts
          app/game/systems/planetExportZipV114.ts
          app/game/systems/clanWarPlanetDraftV103.ts
          app/game/systems/clanWarPlanetGeneratorV115.ts
          app/game/systems/clanWarShapeAtlasV115.ts
          app/game/systems/clanWarTextureLibraryV115.ts
          app/game/systems/clanWarPlanetPhysicalIndexV125.ts
          app/game/systems/clanWarPlanetSurfaceBudgetV136.ts
          app/game/systems/clanWarTextureLibraryV125.ts
          app/game/systems/clanWarTextureLibraryV130.ts
          app/game/PlanetGeneratorV103.tsx
          app/game/ClanWarAtlasV95.tsx
          app/game/PlanetShapePreviewV125.tsx
          app/game/PlanetShapeLibraryV137.tsx
          app/game/systems/clanWarShapeLibraryV137.ts
          app/game/systems/planetProjectionParityV138.ts
          app/game/systems/clanWarPlanetTopologyAdvisorV139.ts

  browser-modules:
    name: V124 live PNG and ZIP verification
    needs: domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUDIT_CHROME_CHANNEL: chrome
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout actual game route and planetary textures
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /public/game/planets/
            /public/game/assets/v15/trophies/manifest.json
            /scripts/qa-planet-modular-export-v124.mjs
            /scripts/qa-planet-region-kit-v128.mjs
            /package.json
            /package-lock.json
            /next.config.ts
            /tsconfig.json
            /postcss.config.mjs
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify live modular PNG pixels and ZIP in Chromium
        run: |
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3101 > /tmp/yautja-planet-v124-next.log 2>&1 &
          QA_SERVER_PID=$!
          trap 'kill "$QA_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3101/planet-generator-v103 > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3101/planet-generator-v103 > /dev/null || { cat /tmp/yautja-planet-v124-next.log; exit 1; }
          node scripts/qa-planet-modular-export-v124.mjs
          node scripts/qa-planet-region-kit-v128.mjs
      - name: Upload V124 browser PNG, ZIP, screenshots and report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planet-v124-browser-${{ github.run_id }}
          path: |
            outputs/qa-planet-modular-v124/
            outputs/qa-planet-regional-kit-v128/
          retention-days: 7
          if-no-files-found: ignore
