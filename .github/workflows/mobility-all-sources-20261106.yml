name: Mobility - all existing sprite sources 20261106
on:
  push:
    branches: [claude/bible-de-campagne]
    paths:
      - .github/workflows/mobility-all-sources-20261106.yml
      - docs/campagne/mobilite/IMPORT_SOURCES_COMPLET_20261106.json
      - docs/campagne/mobilite/import_all_sources_20261106.py
permissions:
  contents: write
concurrency:
  group: mobility-all-sources-20261106-pr116
  cancel-in-progress: false
jobs:
  import-and-verify:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse' && github.ref == 'refs/heads/claude/bible-de-campagne'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUEST_SHA: b0ee908d288efde411bdbd9ac98e64ee9d7a39d350b89f1916bcad568809448f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            docs/campagne/mobilite
            art-source/mobilite
      - name: Verify the exact audited importer
        run: echo '00365752236052e5ae77ba3992d7cef113fc387c793bb603b5263b64809d12f5  docs/campagne/mobilite/import_all_sources_20261106.py' | sha256sum --check
      - name: Import unchanged PNG sources and preserve historical manifests
        run: python3 docs/campagne/mobilite/import_all_sources_20261106.py --request-sha256 "$REQUEST_SHA"
      - name: Verify all 87 source files and published metadata without writes
        run: python3 docs/campagne/mobilite/import_all_sources_20261106.py --request-sha256 "$REQUEST_SHA" --check-only
      - name: Verify an idempotent second import
        shell: bash
        run: |
          set -euo pipefail
          git add -- art-source/mobilite docs/campagne/mobilite/DEPOT_COMPLET_SPRITES_20261106.md docs/campagne/mobilite/DEPOT_COMPLET_SPRITES_20261106.json docs/campagne/mobilite/README.md docs/campagne/mobilite/PRODUCTION_VISUELLE.md
          python3 docs/campagne/mobilite/import_all_sources_20261106.py --request-sha256 "$REQUEST_SHA"
          git diff --exit-code -- art-source/mobilite docs/campagne/mobilite
      - name: Bound the commit to 29 PNGs and five documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('docs/campagne/mobilite/DEPOT_COMPLET_SPRITES_20261106.json').read_text())
          new_images={e['path'] for e in manifest['entries'] if 'source_key' in e}
          assert len(new_images)==29, len(new_images)
          docs={
            'art-source/mobilite/INDEX_SOURCES_20261106.md',
            'docs/campagne/mobilite/DEPOT_COMPLET_SPRITES_20261106.md',
            'docs/campagne/mobilite/DEPOT_COMPLET_SPRITES_20261106.json',
            'docs/campagne/mobilite/README.md',
            'docs/campagne/mobilite/PRODUCTION_VISUELLE.md',
          }
          names=set(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          assert not names or names==new_images|docs, sorted(names^(new_images|docs))
          assert not names or len(names)==34, len(names)
          assert manifest['png_count']==87 and manifest['catalogue_individual_hd_count']==20
          assert manifest['added_png_count']==29 and manifest['preserved_png_count']==58
          assert manifest['bytes']==98099683, manifest['bytes']
          print(json.dumps({'staged_files':len(names),'new_png':len(new_images),'all_png':87,'png_bytes':manifest['bytes']}))
          PY
          git diff --cached --check
      - name: Commit sources to the existing bible PR, never force-push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'The verified files are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'art(mobilite): conserver 87 PNG sources et completer les lots HD 01-20 [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/claude/bible-de-campagne; then
              git log -1 --format='Published source commit: %H'
              exit 0
            fi
            git fetch --no-tags origin claude/bible-de-campagne
            git rebase FETCH_HEAD || exit 1
            python3 docs/campagne/mobilite/import_all_sources_20261106.py --request-sha256 "$REQUEST_SHA" --check-only
          done
          exit 1
