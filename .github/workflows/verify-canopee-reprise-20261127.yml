name: Verify buffered canopy grip and durable harvest
on:
  push:
    branches: [codex/verify-canopee-reprise-20261127]
permissions:
  contents: read
jobs:
  source:
    name: Runtime canopy, inventory, TypeScript and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '35d3316b7e88049fb247ceeaa5d9e6ac3fd5fa1d'
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /content/the-pit/
            /lib/
            /types/
            /worker/
            /desktop/
            /scripts/
            /build/
            /tests/
            /docs/
            /production/INVENTAIRE_BIBLE_20261122.*
            /public/**/manifest.json
            /.openai/hosting.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the live engine and existing harvest contracts
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          tests/hunt-canopy-runtime-v112.test.mjs tests/hunt-canopy-resume-cooldown-20261109.test.mjs
          tests/canopy-navigation-v112.test.mjs tests/canopy-traversal-v112.test.mjs
          tests/harvest-inventory-v112.test.mjs tests/hunt-skinning-worksite-20261109.test.mjs
      - name: Verify Next types
        run: |
          node node_modules/next/dist/bin/next typegen
          node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint engine, guide and hunt recipe
        run: node node_modules/eslint/bin/eslint.js app/game/HuntCanvas.tsx app/game/HuntCanopyHudV112.tsx app/game/systems/canopyNavigationV112.ts tests/hunt-canopy-runtime-v112.test.mjs
  durable-field:
    name: Native GameClient skinning, sidecar resume and canopy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      SKINNING_CANOPY_QA_OUTPUT: outputs/qa-skinning-canopy-20261109
      SKINNING_CANOPY_QA_CASE: canopy
      SKINNING_CANOPY_QA_TRANSFER: buffered
    steps:
      - name: Checkout current application and exact asset index
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '35d3316b7e88049fb247ceeaa5d9e6ac3fd5fa1d'
          persist-credentials: false
          filter: blob:none
          fetch-depth: 3
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /content/the-pit/
            /lib/
            /types/
            /worker/
            /desktop/
            /docs/
            /tests/
            /scripts/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize and verify the original assets actually used by this recipe
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,lstatSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const index=JSON.parse(readFileSync('tests/fixtures/skinning-canopy-browser-assets-20261109.json','utf8'));
          assert.equal(index.schemaVersion,1);
          assert.ok(index.assets.length>0);
          const seen=new Set();
          for(const asset of index.assets){
            assert.ok(asset.path.startsWith('public/')&&!asset.path.includes('..')&&!asset.path.includes('\\'));
            assert.ok(!seen.has(asset.path));seen.add(asset.path);
            assert.match(asset.gitBlob,/^[a-f0-9]{40}$/);
            assert.match(asset.sha256,/^[a-f0-9]{64}$/);
          }
          execFileSync('git',['sparse-checkout','add','--stdin'],{input:[...seen].sort().map(p=>'/'+p).join('\n')+'\n',stdio:['pipe','inherit','inherit']});
          let bytes=0;
          const mismatches=[];
          for(const asset of index.assets){
            const info=lstatSync(asset.path);assert.ok(info.isFile()&&!info.isSymbolicLink());
            const raw=readFileSync(asset.path);bytes+=raw.length;
            const gitBlob=execFileSync('git',['hash-object','--',asset.path],{encoding:'utf8'}).trim();
            if(asset.path==='public/audio/manifest.json'){
              assert.equal(gitBlob,'4030c8eaf98dd830970ae5b99e6f02b5889d213f',asset.path);
              JSON.parse(raw.toString('utf8'));
              continue;
            }
            if(raw.length!==asset.bytes||createHash('sha256').update(raw).digest('hex')!==asset.sha256||gitBlob!==asset.gitBlob)
              mismatches.push({path:asset.path,gitBlob});

          }
          assert.deepEqual(mismatches,[],'Historical assets unexpectedly changed');
          console.log(JSON.stringify({originalAssets:seen.size-1,currentAudioManifest:1,bytes,substituteAssets:false}));
          NODE
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize current V19 sector bindings without rewriting the historical index
        run: node scripts/materialize-asset-raccords-20261120.mjs hunt-runtime
      - name: Strict lint of the full GameClient browser recipe
        run: node node_modules/eslint/bin/eslint.js --max-warnings=0 scripts/qa-skinning-canopy-durable-browser-20261109.mjs tests/browser/skinning-canopy-durable-20261109.fixture.jsx
      - name: Verify exact bytes for Buffer and views
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const script = readFileSync('scripts/qa-skinning-canopy-durable-browser-20261109.mjs', 'utf8');
          const definition = script.match(/^const hash=(.+);$/m)?.[1];
          assert.ok(definition);
          const hash = Function('createHash', 'return ' + definition)(createHash);
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const whole = new Uint8Array([17, 21, 23, 29, 31]);
          const bytes = Buffer.from([21, 23, 29]);
          for (const value of [bytes, whole.subarray(1, 4), new DataView(whole.buffer, 1, 3)]) {
            assert.equal(hash(value), digest(bytes));
          }
          assert.equal(hash('original text'), digest('original text'));
          assert.equal(hash({replay: 1}), digest('{"replay":1}'));
          console.log('Verified exact buffer/view bounds, text, and JSON hashes.');
          NODE
      - name: Catch the next authored vine using a single native Up press
        run: node scripts/qa-skinning-canopy-durable-browser-20261109.mjs
      - name: Print the result of the native browser recipe
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync, readFileSync} from 'node:fs';
          const p = process.env.SKINNING_CANOPY_QA_OUTPUT + '/report.json';
          if (!existsSync(p)) console.log('The browser recipe did not produce a report');
          else {
            const {classification, browserExecuted, passed, checks, cases, errors, captures} = JSON.parse(readFileSync(p, 'utf8'));
            console.log(JSON.stringify({classification, browserExecuted, passed, checks: checks.map(({name, id, status, passed}) => ({name, id, status, passed})), cases: Object.keys(cases), errors, captures: captures.length}));
          }
          NODE
      - name: Preserve the actual browser report and original captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skinning-canopy-durable-${{ github.sha }}
          path: |
            outputs/qa-skinning-canopy-20261109/
            outputs/qa-asset-raccords-20261120/materialization-hunt-runtime.json
          if-no-files-found: error
          retention-days: 30

