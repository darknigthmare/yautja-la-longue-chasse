name: Physical ship interior 2.5D

on:
  push:
    branches: [feat/ship-interior-25d-20261105]
    paths:
      - 'app/dev/**'
      - 'app/game/ShipInterior25D*'
      - 'app/game/shipInterior*'
      - 'app/game/systems/shipInterior25d.ts'
      - 'app/game/systems/homeworldGeometryV64.ts'
      - 'app/game/GameClient.tsx'
      - 'public/game/ship-interior/**'
      - 'scripts/qa-ship-interior-25d.mjs'
      - 'tests/ship-interior-25d.test.mjs'
      - 'tests/game-client-code-splitting.test.mjs'
      - 'tests/fixtures/clan-ship-browser-assets.json'
      - '.github/workflows/ship-interior-25d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-interior-25d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interior:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      SHIP_INTERIOR_QA_SOURCE_COMMIT: ${{ github.sha }}
      SHIP_INTERIOR_QA_START_SERVER: '1'
      SHIP_INTERIOR_QA_HEADED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /desktop/
            /build/
            /.github/workflows/ship-interior-25d.yml
            /.openai/hosting.json
            /public/**/manifest.json
            /public/audio/
            /public/game/ship-interior/
            /public/game/backgrounds/ship-hub-v4.webp
            /public/game/ships/v12/classic-predator-spaceship.webp
            /public/game/ships/v13/classic-predator-spaceship-top.webp
      - name: Materialize the existing real rig and shared service asset fixture
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { paths } = JSON.parse(readFileSync('tests/fixtures/clan-ship-browser-assets.json', 'utf8'));
          assert.equal(new Set(paths).size, paths.length, 'The established rig/service fixture must remain unique');
          for (const file of paths) {
            assert.match(file, /^public\/game\/[A-Za-z0-9._/-]+$/);
            assert.ok(file.split('/').every(part => part && part !== '.' && part !== '..'));
          }
          execFileSync('git', ['sparse-checkout', 'add', '--stdin'], {
            input: paths.map(file => '/' + file).join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'],
          });
          assert.deepEqual(paths.filter(file => !existsSync(file)), [], 'Every fixture source must exist in this exact commit');
          NODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strictly lint the new scene, geometry, browser recipe and loading contract
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
          app/game/ShipInterior25D.tsx app/game/systems/shipInterior25d.ts
          scripts/qa-ship-interior-25d.mjs tests/ship-interior-25d.test.mjs
          tests/game-client-code-splitting.test.mjs
      - name: Exercise native ground motion, doors and asynchronous loading
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          tests/ship-interior-25d.test.mjs tests/game-client-code-splitting.test.mjs
      - name: Build the actual production application including its TypeScript check
        shell: bash
        run: |
          mkdir -p outputs/qa-ship-interior-25d
          npm run build:production 2>&1 | tee outputs/qa-ship-interior-25d/build.log
      - name: Install the locked Chromium and native video support
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Walk the ship through real Next, keyboard, touch, services and physical doors
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" node scripts/qa-ship-interior-25d.mjs
      - name: Preserve exact-source observations, captures, video and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ship-interior-25d-${{ github.sha }}
          path: outputs/qa-ship-interior-25d/
          if-no-files-found: warn
          retention-days: 14
