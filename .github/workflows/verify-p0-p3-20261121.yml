      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize source assets actually used by the scenes
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs catalogue
          ASSET_RACCORDS_PREPARE_ONLY=1 node scripts/qa-asset-raccords-browser-20261120.mjs
      - name: Build and start the production application
        id: server
        run: |
          mkdir -p outputs/p0-p3-20261121
          npm run build:production
          npm run start:production -- --hostname 127.0.0.1 --port 3121 > outputs/p0-p3-20261121/next-server.log 2>&1 &
          for attempt in {1..70}; do
            if curl --fail --silent http://127.0.0.1:3121/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3121/ > /dev/null
          printf 'YAUTJA_QA_BUILD_ID=%s\n' "$(cat .next/BUILD_ID)" >> "$GITHUB_ENV"
      - name: Play both approaches to the Cradle in the actual application
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          CRADLE_APPROACH_QA_COMMIT: cf76fe476e65ac9184fbaa37aa24ef2040d70146
          CRADLE_APPROACH_QA_OUTPUT: outputs/p0-p3-20261121/approach
        run: node scripts/qa-cradle-approach-20261121.mjs
      - name: Verify the active T09 valve, reservoir image and acid cycle
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          CRADLE_NURSERY_QA_COMMIT: cf76fe476e65ac9184fbaa37aa24ef2040d70146
          CRADLE_NURSERY_QA_OUTPUT: outputs/p0-p3-20261121/nursery
        run: node scripts/qa-cradle-nursery-20261121.mjs
      - name: Play the watched passage, reject a collision and reload the accepted arrangement
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          ELDER_PASSAGE_QA_COMMIT: cf76fe476e65ac9184fbaa37aa24ef2040d70146
        run: node scripts/qa-elder-passage-20261121.mjs
      - name: Play the local convoy with acquisition, ordering and interrupted movement
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          YAUTJA_CLAN_SUPPLY_V109_OUTPUT: outputs/p0-p3-20261121/convoy
        run: node scripts/qa-clan-supply-route-v109.mjs
      - name: Preserve the compiled browser evidence
        if: always()
