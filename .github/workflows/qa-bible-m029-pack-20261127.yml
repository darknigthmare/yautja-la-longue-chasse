name: Play the M029 Homeworld pack, quay and Leader appointment
on:
  push:
    branches: [codex/qa-bible-m029-leader-20261127]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      YAUTJA_M029_QA_URL: https://yautja-la-longue-chasse.vercel.app
      YAUTJA_M029_DEPLOYED_COMMIT: 9a98912989dbd6477ca2b9b87a1b3f1b3c5d3404
      YAUTJA_M029_QA_OUTPUT: outputs/qa-bible-m029
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /docs/
            /.github/workflows/
            /public/audio/
            /public/**/manifest.json
            /public/game/homeworld/
            /public/game/assets/v37/tribes/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/assets/v133/concept-masks/
            /public/game/assets/v133/decals/decal-atlas.webp
            /public/game/assets/v134/
            /public/game/assets/v135/
            /public/game/assets/v136/
            /public/game/sprites/v62/heads/
            /public/game/sprites/v5/film-plates/jungle-hunter.png
            /public/game/assets/v15/trophies/trophy-ruins-ancient-guardian.webp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare the exact application files
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
          M029_ADMISSION_ONLY=1 node scripts/qa-homeworld-pack-m029.mjs
      - name: Play the Leader choice on the published game
        run: node scripts/qa-homeworld-pack-m029.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: homeworld-pack-m029-browser
          path: outputs/qa-bible-m029/
          if-no-files-found: warn
