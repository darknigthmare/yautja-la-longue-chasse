name: Verify the first interstellar journey and Okavango
on:
  push:
    branches: [codex/verify-bible-terre-20261122]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /worker/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/ship-interior/
      - name: Restore original declared assets without modifying their contents
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path.cwd()
          files={x['path'] for x in json.loads((root/'docs/qa/current-integration-20261103/runtime-inputs.json').read_text())['entries']}
          files.update(json.loads((root/'tests/fixtures/clan-ship-browser-assets.json').read_text())['paths'])
          files.update('public'+x['src'] for x in json.loads((root/'app/game/data/buriedCradleArt.json').read_text())['assets'].values())
          files.update(['public/game/prologue/v47/village.png','public/game/prologue/v47/arena.png','public/game/ships/v14/avp-predator-mothership.webp','public/game/ships/v12/classic-predator-spaceship.webp','public/game/ships/v13/classic-predator-spaceship-top.webp','public/game/backgrounds/ship-hub-v4.webp'])
          for name in files:
            path=pathlib.PurePosixPath(name);assert not path.is_absolute() and '..' not in path.parts
          subprocess.run(['git','sparse-checkout','add','--stdin'],input='\n'.join('/'+p for p in sorted(files))+'\n',text=True,check=True)
          assert all((root/p).is_file() for p in files)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check the campaign
        run: npx tsc --noEmit --pretty false
      - name: Check first travel, Earth, preflight and ownership receipts
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 tests/first-interstellar-v173.test.mjs tests/earth-hunt-v171.test.mjs tests/ship-preparation-v88.test.mjs tests/ship-preparation-save-v88.test.mjs tests/ship-receipt-v161.test.mjs
      - name: Play the cockpit, berth, quay and Earth in Chrome 
        if: ${{ !cancelled() }}
        run: node scripts/qa-first-interstellar-v173.mjs
      - name: Preserve browser captures and receipts
        if: ${{ !cancelled() && hashFiles('outputs/qa-first-interstellar-v173/report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bible-terre-played
          path: outputs/qa-first-interstellar-v173/
          if-no-files-found: error
