name: REM112 Désert · orientation au contact de l’Apex (lot 8)
on:
  push:
    branches: [claude/funny-ride-njwojd]
    paths:
      - .github/workflows/qa-rem112-desert-facing-lot8.yml
      - scripts/lib/qa-hunt-campaign-input-v112.mjs
      - scripts/qa-hunt-campaign-browser-v112.mjs
permissions:
  contents: read
  actions: read
jobs:
  desert:
    name: Désert ${{ matrix.admission }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        admission: [marais-chromium, marais-moteur]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ADMISSION: ${{ matrix.admission }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues.json
            /docs/qa/v112-campaign-canonical/native-raw.tar.gz
            /docs/qa/v112-campaign-canonical/native-report.json
            /docs/qa/v112-campaign-canonical/provenance.json
            /tests/qa-hunt-ground-policy-v112.test.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - if: matrix.admission == 'marais-chromium'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44955740956
          name: rem112-swamp-resumed-extraction
          github-token: ${{ github.token }}
          path: archived-swamp
      - name: Prepare the unchanged admission and attest where it was earned
        run: |
          mkdir -p outputs/admission
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json, os, tarfile
          kind=os.environ['ADMISSION']
          provenance={'admission':kind}
          if kind=='marais-chromium':
              paths=list(Path('archived-swamp').rglob('report.json'))
              assert len(paths)==1
              raw=paths[0].read_bytes()
              report=json.loads(raw)
              assert report['qualification']=='BROWSER_HUNTS_HARVEST_AND_WORKSHOP'
              assert report['coverage']['harvestedAndArchived']==['swamp-hydra']
              assert report['attempts'][0]['settlement']['confirmed']
              save=report['finalSave']
              provenance.update(sourceRun=44955740956,sourceArtifact=14727084602,sourceReportSha256=sha256(raw).hexdigest())
              source=raw
          else:
              root=Path('docs/qa/v112-campaign-canonical')
              meta=json.loads((root/'provenance.json').read_bytes())
              proof={row['file']:row['sha256'] for row in meta['artifacts']}
              archive=root/'native-raw.tar.gz'
              report_bytes=(root/'native-report.json').read_bytes()
              assert sha256(archive.read_bytes()).hexdigest()==proof[archive.name]
              assert sha256(report_bytes).hexdigest()==proof['native-report.json']
              run=next(row for row in json.loads(report_bytes)['attempts'] if row['missionId']=='swamp-hydra')
              assert run['status']=='NATIVE_SIMULATION_SUCCESS' and run['final']['phase']=='finished'
              expected=run['inputs']['file'].removesuffix('-inputs.json')+'-campaign-save.json'
              with tarfile.open(archive,'r:gz') as tar:
                  member,=[row for row in tar.getmembers() if Path(row.name).name==expected]
                  assert member.isfile()
                  source=tar.extractfile(member).read()
              save=json.loads(source)
              provenance.update(archiveSha256=proof[archive.name],sourceReportSha256=proof['native-report.json'],member=member.name)
          swamp=save['missionProgress']['swamp-hydra']
          desert=save['missionProgress']['desert-sandmaw']
          assert swamp['status']=='completed' and swamp['completions']>=1
          assert desert['status']=='available' and desert['attempts']==0
          root=Path('outputs/admission')
          (root/'campaign.json').write_bytes(source)
          provenance.update(admissionBytesSha256=sha256(source).hexdigest(),desert=desert,
                            hunterUpgrade=save['inventory']['armorUpgrades']['hunter'],marks=save['profile']['clanMarks'])
          (root/'provenance.json').write_text(json.dumps(provenance,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(provenance,ensure_ascii=False))
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Policy regression, including facing the Apex in contact
        run: node --test tests/qa-hunt-ground-policy-v112.test.mjs
      - name: Play the Desert hunt and archive the same bone in the workshop
        run: |
          node scripts/qa-hunt-campaign-browser-v112.mjs --campaign-source outputs/admission/campaign.json \
            --missions desert-sandmaw --require-complete --require-resume --max-retries 4 \
            --harvest-species serekh-9--dust-jackal --harvest-action harvest-bone --require-harvest-workshop \
            --wall-seconds 2700 --chromium /usr/bin/google-chrome --output outputs/browser --asset-cache outputs/source-cache
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const report=JSON.parse(await readFile('outputs/browser/report.json'));
          assert.ok(report.apexTrophyObservations.some(row=>row.missionId==='desert-sandmaw'&&row.target.reach===125&&row.target.inReach&&row.reason==='reachable apex trophy'));
          NODE
      - if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          let q;try{q=JSON.parse(await readFile('outputs/browser/report.json','utf8'));}catch(error){console.log(error.message);process.exit(0);}
          console.log(JSON.stringify({qualification:q.qualification,coverage:q.coverage,resumes:q.resumeObservations,apex:q.apexTrophyObservations,
            attempts:q.attempts.map(a=>({missionId:a.missionId,controlLoop:a.controlLoop,delivered:a.delivered,retries:a.retryEvents?.map(x=>({button:x.button,elapsed:x.elapsed})),
              settlement:a.settlement,terminal:{phase:a.final?.state?.phase,elapsed:a.final?.state?.elapsed,health:a.final?.state?.player?.health,x:a.final?.state?.player?.x}})),
            workshop:q.workshop.map(({before,after,...row})=>row),errors:q.errors,missingAssets:q.missingAssets,failure:q.failure}));
          NODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rem112-desert-facing-${{ matrix.admission }}
          path: |
            outputs/browser/
            outputs/admission/provenance.json
