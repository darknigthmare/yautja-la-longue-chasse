name: V147 Four Native Clan War Game Modes Browser QA
on:
  push:
    branches:
      - feat/v131-gauntlet-hologram-dual-view-20261030
    paths:
      - 'app/game/ClanWarOperationsV115.tsx'
      - 'app/game/systems/clanWarOperationsV115.ts'
      - 'app/game/systems/clanWarBibleV6.ts'
      - 'scripts/qa-clan-war-four-modes-v147.mjs'
      - 'tests/browser/clan-war-v147-four-modes.fixture.tsx'
      - 'tests/clan-war-four-modes-v147.test.mjs'
      - '.github/workflows/clan-war-v147-four-modes.yml'
      - 'docs/Yautja_ClanWar_V147_Quatre_Modes.xlsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-four-modes:
    name: Four live V115 play modes, isolated archives, reload and cosmetic integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout actual V115 source, V6 data and QA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /app/
            /types/
            /lib/
            /scripts/qa-clan-war-four-modes-v147.mjs
            /tests/browser/clan-war-v147-four-modes.fixture.tsx
            /tests/clan-war-four-modes-v147.test.mjs
            /tests/clan-war-operations-v115.test.mjs
            /tests/clan-war-operation-cross-mode-v115.test.mjs
            /tests/clan-war-tactical-runtime-v115.test.mjs
            /docs/Yautja_ClanWar_V147_Quatre_Modes.xlsx
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real source tests for assault, sabotage, RTS and Outer Ops
        run: |
          node --experimental-strip-types --test --test-reporter=spec \
            tests/clan-war-operations-v115.test.mjs \
            tests/clan-war-operation-cross-mode-v115.test.mjs \
            tests/clan-war-tactical-runtime-v115.test.mjs \
            tests/clan-war-four-modes-v147.test.mjs
      - name: Launch and reload each of the four real V115 gameplays in Chromium
        run: node scripts/qa-clan-war-four-modes-v147.mjs
      - name: Check the V147 Excel annex
        run: |
          unzip -t docs/Yautja_ClanWar_V147_Quatre_Modes.xlsx | tail -1
          python3 -c "import zipfile; z=zipfile.ZipFile('docs/Yautja_ClanWar_V147_Quatre_Modes.xlsx'); assert sum(x.startswith('xl/worksheets/sheet') and x.endswith('.xml') for x in z.namelist()) == 5"
      - name: Preserve V147 real-mode Chrome screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clan-war-v147-four-real-modes-gameplay
          path: outputs/clan-war-four-modes-v147/
          retention-days: 30
          if-no-files-found: warn
