name: P0 Homeworld marché et cargaison depuis preuves gelées
on:
  push:
    branches: [codex/qa-homeworld-pinned-recovery-lot6-20261121]
permissions:
  contents: read
jobs:
  regression:
    name: Circuit du marché et reprise réelle des chargements
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /tests/
            /scripts/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Materialize exact shared evidence for the historical Homeworld context
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {lstatSync, readFileSync} from 'node:fs';
          const bytes = readFileSync('tests/fixtures/excel-history-v111-homeworld-v112.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), 'd4bf56b2e785959bc2c0217bfd308d321707a9ecb5bc52b22dd70a1b6154572a');
          const manifest = JSON.parse(bytes);
          assert.equal(manifest.schemaVersion, 1);
          assert.equal(manifest.sourceCommit, 'def899ad07fea582053c5c204e4e578d8e0d7f9b');
          assert.ok(Array.isArray(manifest.shared));
          const paths = [], seen = new Set();
          let alreadyIncludedTests = 0;
          for (const row of manifest.shared) {
            assert.ok(typeof row.path === 'string' && /^(?:public|art-source|docs|tests)\/[A-Za-z0-9._/-]+$/.test(row.path), 'Unreviewed shared prefix or Git pattern metacharacter');
            assert.ok(row.path.split('/').every(part => part && part !== '.' && part !== '..'), 'Nonlocal shared path');
            assert.ok(!seen.has(row.path), 'Duplicate shared path');
            seen.add(row.path);
            if (row.path.startsWith('tests/')) {
              // /tests/ is already included by checkout; do not broaden another prefix.
              const info = lstatSync(row.path);
              assert.ok(info.isFile() && !info.isSymbolicLink(), 'Missing checked-out test fixture');
              alreadyIncludedTests++;
            } else paths.push('/' + row.path);
          }
          assert.equal(paths.length, 1173);
          assert.equal(alreadyIncludedTests, 46);
          assert.ok(paths.includes('/art-source/v107/enforcer-poses/augmentes-assassin--enforcers-comics-10-first-attempt.png'));
          assert.equal(execFileSync('git', ['config', '--bool', '--default', 'false', '--get', 'core.sparseCheckoutCone'], {encoding:'utf8'}).trim(), 'false');
          execFileSync('git', ['sparse-checkout', 'add', '--stdin'], {
            input: paths.sort().join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'],
          });
          for (const file of paths) {
            const info = lstatSync(file.slice(1));
            assert.ok(info.isFile() && !info.isSymbolicLink(), 'Missing shared evidence after sparse checkout');
          }
          console.log(JSON.stringify({historicalSharedPaths:seen.size, addedExactPatterns:paths.length, alreadyIncludedTests}));
          NODE
      - name: Install locked dependencies without lifecycle scripts
        id: dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare actual shared paths to their frozen inventory
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('tests/fixtures/excel-history-v111-homeworld-v112.json','utf8'));
          const actual=manifest.shared.map(row=>{
            const bytes=fs.readFileSync(row.path);
            const sha256=createHash('sha256').update(bytes).digest('hex');
            return sha256===row.sha256&&bytes.length===row.bytes?null:
              {path:row.path,historicalBytes:row.bytes,currentBytes:bytes.length,historicalSha256:row.sha256,currentSha256:sha256};
          }).filter(Boolean);
          console.log(JSON.stringify({historicalSource:manifest.sourceCommit,mismatches:actual}));
          NODE
      - name: Verify original preimages and Homeworld native behavior
        run: |
          mkdir -p outputs/homeworld-proof
          sha256sum docs/v108-clan-logistics-contract.md > outputs/homeworld-proof/current-before.sha256
          set -o pipefail
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 \
            tests/historical-shared-inputs.test.mjs \
            tests/homeworld-mobility-v112.test.mjs tests/homeworld-market-rejoin-v112.test.mjs \
            tests/homeworld-dynamic-navigation-v109.test.mjs \
            tests/homeworld-geometry-recovery-v112.test.mjs tests/homeworld-geometry-recovery-integration-v112.test.mjs \
            tests/homeworld-geometry-recovery-matrix-v112.test.mjs \
            tests/homeworld-dressing-recovery-v113.test.mjs tests/homeworld-dressing-planner-v113.test.mjs \
            | tee outputs/homeworld-proof/regression.log
          sha256sum -c outputs/homeworld-proof/current-before.sha256
          git diff --exit-code -- docs/v108-clan-logistics-contract.md tests/fixtures/excel-history-v111-homeworld-v112.json tests/fixtures/excel-history-v111-homeworld-v112.json.gz
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeworld-market-cargo-frozen-proof
          path: outputs/homeworld-proof/
