name: Préimages des trois générations de suivi Homeworld
on:
  push:
    branches: [codex/qa-homeworld-history-other-capsules-lot6]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 4
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /.openai/hosting.json
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Audit actual mismatches against the three original manifests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {HOMEWORLD_SHARED_PREIMAGES_V113} from './scripts/historical-shared-inputs-homeworld-v113.mjs';
          const manifests=['v110-homeworld-v111','v111-homeworld-v112','v112-homeworld-v113'].map(id=>[id,JSON.parse(fs.readFileSync('tests/fixtures/excel-history-'+id+'.json','utf8'))]);
          const paths=new Set();
          for(const [,manifest]of manifests)for(const row of manifest.shared){
            assert.match(row.path,/^[A-Za-z0-9._/-]+$/);
            assert.ok(!row.path.startsWith('/')&&row.path.split('/').every(x=>x&&x!=='.'&&x!=='..'));
            paths.add(row.path);
          }
          execFileSync('git',['sparse-checkout','add','--stdin'],{input:[...paths].sort().map(p=>'/'+p).join('\n')+'\n',stdio:['pipe','inherit','inherit']});
          const current=new Map([...paths].map(file=>[file,createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          for(const [id,manifest]of manifests){
            const mismatches=manifest.shared.filter(row=>current.get(row.path)!==row.sha256).map(row=>row.path);
            const notPinned=id==='v112-homeworld-v113'?mismatches.filter(p=>!HOMEWORLD_SHARED_PREIMAGES_V113.some(row=>row.path===p)):null;
            console.log(JSON.stringify({release:id,shared:manifest.shared.length,mismatches,notPinned}));
          }
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the full immutable V112 context and original assertions
        run: |
          mkdir -p outputs/homeworld-pins
          set -o pipefail
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/homeworld-v112-history-v113.test.mjs \
            | tee outputs/homeworld-pins/v113-historical-tests.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeworld-capsules-historical-tests
          path: outputs/homeworld-pins/
