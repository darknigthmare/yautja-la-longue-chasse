name: V144 Real Two-Tab Clan War Conflict Test
on:
  push:
    branches:
      - feat/v131-gauntlet-hologram-dual-view-20261030
    paths:
      - 'app/game/ClanWarPanelV85.tsx'
      - 'app/game/systems/clanWarSessionV85.ts'
      - 'app/game/systems/clanWarTurnGateV143.ts'
      - 'tests/clan-war-multitab-v144.test.mjs'
      - 'tests/clan-war-turn-gate-v143.test.mjs'
      - 'scripts/qa-clan-war-multitab-v144.mjs'
      - 'tests/browser/clan-war-v143.fixture.tsx'
      - '.github/workflows/clan-war-v144-multitab.yml'
      - 'docs/Yautja_ClanWar_V144_Conflits_Onglets.xlsx'
      - 'docs/Yautja_ClanWar_V145_Multiplanetes.xlsx'
      - 'docs/clan-war-multiplanet-v145.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-multitab:
    name: Two real Korthas tabs, IndexedDB compare-and-swap and non-destructive reload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only game sources and actual prototype assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /app/
            /types/
            /lib/
            /scripts/qa-clan-war-multitab-v144.mjs
            /tests/browser/clan-war-v143.fixture.tsx
            /tests/clan-war-multitab-v144.test.mjs
            /tests/clan-war-turn-gate-v143.test.mjs
            /docs/Yautja_ClanWar_V144_Conflits_Onglets.xlsx
            /docs/Yautja_ClanWar_V145_Multiplanetes.xlsx
            /public/game/assets/v14/hunter-kit/manifest.json
            /public/game/assets/v15/trophies/manifest.json
            /public/game/assets/v16/franchise-trophies/manifest.json
            /public/game/assets/v17/enemy-trophies/manifest.json
            /public/game/assets/v18/enemy-trophy-gameplay/manifest.json
            /public/game/assets/v28/sprite-review/manifest.json
            /public/game/assets/v134/gauntlets/jungle-hunter/
            /public/game/assets/v135/gauntlets/
            /public/game/assets/v136/gauntlets/
            /public/game/assets/v139/rig-gauntlets/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify V144 source-tracked Excel annex has six valid worksheets
        run: |
          unzip -t docs/Yautja_ClanWar_V144_Conflits_Onglets.xlsx | tail -1
          count=$(unzip -Z1 docs/Yautja_ClanWar_V144_Conflits_Onglets.xlsx | grep -Ec 'xl/worksheets/sheet[0-9]+[.]xml')
          test "$count" -eq 6
          echo "V144 annex: six worksheets and a valid archive"
      - name: Verify V145 workbook has five valid worksheets
        run: |
          unzip -t docs/Yautja_ClanWar_V145_Multiplanetes.xlsx | tail -1
          python3 -c "import zipfile; z=zipfile.ZipFile('docs/Yautja_ClanWar_V145_Multiplanetes.xlsx'); assert sum(x.startswith('xl/worksheets/sheet') and x.endswith('.xml') for x in z.namelist()) == 5"
          echo 'V145: five worksheets, ZIP archive intact'
      - name: Test non-destructive external-tab detection and offline-only mode
        run: node --experimental-strip-types --test --test-reporter=spec tests/clan-war-multitab-v144.test.mjs tests/clan-war-turn-gate-v143.test.mjs
      - name: Test three actual tabs across Korthas and Thalassa in Chrome
        run: node scripts/qa-clan-war-multitab-v144.mjs
      - name: Retain three-tab conflict screenshots and two-planet IndexedDB proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clan-war-v145-three-tabs-two-planets-idb-evidence
          path: outputs/clan-war-multitab-v144/
          retention-days: 30
          if-no-files-found: warn
