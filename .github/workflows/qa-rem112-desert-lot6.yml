name: REM112 vérifier les sauvegardes réellement archivées dans le Désert
on:
  push:
    branches: [codex/qa-rem112-desert-trophy-diagnostic-lot6]
permissions:
  actions: read
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44954090127
          name: rem112-desert-os-et-atelier
          github-token: ${{ github.token }}
          path: evidence
      - run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readdir,readFile} from 'node:fs/promises';
          import {join} from 'node:path';
          const files=(await readdir('evidence',{recursive:true})).filter(p=>p.endsWith('.json'));
          assert.ok(files.some(x=>x.endsWith('report.json')));
          assert.ok(files.some(x=>x.endsWith('browser-storage-state.json')));
          const found=new Map();
          function visit(value,source){
            if(typeof value==='string'){
              if(value.startsWith('{')&&value.includes('ownerSaveCreatedAt')&&value.includes('checkpoint')){
                try{visit(JSON.parse(value),source+' (serialized)');}catch{}
              }
              return;
            }
            if(!value||typeof value!=='object')return;
            if(value.missionId==='desert-sandmaw'&&typeof value.ownerSaveCreatedAt==='string'&&typeof value.runId==='string'&&value.snapshot?.checkpoint){
              const sha256=createHash('sha256').update(JSON.stringify(value)).digest('hex'),cp=value.snapshot.checkpoint;
              if(!found.has(sha256))found.set(sha256,{sha256,phase:cp.phase,elapsed:cp.elapsed,encounterRun:value.encounterRun,
                x:cp.player?.x,health:cp.player?.health,specimens:cp.huntRites?.specimensV112?.map(({id,quality})=>({id,quality})),locations:[]});
              found.get(sha256).locations.push(source);
              return;
            }
            for(const [key,child]of Object.entries(value))visit(child,source+'.'+key);
          }
          for(const file of files)visit(JSON.parse(await readFile(join('evidence',file),'utf8')),file);
          assert.ok(found.size>0);
          console.log(JSON.stringify({scanned:files,sidecars:[...found.values()],savedPreMortBone:[...found.values()].filter(q=>q.phase==='trophy'&&q.specimens?.some(s=>s.id==='desert-sandmaw:0:desert-sandmaw-foragers-4:bone'))}));
          NODE
