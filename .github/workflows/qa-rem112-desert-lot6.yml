name: REM112 lecture de l’approche réelle du trophée du Désert
on:
  push:
    branches: [codex/qa-rem112-desert-trophy-diagnostic-lot6]
permissions:
  actions: read
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44954090127
          name: rem112-desert-os-et-atelier
          github-token: ${{ github.token }}
          path: evidence
      - run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readdir,readFile} from 'node:fs/promises';
          import {join} from 'node:path';
          const files=await readdir('evidence',{recursive:true});
          const name=files.find(p=>p.endsWith('desert-sandmaw-hunt-samples.json'));
          assert.ok(name);
          const s=JSON.parse(await readFile(join('evidence',name),'utf8')).map(x=>x.state);
          for(const at of [145,170,200,228]){
            const q=s.find(x=>x.phase==='trophy'&&x.elapsed>=at);
            if(!q)continue;
            const p=q.player,b=q.boss,center={x:p.x+p.width/2,y:p.y+p.height/2};
            const trophy={x:b.x+b.width/2,y:b.y+b.height-52};
            const active=q.enemies.filter(z=>z.active&&z.alive).map(z=>({
              id:z.id,x:z.x,y:z.y,width:z.width,height:z.height,health:z.health,
              distance:Math.hypot(z.x+z.width/2-center.x,z.y+z.height/2-center.y),
            })).sort((a,b)=>a.distance-b.distance).slice(0,4);
            const surfaces=q.world.platforms.filter(z=>z.x<p.x+300&&z.x+z.width>p.x-300).map(({id,x,y,width,height,collision})=>({id,x,y,width,height,collision}));
            console.log(JSON.stringify({at:q.elapsed,phase:q.phase,player:{x:p.x,y:p.y,feet:p.y+p.height,facing:p.facing,health:p.health,grounded:p.grounded},
               trophy,actualRange:Math.hypot(center.x-trophy.x,center.y-trophy.y),active,surfaces,health:p.health,operation:q.trophyExtracting})); 
          }
          NODE
