name: V146 Thirty-Planet Live Clan War Browser Audit
on:
  push:
    branches:
      - feat/v131-gauntlet-hologram-dual-view-20261030
    paths:
      - 'app/game/ClanWarPanelV85.tsx'
      - 'app/game/ClanWarPlanetsV96.tsx'
      - 'app/game/systems/clanWarSessionV85.ts'
      - 'app/game/systems/clanWarPlanetsV96.ts'
      - 'scripts/qa-clan-war-30-planets-v146.mjs'
      - 'tests/browser/clan-war-v143.fixture.tsx'
      - 'tests/clan-war-30-planets-v146.test.mjs'
      - '.github/workflows/clan-war-v146-planets.yml'
      - 'docs/Yautja_ClanWar_V146_30Planetes_Chrome.xlsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirty-real-worlds:
    name: Real V85/V95 atlas on 30 planets, localStorage and IDB fences
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Sparse checkout game sources and QA script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /app/
            /types/
            /lib/
            /scripts/qa-clan-war-30-planets-v146.mjs
            /tests/browser/clan-war-v143.fixture.tsx
            /tests/clan-war-30-planets-v146.test.mjs
            /docs/Yautja_ClanWar_V146_30Planetes_Chrome.xlsx
            /public/game/assets/v14/hunter-kit/manifest.json
            /public/game/assets/v15/trophies/manifest.json
            /public/game/assets/v16/franchise-trophies/manifest.json
            /public/game/assets/v17/enemy-trophies/manifest.json
            /public/game/assets/v18/enemy-trophy-gameplay/manifest.json
            /public/game/assets/v28/sprite-review/manifest.json
            /public/game/assets/v134/gauntlets/jungle-hunter/
            /public/game/assets/v135/gauntlets/
            /public/game/assets/v136/gauntlets/
            /public/game/assets/v139/rig-gauntlets/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check V146 source contracts for 30 planets
        run: node --experimental-strip-types --test --test-reporter=spec tests/clan-war-30-planets-v146.test.mjs
      - name: Verify thirty native planetary UI switches, confirmed per-world turns and IDB
        run: node scripts/qa-clan-war-30-planets-v146.mjs
      - name: Verify V146 Excel archive
        run: |
          unzip -t docs/Yautja_ClanWar_V146_30Planetes_Chrome.xlsx | tail -1
          python3 -c "import zipfile; p='docs/Yautja_ClanWar_V146_30Planetes_Chrome.xlsx'; z=zipfile.ZipFile(p); assert sum(f.startswith('xl/worksheets/sheet') and f.endswith('.xml') for f in z.namelist()) == 5"
      - name: Preserve full 30-planet browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clan-war-v146-thirty-real-planets-ls-idb
          path: outputs/clan-war-30-planets-v146/
          retention-days: 30
          if-no-files-found: warn
