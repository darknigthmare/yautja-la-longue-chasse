      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build with the command from vercel.json
        run: node scripts/build-production-v94.mjs
      - name: Serve the exact production build
        run: |
          set -eu
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 4219 > /tmp/yautja-lot7-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent --show-error http://127.0.0.1:4219/ -o /tmp/yautja-lot7-index.html; then
              test -s /tmp/yautja-lot7-index.html
              curl --fail --silent --show-error http://127.0.0.1:4219/dev -o /tmp/yautja-dev-catalogue.html
              node -e "const html=require('node:fs').readFileSync('/tmp/yautja-dev-catalogue.html','utf8');for(const label of ['Ajouts récents','Autres parcours à vérifier','data-dev-launch','M017'])if(!html.includes(label))throw Error('Missing dev catalogue label: '+label)"
              DEV_EXERCISES_EXTERNAL_SERVER=1 DEV_EXERCISES_ORIGIN=http://127.0.0.1:4219 CHROMIUM_EXECUTABLE=/usr/bin/google-chrome node scripts/qa-dev-exercises-browser.mjs
              printf 'PASS exact Next production build %s\n' "$(git rev-parse HEAD)"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/yautja-lot7-next.log
          exit 1

      - name: Archive developer Chromium receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-browser-production
          path: outputs/qa-dev-exercises/
          if-no-files-found: ignore
