name: Mobility gameplay and workbook verification
on:
  push:
    branches: [feat/mobility-garage-gameplay-20261108]
    paths:
      - app/game/**
      - tests/mobility/**
      - tests/mobility-*.test.mjs
      - scripts/*mobility*
      - docs/campagne/mobilite/**
      - production/mobility-20261108/**
      - public/game/mobility/**
      - .github/workflows/mobility-publish-source-20261108.yml
  pull_request:
    paths:
      - app/game/**
      - tests/mobility/**
      - tests/mobility-*.test.mjs
      - scripts/*mobility*
      - docs/campagne/mobilite/**
      - production/mobility-20261108/**
      - public/game/mobility/**
      - .github/workflows/mobility-publish-source-20261108.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: mobility-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /docs/campagne/mobilite/
            /production/mobility-20261108/
            /production/homeworld-sectors-20261103/YAUTJA_MARCHE_MONTURES_CHENILS_20261103.xlsx
            /public/**/*.json
            /public/game/mobility/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the actual workbook and preserved historical cells
        run: |
          mkdir -p outputs/mobility-validation
          python3 scripts/verify-mobility-workbook.py | tee outputs/mobility-validation/workbook-report.json
      - name: Verify the existing runtime sprite bytes without downloading sources
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('production/mobility-20261108/runtime-sprite-manifest.json').read_text())
          for e in m['copied_existing_sources']:
            data=Path(e['path']).read_bytes()
            assert len(data)==e['bytes'] and hashlib.sha256(data).hexdigest()==e['sha256']
          print('3 existing runtime source copies verified; no new images generated')
          PY
      - name: Exercise rules, saved transactions and recovery regressions
        run: |
          node --test --test-concurrency=1 tests/mobility-core.test.mjs tests/mobility-integration.test.mjs tests/mobility-hardening.test.mjs tests/clan-ship-operations-save.test.mjs | tee outputs/mobility-validation/targeted-tests.tap
          node node_modules/typescript/bin/tsc -p tests/mobility/tsconfig.json
      - name: Verify the QA driver against unchanged real simulation
        run: node --test tests/mobility-qa-driver.test.mjs | tee outputs/mobility-validation/qa-driver-tests.tap
      - name: Install native Chromium from the locked package
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Exercise the actual garage component and persistent driving course
        run: |
          node scripts/build-mobility-browser-fixture.mjs
          MOBILITY_QA_COMMIT=$(git rev-parse HEAD) node scripts/qa-mobility-native.mjs
          git rev-parse HEAD > outputs/mobility-validation/source-commit.txt
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobility-validation-evidence
          path: |
            outputs/mobility-validation/
            outputs/qa-mobility-native/*report.json
            outputs/qa-mobility-native/*.png
          retention-days: 7
