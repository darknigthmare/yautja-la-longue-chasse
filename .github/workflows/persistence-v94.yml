name: V94 transactional exercises and trophy confirmation
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'tests/**', '.github/workflows/persistence-v94.yml']
permissions:
  contents: read
concurrency:
  group: persistence-v94-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUDIT_CHROME_CHANNEL: chrome
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /tests/
            /scripts/
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: install
      - name: New persistence regressions and existing lock contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test --test-reporter=spec tests/clan-war-fence-v94.test.mjs tests/trophy-workshop-commit-v94.test.mjs tests/archive-lock-async-v94.test.mjs tests/archive-lock-diagnostics-v90.test.mjs tests/trophy-recovery-v94.test.mjs tests/trophy-recovery-lifecycle-v94.test.mjs
      - name: Strict lint for new persistence domain
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/systems/clanWarFenceV94.ts app/game/systems/clanWarSessionV85.ts app/game/systems/trophyWorkshopCommitV94.ts app/game/systems/archiveTransaction.ts app/game/systems/trophyWorkshopRecoveryV94.ts app/game/useTrophyRecoveryV94.ts
      - name: Native three-domain race and crash-recovery tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/qa-clan-fence-browser-v94.mjs
      - name: Played rite and actual parent confirmation handlers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/qa-workshop-save-browser-v94.mjs
      - name: Native trophy recovery APIs (not wired into GameClient yet)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/qa-trophy-recovery-domain-browser-v94.mjs
