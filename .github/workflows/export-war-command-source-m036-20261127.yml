name: Prepare compact M036 source
on:
  push:
    branches: [codex/verify-bible-war-command-r2-m036-20261127]
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /app/game/clanWarBibleV6Source.json
      - name: Select source records
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('app/game/clanWarBibleV6Source.json', 'utf8'));
          const pick = (entry, column) => entry.fields.find(x => x.column === column)?.value ?? '';
          const mission = source.entries.find(row => row.id === 'W3-RTS01');
          const map = source.entries.find(row => row.id === 'W3-MAP01');
          const worldKey = String(pick(map,'C'));
          const world = source.entries.find(row => row.sheet === 'Mondes en guerre' && row.id === worldKey);
          console.log('selection', mission?.id, map?.id, worldKey, world?.id);
          if (!mission || !map || !world) throw new Error('Incomplete source context');
          const units = source.entries.filter(entry => entry.sheet === 'Unités de guerre').map(entry => ({
            id: entry.id, name: String(entry.title), role: String(pick(entry,'C')), fullMembers: Number(pick(entry,'D')), commandPoints: Number(pick(entry,'E')),
            recruitmentRav: Number(pick(entry,'F')), upkeepRav: Number(pick(entry,'G')), delayTurns: Number(pick(entry,'H')), attack: Number(pick(entry,'I')),
            defense: Number(pick(entry,'J')), range: Number(pick(entry,'K')), mobility: Number(pick(entry,'L')), counter: String(pick(entry,'M')), weakness: String(pick(entry,'N'))
          }));
          const metadata = {workbook:source.workbook,sha256:source.sha256,designedAt:source.designedAt};
          const compact = { metadata, entries: [mission, map, world], units };
          console.log('M036_COMPACT_BEGIN');
          console.log(JSON.stringify(compact));
          console.log('M036_COMPACT_END');
          JS
