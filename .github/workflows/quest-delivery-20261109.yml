name: Materialize reviewed quest sources 20261109
on:
  push:
    branches: [feat/quetes-vivantes-bible-20261109]
    paths: [.github/workflows/quest-delivery-20261109.yml]
permissions:
  contents: write
concurrency:
  group: quest-delivery-20261109
  cancel-in-progress: false
jobs:
  delivery:
    if: github.ref == 'refs/heads/feat/quetes-vivantes-bible-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
      - name: Verify immutable reviewed payload and materialize only thirteen native paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quest-receipts"
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'quest-receipts'
          shas=['4354dfe08bd124b5001751bcc47c75a537b43acd','842873cb700c99025dab57b3526c4e9de6fdf141','f4a07dde09e5df8de6bb27f4af6a7c721945a404','7a6a57d7052bc25016d239f5e2a1ef8363037097','f9514d2e8107cd866153fe3da86ea46641ccd0ef']
          parts=[]
          for sha in shas:
            request=urllib.request.Request('https://api.github.com/repos/darknigthmare/yautja-la-longue-chasse/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=60) as response: data=json.load(response)
            raw=base64.b64decode(data['content']); actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            assert actual==sha
            parts.append(raw)
          packed=base64.b64decode(b''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='6cb07ca872376ee81b0f26c8359d4bbf7bb9aec1288cca30bfa106c6ba301838'
          payload=json.loads(lzma.decompress(packed)); assert payload['baseline']=='19317af4f6cf05532a8ba56dbfe8f56fc4b225d9'
          allowed={'app/game/BuriedCradleReturnPanel.tsx','app/game/ClanShipOperationsPanel.module.css','app/game/ClanShipOperationsPanel.tsx','app/game/systems/clanShipIncidents.ts','app/game/systems/clanShipOperations.ts','app/game/systems/clanShipTrophyCase.ts','docs/campagne/BIBLE_DE_CAMPAGNE.md','app/game/ClanShipCrewDialogue.tsx','app/game/systems/clanShipDialogue.ts','docs/campagne/QUETES_VIVANTES_20261109.md','scripts/qa-clan-dialogue-browser-20261109.mjs','tests/clan-ship-dialogue.test.mjs','tests/fixtures/clan-quest-mechanics-19317af4.json'}
          assert set(payload['files'])==allowed
          assert set(payload['newFiles'])=={p for p,x in payload['files'].items() if x['beforeSha256'] is None}
          for name,item in payload['files'].items():
            p=root/name; assert all(not parent.is_symlink() for parent in [p,*p.parents])
            before=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
            assert before==item['beforeSha256'],name+' changed since review; refusing to overwrite'
          patch=out/'reviewed.patch';patch.write_text(payload['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,text in payload['newFiles'].items():
            p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for name,item in payload['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==item['afterSha256'],name
          (out/'verified-files.json').write_text(json.dumps(payload['files'],indent=2)+'\n')
          (out/'paths.txt').write_text('\n'.join(sorted(allowed))+'\n')
          print('Thirteen reviewed native sources verified; no save, reward, dependency or asset bytes rewritten.')
          PY
      - name: Restore original declared runtime and browser assets without rewriting them
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          r=pathlib.Path.cwd()
          files={x['path'] for x in json.loads((r/'docs/qa/current-integration-20261103/runtime-inputs.json').read_text())['entries']}
          files.update(json.loads((r/'tests/fixtures/clan-ship-browser-assets.json').read_text())['paths'])
          files.update('public'+x['src'] for x in json.loads((r/'app/game/data/buriedCradleArt.json').read_text())['assets'].values())
          files.update(['public/game/prologue/v47/village.png','public/game/prologue/v47/arena.png','public/game/ships/v14/avp-predator-mothership.webp','public/game/ships/v12/classic-predator-spaceship.webp','public/game/ships/v13/classic-predator-spaceship-top.webp','public/game/backgrounds/ship-hub-v4.webp'])
          for name in files:
            p=pathlib.PurePosixPath(name);assert not p.is_absolute() and '..' not in p.parts
          subprocess.run(['git','sparse-checkout','add','--stdin'],input='\n'.join('/'+p for p in sorted(files))+'\n',text=True,check=True)
          assert all((r/p).is_file() for p in files)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official current runtime inventory
        run: |
          set -euo pipefail
          node scripts/snapshot-runtime-v113.mjs --write docs/qa/current-integration-20261103/runtime-inputs.json 2>&1 | tee "$RUNNER_TEMP/quest-receipts/runtime-write.txt"
          node scripts/snapshot-runtime-v113.mjs --check docs/qa/current-integration-20261103/runtime-inputs.json 2>&1 | tee "$RUNNER_TEMP/quest-receipts/runtime-check.txt"
      - name: Full TypeScript
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/quest-receipts/typecheck.txt"
      - name: Strict lint of changed native code
        run: |
          set -euo pipefail
          node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/BuriedCradleReturnPanel.tsx app/game/ClanShipOperationsPanel.tsx app/game/ClanShipCrewDialogue.tsx app/game/systems/clanShipDialogue.ts app/game/systems/clanShipOperations.ts app/game/systems/clanShipIncidents.ts app/game/systems/clanShipTrophyCase.ts scripts/qa-clan-dialogue-browser-20261109.mjs tests/clan-ship-dialogue.test.mjs 2>&1 | tee "$RUNNER_TEMP/quest-receipts/lint.txt"
      - name: Original and new regressions including every original Cradle PNG
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-reporter=tap --test-concurrency=1 tests/clan-ship-dialogue.test.mjs tests/clan-ship-operations.test.mjs tests/clan-ship-operations-save.test.mjs tests/clan-ship-space-encounter.test.mjs tests/clan-ship-incidents.test.mjs tests/clan-ship-trophy-case.test.mjs tests/clan-ship-trophy-hearing.test.mjs tests/clan-ship-trophy-hearing-presentation.test.mjs tests/buried-cradle-return.test.mjs tests/buried-cradle-campaign.test.mjs tests/buried-cradle-snapshot.test.mjs tests/companion-residence.test.mjs 2>&1 | tee "$RUNNER_TEMP/quest-receipts/tests.txt"
      - name: Commit verified native files on this feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/quetes-vivantes-bible-20261109
          test "$(git ls-remote origin refs/heads/feat/quetes-vivantes-bible-20261109 | cut -f1)" = "$GITHUB_SHA"
          git diff --check
          mapfile -t paths < "$RUNNER_TEMP/quest-receipts/paths.txt"
          git add -- "${paths[@]}" docs/qa/current-integration-20261103/runtime-inputs.json
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: quetes du clan reecrites et dialogues contextuels sans effet sur la progression'
          git push origin HEAD:refs/heads/feat/quetes-vivantes-bible-20261109
          git rev-parse HEAD | tee "$RUNNER_TEMP/quest-receipts/published-head.txt"
          cp docs/qa/current-integration-20261103/runtime-inputs.json "$RUNNER_TEMP/quest-receipts/runtime-inputs.json"
      - name: Install locked Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Native dialogue, space encounter and reload on three viewports
        run: |
          set -euo pipefail
          node scripts/qa-clan-dialogue-browser-20261109.mjs 2>&1 | tee "$RUNNER_TEMP/quest-receipts/browser-run.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-native-delivery-20261109
          path: |
            ${{ runner.temp }}/quest-receipts/
            outputs/qa-clan-dialogue-20261109/
          retention-days: 7
          if-no-files-found: error
