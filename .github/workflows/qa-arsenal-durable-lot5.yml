name: P0 écritures durables de la forge d’équipement
on:
  push:
    branches: [codex/qa-arsenal-durable-quote-lot5-20261121]
permissions:
  contents: read
jobs:
  browser:
    name: Armurerie ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [corrected, duplicate]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues.json
            /docs/qa/v112-campaign-canonical/browser-workshop/browser-report.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          set -eu
          args=(--armory-upgrade-only)
          if [ "$VARIANT" = duplicate ]; then args=(--duplicate-armory-upgrade); fi
          node scripts/qa-armory-upgrade-persistence-lot5.mjs --inspect-only "${args[@]}" \
            --campaign-source docs/qa/v112-campaign-canonical/browser-workshop/browser-report.json \
            --output outputs/browser --asset-cache outputs/source-cache --chromium /usr/bin/google-chrome
          node --input-type=module -e 'import {readFile} from "node:fs/promises";const r=JSON.parse(await readFile("outputs/browser/report.json","utf8"));if(!r.armoryDurability)throw Error("Missing armory confirmation");console.log(JSON.stringify({receipt:r.armoryDurability,assets:r.missingAssets.length,errors:r.errors,source:r.sourceCommit,changedSources:r.sourceContext.changedApplicationSources}));'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: armory-durability-${{ matrix.variant }}
          path: outputs/browser/
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint app/game/GameClient.tsx tests/arsenal-system.test.mjs
      - run: node --test tests/arsenal-system.test.mjs
