name: Ship motion sprite rendering

on:
  pull_request:
    branches: [main, fix/cinematic-spatial-audit-20261105]
    paths:
      - 'app/game/PlanetArrivalCinematic*'
      - 'app/game/HunterRigPreview.tsx'
      - 'app/game/hunterRig.ts'
      - 'app/game/shipCatalogue.ts'
      - 'app/game/worldScreens.ts'
      - 'app/game/systems/planetArrival*.ts'
      - 'app/game/systems/planetInsertion.ts'
      - 'app/game/systems/shipInsertionEnergy.ts'
      - 'app/game/systems/huntInsertion.ts'
      - 'public/game/planet-arrival/**'
      - 'public/game/cinematics/batch-01-20261105/**'
      - 'public/game/ships/**'
      - 'tests/planet-arrival*.test.mjs'
      - 'tests/planet-insertion.test.mjs'
      - 'tests/ship-insertion-energy.test.mjs'
      - 'tests/hunt-insertion.test.mjs'
      - 'tests/fixtures/planet-arrival-art-calibration.json'
      - 'tests/fixtures/wolf-arrival-browser-assets.json'
      - 'tests/fixtures/clan-ship-browser-assets.json'
      - 'scripts/qa-ship-motion.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ship-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ship-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      SHIP_MOTION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SHIP_MOTION_HEADED: '1'
      SHIP_MOTION_VIDEO: '1'
      SHIP_MOTION_OUTPUT: outputs/qa-ship-motion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Qualify the real submitted sources, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/audio/
            /public/game/ship-interior/
            /public/game/planet-arrival/
            /public/game/cinematics/batch-01-20261105/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Record the exact source and component-only scope
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(sourceCommit, process.env.SHIP_MOTION_SOURCE_COMMIT);
          mkdirSync('outputs/qa-ship-motion', { recursive: true });
          writeFileSync('outputs/qa-ship-motion/ci-context.json', JSON.stringify({
            schemaVersion: 1, sourceCommit, startedAt: new Date().toISOString(),
            scope: 'The actual PlanetArrivalCinematic mounted through Vite; classic hull and six inspected additional families on desktop and mobile. Native frames, all 46 additional views, controls, optional-asset fallback and optical masks. No production build, campaign handoff or canonical art approval is claimed.',
          }, null, 2) + '\n');
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Include exact registered views, arrival artwork and existing rig fixtures
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { build } from 'esbuild';
          const compiled = await build({
            stdin: { contents: `export { MISSIONS } from './app/game/data';
              export { createPlanetArrival, planetArrivalAssets } from './app/game/systems/planetArrival';
              export { ARRIVAL_SHIP_MOTION_FAMILIES, arrivalShipMotionAssetPaths } from './app/game/systems/planetArrivalShipMotion';
              export { defaultSave } from './app/game/save';
              export { DEFAULT_SHIP_ID, shipProfileAssetPath } from './app/game/shipCatalogue';`,
              resolveDir: process.cwd(), loader: 'ts' },
            bundle: true, platform: 'node', format: 'esm', write: false, logLevel: 'silent',
          });
          const api = await import('data:text/javascript;base64,' + Buffer.from(compiled.outputFiles[0].text).toString('base64'));
          assert.equal(api.DEFAULT_SHIP_ID, 'classic-predator-spaceship', 'Review the browser fixture if the default hull changes');
          const save = api.defaultSave('2026-11-05T00:00:00.000Z');
          // The browser focuses on jungle-vey; the real asset regressions also
          // read the other seven destination families. No frozen inventory is
          // rewritten or used as a substitute for the runtime registrations.
          const arrivalPaths = api.MISSIONS.flatMap(mission => {
            const assets = api.planetArrivalAssets(api.createPlanetArrival({
              ownerCreatedAt: save.createdAt, runId: 'ship-motion-ci:' + mission.id,
              missionId: mission.id, encounterRun: 1, personalShipId: api.DEFAULT_SHIP_ID,
              hunterPresetId: save.appearance.presetId,
            }));
            assert.ok(assets, mission.id + ': arrival assets are required');
            return Object.values(assets).map(asset => 'public' + asset);
          });
          const expectedAdditionalFamilies = {
            'avp-predator-mothership': 6, 'avpr-scout-ship': 8, 'wolf-ship': 8,
            'fugitive-spaceship': 8, 'upgrade-spaceship': 8, 'feral-spaceship': 8,
          };
          const motionFamilies = Object.values(api.ARRIVAL_SHIP_MOTION_FAMILIES).map(family => ({
            shipId: family.shipId, methods: family.methods, paths: [...family.paths], sourceReview: family.sourceReview,
          }));
          const additionalFamilies = motionFamilies.filter(family => family.shipId !== api.DEFAULT_SHIP_ID);
          assert.deepEqual(additionalFamilies.map(family => family.shipId).sort(), Object.keys(expectedAdditionalFamilies).sort());
          for (const family of additionalFamilies) assert.equal(family.paths.length, expectedAdditionalFamilies[family.shipId]);
          assert.equal(additionalFamilies.reduce((total, family) => total + family.paths.length, 0), 46);
          const motionPaths = motionFamilies.flatMap(family => api.arrivalShipMotionAssetPaths(family.shipId))
            .map(asset => 'public' + asset);
          assert.ok(motionPaths.length > 0, 'The actual optional motion family must be present');
          assert.equal(new Set(motionPaths).size, motionPaths.length, 'Duplicate motion asset registration');
          const fixturePaths = ['wolf-arrival-browser-assets.json', 'clan-ship-browser-assets.json'].flatMap(name => {
            const { paths } = JSON.parse(readFileSync('tests/fixtures/' + name, 'utf8'));
            assert.ok(Array.isArray(paths), name + ': fixture paths are required');
            assert.equal(new Set(paths).size, paths.length, name + ': duplicate paths');
            return paths;
          });
          const profilePaths = motionFamilies.map(family => 'public' + api.shipProfileAssetPath(family.shipId));
          const paths = [...new Set([...motionPaths, ...arrivalPaths, ...fixturePaths, ...profilePaths])].sort();
          for (const file of paths) {
            assert.match(file, /^public\/game\/[A-Za-z0-9._/-]+$/);
            assert.ok(file.split('/').every(part => part && part !== '.' && part !== '..'));
          }
          execFileSync('git', ['sparse-checkout', 'add', '--stdin'], {
            input: paths.map(file => '/' + file).join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'],
          });
          assert.deepEqual(paths.filter(file => !existsSync(file)), [], 'Every registered QA image must exist in the submitted source commit');
          // Original PNGs beside the V1/V2 and batch-01 WebPs are retained by
          // the complete directories in sparse-checkout for real pixel tests.
          writeFileSync('outputs/qa-ship-motion/asset-inputs.json', JSON.stringify({
            sourceCommit: process.env.SHIP_MOTION_SOURCE_COMMIT,
            scope: 'Materialized source paths; usage and rendering are measured separately by the browser report.',
            optionalMotionPaths: motionPaths, motionFamilies, paths,
          }, null, 2) + '\n');
          console.log('Registered images materialized:', paths.length, '; optional ship views:', motionPaths.length);
          NODE
      - name: Typecheck and strictly lint the actual scene, motion system and browser audit
        run: |
          node node_modules/next/dist/bin/next typegen
          npm run typecheck
          node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/PlanetArrivalCinematic.tsx app/game/systems/planetArrival*.ts app/game/systems/planetInsertion.ts app/game/systems/shipInsertionEnergy.ts app/game/systems/huntInsertion.ts scripts/qa-ship-motion.mjs tests/planet-arrival*.test.mjs tests/planet-insertion.test.mjs tests/ship-insertion-energy.test.mjs tests/hunt-insertion.test.mjs
      - name: Regress view selection, pivots, launch sockets, timing and real source pixels
        run: node --experimental-strip-types --test --test-concurrency=1 tests/planet-arrival*.test.mjs tests/planet-insertion.test.mjs tests/ship-insertion-energy.test.mjs tests/hunt-insertion.test.mjs
      - name: Install Chromium and FFmpeg pinned by the project Playwright version
        run: node node_modules/playwright-core/cli.js install --with-deps chromium ffmpeg
      - name: Observe the actual component with native frames and controls through Vite
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" node scripts/qa-ship-motion.mjs
      - name: Require the exact-head report, native captures and recorded video
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = path.resolve('outputs/qa-ship-motion');
          const report = JSON.parse(readFileSync(path.join(directory, 'report.json'), 'utf8'));
          assert.equal(report.sourceCommit, process.env.SHIP_MOTION_SOURCE_COMMIT);
          assert.equal(report.workingTreeDirty, false, 'The native evidence must use unchanged submitted sources');
          assert.equal(report.passed, true);
          assert.ok(report.checks.length > 0 && report.checks.every(check => check.passed));
          assert.ok(report.captures.length > 0, 'Actual browser PNG captures are required');
          const inputs = JSON.parse(readFileSync(path.join(directory, 'asset-inputs.json'), 'utf8'));
          assert.equal(inputs.sourceCommit, report.sourceCommit);
          const families = inputs.motionFamilies.filter(family => family.shipId !== 'classic-predator-spaceship');
          assert.equal(families.length, 6);
          assert.equal(report.familyCoverage.length, 12);
          for (const viewport of ['desktop', 'mobile']) {
            const observed = report.familyCoverage.filter(item => item.viewport === viewport);
            assert.deepEqual(observed.map(item => item.shipId).sort(), families.map(family => family.shipId).sort());
            assert.equal(observed.reduce((total, item) => total + item.views.length, 0), 46);
            assert.equal(new Set(observed.flatMap(item => item.views.map(view => view.file))).size, 46,
              'Every perspective requires a distinct photograph in this viewport');
            for (const family of families) {
              const coverage = observed.find(item => item.shipId === family.shipId);
              assert.equal(coverage.passed, true);
              assert.deepEqual(coverage.expectedPaths.slice().sort(), family.paths.slice().sort());
              assert.deepEqual(coverage.views.map(view => view.path).sort(), family.paths.slice().sort());
              for (const view of coverage.views) {
                const capture = report.captures.find(item => item.file === view.file);
                assert.ok(capture, 'Every counted perspective needs its own actual browser photograph');
                assert.equal(capture.label, `${viewport}-${family.shipId}-${view.id}`);
                assert.equal(capture.sha256, view.sha256);
                assert.ok(view.elapsedAfter >= view.elapsedBefore && view.elapsedAfter < view.heldUntilMs);
              }
            }
          }
          assert.equal(report.video.requested, true);
          assert.equal(report.video.supported, true, 'The installed FFmpeg must support native video');
          assert.ok(report.video.files.length > 0, 'A native browser WebM is required');
          for (const evidence of [...report.captures, ...report.video.files]) {
            const filename = path.resolve(directory, evidence.file);
            assert.ok(filename.startsWith(directory + path.sep), 'Evidence must stay within the output directory');
            const bytes = readFileSync(filename);
            assert.ok(bytes.length > 0);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), evidence.sha256, evidence.file + ': evidence hash mismatch');
          }
          console.log('Verified native evidence:', report.checks.length, 'checks,', report.captures.length,
            'PNG captures,', report.video.files.length, 'video(s).');
          NODE
      - name: Preserve source context, native captures, video, report and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ship-motion-${{ github.event.pull_request.head.sha || github.sha }}
          path: outputs/qa-ship-motion/
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14
