name: Mobility V1.3 transitions and production delivery
# Audit Markdown EOF normalization without weakening archive or publication checks.
on:
  push:
    branches: [feat/mobility-garage-gameplay-20261108]
    paths: [.github/workflows/mobility-delivery-v13.yml]
permissions:
  contents: write
concurrency:
  group: mobility-delivery-v13
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse' && github.ref == 'refs/heads/feat/mobility-garage-gameplay-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /types/
            /desktop/
            /db/
            /drizzle/
            /worker/
            /build/
            /.openai/hosting.json
            /.github/workflows/
            /docs/campagne/mobilite/
            /production/mobility-20261108/
            /production/homeworld-sectors-20261103/YAUTJA_MARCHE_MONTURES_CHENILS_20261103.xlsx
            /public/**/*.json
            /public/game/mobility/
      - name: Import exact reviewed sources without overwriting historical guide or QA recipe
        run: |
          python3 - <<'PY'
          import hashlib,io,json,subprocess,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          url='https://d2ol7oe51mr4n9.cloudfront.net/user_3JHwJlNzgmcxQy32tjF7NiVZPuH/998e5e12-a33a-4c3d-b211-7cf16630f2d2.zip'
          with urllib.request.urlopen(url,timeout=60) as response:data=response.read(883950)
          assert len(data)==883949 and hashlib.sha256(data).hexdigest()=='5d1e42d5896d15417dc9e328dd564ea7e2d39bd2578ac6ac69d5b3d71ebb84c7'
          mp='production/mobility-20261108/v1.3/qa/delivery-manifest.json'
          guide='docs/campagne/mobilite/GAMEPLAY_GARAGE_V1.md'
          old_qa='scripts/qa-mobility-native.mjs';new_qa='scripts/qa-mobility-v13-native.mjs'
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            assert len(z.infolist())==34 and sum(i.file_size for i in z.infolist())==9099656 and z.testzip() is None
            raw=z.read(mp);assert hashlib.sha256(raw).hexdigest()=='03a2f24db789c19afd1185941812d07b5766278bc619f4818a212d3fd76b7017'
            m=json.loads(raw);assert m['base_commit']=='fbaf8bb5d7868000d4a6544ceb87985b0cff1650'
            paths={e['path'] for e in m['files']}
            assert len(m['files'])==33 and len(paths)==33 and {guide,old_qa}<=paths and set(z.namelist())==paths|{mp}
            outputs={mp:raw};preserved={};normalizations={}
            for e in m['files']:
              name=e['path'];p=Path(name);body=z.read(name);old=e['expected_previous_git_blob']
              assert not p.is_absolute() and '..' not in PurePosixPath(name).parts
              assert name.startswith(('app/game/','docs/campagne/mobilite/','production/mobility-20261108/v1.3/','scripts/','tests/'))
              assert len(body)==e['bytes'] and hashlib.sha256(body).hexdigest()==e['sha256'] and blob(body)==e['git_blob_sha1']
              if name in (guide,old_qa):
                assert p.is_file();preserved[name]=blob(p.read_bytes())
                if name==guide:continue
                p=Path(new_qa);assert not p.exists();outputs[new_qa]=body;continue
              assert (p.exists() and blob(p.read_bytes())==old) or (not p.exists() and old is None),'Concurrent change: '+name
              if name.endswith('.md') and name.startswith(('docs/campagne/mobilite/','production/mobility-20261108/v1.3/')):
                normalized=body.rstrip(bytes([13,10]))+bytes([10])
                if normalized!=body:
                  normalizations[name]={'archive_sha256':hashlib.sha256(body).hexdigest(),'published_sha256':hashlib.sha256(normalized).hexdigest(),'archive_git_blob':blob(body),'published_git_blob':blob(normalized),'reason':'Only trailing CR/LF normalized to one LF after archive integrity verification.'}
                  body=normalized
              outputs[name]=body
            assert not Path(mp).exists()
          mapping='production/mobility-20261108/v1.3/qa/publication-map.json'
          assert not Path(mapping).exists()
          outputs[mapping]=(json.dumps({'archive_manifest_sha256':hashlib.sha256(raw).hexdigest(),'preserved_historical_blobs':preserved,'markdown_eof_normalizations':normalizations,'renamed_without_byte_changes':{old_qa:new_qa},'deferred_guide':guide,'reason':'Preserve exact published V1.2 guide and browser recipe; publish V1.3 recipe as a separate version.'},indent=2)+chr(10)).encode()
          for name,body in outputs.items():
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(body)
          for name,sha in preserved.items():assert blob(Path(name).read_bytes())==sha
          subprocess.run(['git','add','--sparse','--',*sorted(outputs)],check=True)
          actual=set(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split(chr(0))))
          assert actual==set(outputs) and len(actual)==34 and not actual.intersection(preserved)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Create local source revision, not yet published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mobilite): transitions pilote, entretien par paliers et production des 50 modeles'
          mkdir -p outputs/mobility-v13
          git rev-parse HEAD > outputs/mobility-v13/source-commit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies with lifecycle scripts explicitly disabled
        env:
          npm_config_ignore_scripts: 'true'
          npm_config_cache: ${{ runner.temp }}/mobility-v13-npm-cache
        run: |
          node --version
          npm --version
          test "$(npm config get ignore-scripts)" = true
          npm ci --ignore-scripts=true --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
          node -e "const oxide=require('@tailwindcss/oxide'); const ts=require('typescript'); if(typeof oxide.Scanner!=='function'||typeof ts.transpileModule!=='function')process.exit(1); console.log('Locked TypeScript and native Tailwind modules load successfully');"
      - name: Verify canonical data, both real workbooks and full TypeScript graph
        run: |
          node scripts/sync-mobility-catalogue.mjs --check | tee outputs/mobility-v13/catalogue-report.json
          python3 scripts/verify-mobility-workbook.py | tee outputs/mobility-v13/historical-workbook-report.json
          python3 scripts/verify-mobility-production-v13.py | tee outputs/mobility-v13/production-report.json
          npm run typecheck | tee outputs/mobility-v13/typecheck.txt
      - name: Run 315 existing and new tests without omissions
        run: |
          node --test --test-concurrency=1 tests/mobility-core.test.mjs tests/mobility-integration.test.mjs tests/mobility-hardening.test.mjs tests/mobility-controls-workshop.test.mjs tests/mobility-build-boundary.test.mjs tests/mobility-training-reward.test.mjs tests/mobility-qa-driver.test.mjs tests/clan-ship-operations-save.test.mjs tests/mobility-transitions-v13.test.mjs | tee outputs/mobility-v13/tests.tap
          grep -qx '# tests 315' outputs/mobility-v13/tests.tap
          grep -qx '# pass 315' outputs/mobility-v13/tests.tap
          grep -qx '# fail 0' outputs/mobility-v13/tests.tap
          grep -qx '# skipped 0' outputs/mobility-v13/tests.tap
          node node_modules/typescript/bin/tsc -p tests/mobility/tsconfig.json
      - name: Install locked browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Exercise transitions, cancellation, maintenance and input controls
        run: |
          node scripts/build-mobility-browser-fixture.mjs
          MOBILITY_QA_COMMIT=$(git rev-parse HEAD) node scripts/qa-mobility-v13-native.mjs
          MOBILITY_QA_COMMIT=$(git rev-parse HEAD) node scripts/qa-mobility-controls-native.mjs
          git diff --exit-code
          git diff --cached --exit-code
      - name: Preserve observed evidence and publish only game and documentation files
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          target=Path('production/mobility-20261108/v1.3/qa/native');assert not target.exists();target.mkdir()
          for name,count in [('browser-report.json',33),('controls-browser-report.json',12)]:
            report=json.loads(Path('outputs/qa-mobility-native',name).read_text())
            assert report['passed'] and report['sourceCommit']==source and len(report['checks'])==count and all(c['passed'] for c in report['checks'])
          paths=list(Path('outputs/mobility-v13').glob('*'))+list(Path('outputs/qa-mobility-native').glob('*report.json'))+list(Path('outputs/qa-mobility-native').glob('*.png'))
          assert len(paths)<=24 and all(p.is_file() and p.stat().st_size<4_000_000 for p in paths)
          assert len({p.name for p in paths})==len(paths)
          rows=[]
          for p in paths:
            raw=p.read_bytes();body=raw.rstrip(bytes([13,10]))+bytes([10]) if p.name=='typecheck.txt' else raw
            (target/p.name).write_bytes(body)
            rows.append({'file':p.name,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'raw_sha256':hashlib.sha256(raw).hexdigest()})
          result={'source_commit':source,'workflow_run':os.environ['GITHUB_RUN_ID'],'tests_passed':315,'new_tests_included':115,'native_checks_passed':33,'controls_checks_passed':12,'full_typecheck_passed':True,'production_models':50,'scope_points':21,'workbook_sheets':16,'prior_workbook_preserved':True,'rider_png_delivered':0,'browser_recipe':'scripts/qa-mobility-v13-native.mjs','files':rows,'scope':'Two yard vehicles; actual React/reducer/storage with declared adult funding fixture. No full Homeworld journey, physical controller or new art certification.'}
          (target/'RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+chr(10))
          subprocess.run(['git','add','--',str(target)],check=True)
          actual=set(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split(chr(0))))
          assert actual and all(p.startswith(str(target)+'/') for p in actual)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git commit -m 'test(mobilite): preuves V1.3, transitions et atelier [skip ci]'
          test -z "$(git diff ${{ github.sha }} HEAD --name-only -- .github/workflows)"
          git push origin HEAD:refs/heads/feat/mobility-garage-gameplay-20261108
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobility-v13-delivery-evidence
          path: |
            outputs/mobility-v13/
            outputs/qa-mobility-native/*report.json
            outputs/qa-mobility-native/*.png
          retention-days: 7
