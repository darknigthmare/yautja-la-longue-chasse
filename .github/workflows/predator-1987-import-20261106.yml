name: Predator 1987 - complete DLC archive import
on:
  push:
    branches: [feat/dlc-predator-1987-import-20261106]
    paths:
      - .github/workflows/predator-1987-import-20261106.yml
      - dlc/predator-1987/tools/import_archives.py
permissions:
  contents: write
concurrency:
  group: predator-1987-import-20261106
  cancel-in-progress: false
jobs:
  import-and-verify:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse' && github.ref == 'refs/heads/feat/dlc-predator-1987-import-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            dlc/predator-1987
      - name: Verify the exact importer tested against all three original archives
        run: echo '69dee17eeaad6cd3ae037dc2b7872cea91ff363f570910e3a19873d333c03cde  dlc/predator-1987/tools/import_archives.py' | sha256sum --check
      - name: Import pinned originals and run isolated DLC tests
        run: python3 dlc/predator-1987/tools/import_archives.py
      - name: Verify idempotence and all delivered bytes without repository writes
        run: python3 dlc/predator-1987/tools/import_archives.py --check-only
      - name: Stage and verify only the dedicated DLC folder
        shell: bash
        run: |
          set -euo pipefail
          git add -- dlc/predator-1987
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          root=Path('dlc/predator-1987')
          names=list(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          assert not names or len(names)==39, names
          assert all(n.startswith('dlc/predator-1987/') for n in names), names
          assert len([p for p in root.rglob('*') if p.is_file()])==42
          statuses=subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines()
          assert all(s.startswith('A\t') for s in statuses), statuses
          print({'staged_files':len(names),'total_dlc_files':42,'original_archives':3,'original_png':7})
          PY
          git diff --cached --check
      - name: Publish only to the dedicated PR branch without force
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(dlc): importer Predator 1987 V0.1-V0.3 et sept PNG [skip ci]'
          git push origin HEAD:refs/heads/feat/dlc-predator-1987-import-20261106
