name: Clan field props — individual sprites and controls
on:
  push:
    branches: [feat/clan-war-field-sprites-20261103]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig*.json
            /eslint.config.mjs
            /app/game/
            /types/
            /lib/
            /tests/
            /scripts/build-clan-field-pack.mjs
            /scripts/apply-clan-field-ui.mjs
            /scripts/qa-clan-war-v115-multitab-v151.mjs
            /public/game/assets/v15/trophies/manifest.json
            /public/game/assets/clan-field-20261103/
            /docs/clan-war-field-pack/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Render twelve separate transparent originals
        run: node scripts/build-clan-field-pack.mjs
      - name: Integrate visual state and non-repeating keyboard controls
        run: |
          node scripts/apply-clan-field-ui.mjs
          node scripts/apply-clan-field-ui.mjs
      - name: Asset, controls and source-engine regressions
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            tests/clan-field-pack-20261103.test.mjs \
            tests/clan-war-v115-multitab-v151.test.mjs \
            tests/clan-war-operations-v115.test.mjs \
            tests/clan-war-stealth-last-contact.test.mjs \
            tests/clan-war-outer-pace-reconcile.test.mjs \
            tests/clan-war-council-v146.test.mjs \
            tests/clan-war-source-consolidation-v147.test.mjs
      - name: Check actual patched interfaces
        run: npx --no-install tsc --noEmit -p tsconfig.clan-field-20261103.json
      - name: Lint changed source and generation scripts
        run: npx --no-install eslint app/game/ClanWarOperationsV115.tsx app/game/ClanWarRtsSquadsV133.tsx app/game/ClanWarFieldSprite.tsx app/game/systems/clanWarFieldControls.ts scripts/build-clan-field-pack.mjs scripts/apply-clan-field-ui.mjs tests/clan-field-pack-20261103.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Preserve real two-tab save-lock regressions
        run: |
          export AUDIT_CHROME_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          node scripts/qa-clan-war-v115-multitab-v151.mjs
      - name: Commit only validated pack and explicitly targeted interfaces
        if: github.ref == 'refs/heads/feat/clan-war-field-sprites-20261103'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/game/assets/clan-field-20261103 app/game/ClanWarOperationsV115.tsx app/game/ClanWarRtsSquadsV133.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'assets(clan-war): 12 individually rendered transparent props and tested UI integration'
            git push origin HEAD:refs/heads/feat/clan-war-field-sprites-20261103
          fi
      - name: Preserve generated pack and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clan-field-12-original-props-and-qa
          path: |
            public/game/assets/clan-field-20261103/
            outputs/clan-war-v115-multitab-v151/
          retention-days: 30
          if-no-files-found: warn
