name: Diagnose O6-M06 component lint
on:
  push:
    branches: [codex/qa-o6-retour-lint-20261128]
permissions:
  contents: read
jobs:
  little-trail:
    name: Carry the tools and speak on the native council terrace
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'e75bf049521788b2a6884ce855f9f6f5ffb1866a'
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /worker/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /content/the-pit/
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/prologue/v47/
            /public/game/prologue/v72/
            /public/game/youth/v48/
            /public/game/youth/v49/
            /public/game/youth/v52/
            /public/game/homeworld/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/sprites/v5/film-plates/
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Restore original registered runtime assets
        run: node scripts/materialize-asset-raccords-20261120.mjs runtime
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the scene and the browser recipe
        if: ${{ !cancelled() }}
        run: node node_modules/eslint/bin/eslint.js app/game/HomeworldTwilightReturnO6.tsx app/game/HomeworldHub.tsx app/game/GameClient.tsx app/game/systems/originTwilightReturnO6.ts app/game/systems/originLittleTrailO6.ts app/game/systems/originsV151.ts app/game/save.ts tests/origin-twilight-return-o6.test.mjs tests/helpers/origin-twilight-return-o6.mjs scripts/qa-origin-twilight-return-o6.mjs
