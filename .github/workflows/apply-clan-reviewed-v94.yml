name: Apply pinned clan fixes once
on:
  push:
    branches: [fix/v94-audit-reliability-20261016]
    paths: [.github/workflows/apply-clan-reviewed-v94.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse' && github.ref == 'refs/heads/fix/v94-audit-reliability-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            .github
            app
            scripts
            tests
      - name: Verify every original and replacement before applying reviewed bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^') == '15e3ab017a87ff7a77ff182de551853a69a76e42', 'Unexpected parent; refuse'
          allowed = {'.github/workflows/audit-v94.yml', 'app/game/ClanWarPanelV85.tsx', 'app/game/systems/clanWarSessionV85.ts', 'app/game/systems/clanWarCanyonV85.ts', 'tests/clan-war-session-v85.test.mjs', 'tests/clan-war-durability-v94.test.mjs', 'tests/clan-war-lifecycle-v94.test.mjs', 'tests/clan-war-canyon-validity-v94.test.mjs', 'tests/browser/clan-war-v94.fixture.tsx', 'scripts/qa-clan-war-browser-v94.mjs'}
          parts = [pathlib.Path(f'scripts/qa-clan-patch-v94/{i:02}.part') for i in range(10)]
          encoded = ''.join(p.read_text() for p in parts)
          assert len(encoded) == 18268
          payload = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '5658d9098484f79aed59a95daa2c12b4b6d7660d7a40e5b7e25f354a55e4e8fa'
          edits = json.loads(payload)
          assert len(edits) == 10 and {e['path'] for e in edits} == allowed
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          pending = []
          for entry in edits:
              path = pathlib.Path(entry['path'])
              assert not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              if entry['before'] is None:
                  assert not path.exists(), str(path)
                  original = b''
              else:
                  original = path.read_bytes()
                  assert blob(original) == entry['before'], str(path)
              lines = original.decode('utf-8').splitlines(keepends=True)
              for edit in reversed(entry['edits']):
                  assert 0 <= edit['start'] <= edit['end'] <= len(lines)
                  lines[edit['start']:edit['end']] = edit['lines']
              result = ''.join(lines).encode('utf-8')
              assert blob(result) == entry['after'], 'Replacement mismatch: '+str(path)
              pending.append((path,result))
          for path,data in pending:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          temporary = parts + [pathlib.Path('.github/workflows/apply-clan-reviewed-v94.yml')]
          for path in temporary:
              path.unlink()
          names = sorted(allowed | {str(p) for p in temporary})
          subprocess.run(['git','add','--',*names],check=True)
          changed = set(git('diff','--cached','--name-only').splitlines())
          assert changed == set(names), changed
          print('Verified and staged ten reviewed files; temporary transport removed.')
          PY
      - name: Commit to this PR branch only, never force push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v94): confirm clan saves, freeze inactive combat and keep canyon archives valid'
          git push origin HEAD:refs/heads/fix/v94-audit-reliability-20261016
