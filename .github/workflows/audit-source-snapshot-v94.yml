name: V94 read-only source snapshot

on:
  push:
    branches: [fix/v94-audit-reliability-20261016]
    paths: [.github/workflows/audit-source-snapshot-v94.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /tests/
            /scripts/
            /desktop/
            /build/
            /db/
            /drizzle/
            /worker/
            /docs/
            /.github/workflows/
            /public/**/manifest.json
            /public/game/homeworld/v74/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive tracked source and offline verification tools
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,tarfile
          allowed={'package.json','package-lock.json','tsconfig.json','next.config.ts','eslint.config.mjs','AGENTS.md','README.md','.gitignore','.vercelignore','vercel.json'}
          prefixes=('app/','tests/','scripts/','desktop/','build/','db/','drizzle/','worker/','docs/','.github/workflows/')
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          files=[p for p in files if p and pathlib.Path(p).is_file() and (p in allowed or p.startswith(prefixes) or p.startswith('public/') and (p.endswith('/manifest.json') or p.startswith('public/game/homeworld/v74/')))]
          with tarfile.open('audit-current-source.tar.gz','w:gz') as archive:
              for p in files: archive.add(p,arcname=p,recursive=False)
          def safe_tool(member):
              name=pathlib.PurePosixPath(member.name)
              if name.suffix.lower() in {'.woff','.woff2','.ttf','.otf','.eot'} or name.name.startswith('.env') or name.name=='.npmrc': return None
              return member
          with tarfile.open('audit-locked-tools.tar.gz','w:gz') as archive:
              archive.add('node_modules',filter=safe_tool)
          pathlib.Path('audit-source-revision.json').write_text(json.dumps({'sha':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':len(files)},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-current-source-v94
          path: |
            audit-current-source.tar.gz
            audit-locked-tools.tar.gz
            audit-source-revision.json
          retention-days: 2
          if-no-files-found: error
