name: Mobility workbench and verification
on:
  push:
    branches: [feat/mobility-garage-gameplay-20261108]
    paths: ['.github/workflows/mobility-workbench-20261108.yml']
permissions:
  contents: read
concurrency:
  group: mobility-workbench-20261108
  cancel-in-progress: true
jobs:
  source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/
            /public/**/*.json
            !/art-source/
            !/production/
            !/assets/
            !/legacy/
            !/dlc/
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked packages without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive public manifests and test-only dependencies
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          roots=['public','node_modules/react','node_modules/react-dom','node_modules/scheduler','node_modules/@types','node_modules/csstype','node_modules/typescript','node_modules/next/dist/docs']
          with zipfile.ZipFile('mobility-test-context.zip','w',zipfile.ZIP_DEFLATED) as z:
            for root in roots:
              for p in pathlib.Path(root).rglob('*'):
                if p.is_file() and (root!='public' or p.suffix=='.json'):
                  z.write(p,str(p))
          print(pathlib.Path('mobility-test-context.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-test-context
          path: mobility-test-context.zip
          retention-days: 3
