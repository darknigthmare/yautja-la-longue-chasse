name: QA · réconcilier les contrôles de la PR 192
on:
  push:
    branches: [codex/qa-reconcile-pr192-20261127]
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /production/clan-war-command-20261109/qa/ci/
            /.github/workflows/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Restaurer les fichiers actuels et contrôler leurs empreintes
        env:
          P0P1_CI_MANIFEST: production/clan-war-command-20261109/qa/ci/runtime-file-inputs.json
        run: node scripts/include-p0p1-ci-inputs-20261109.mjs --include
      - name: Jouer la décision du pilote et vérifier les audios livrés
        run: node --experimental-strip-types --test tests/qa-hunt-ground-policy-v112.test.mjs tests/audio-pack-v54.test.mjs
      - name: Vérifier le hachage des vues d’octets et des objets de preuve
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const file = readFileSync('scripts/qa-hunt-campaign-browser-v112.mjs', 'utf8');
          const expression = file.match(/^const hash=(.*);$/m)?.[1];
          assert.ok(expression, 'Missing proof hash');
          const hash = Function('createHash', 'return ' + expression)(createHash);
          const prefix = Uint8Array.of(0, 11, 23, 0);
          const proof = Buffer.from([11, 23]);
          const expected = createHash('sha256').update(proof).digest('hex');
          assert.equal(hash(prefix.subarray(1, 3)), expected);
          assert.equal(hash(new DataView(prefix.buffer, 1, 2)), expected);
          assert.equal(hash(proof), expected);
          assert.equal(hash({ result: 'passed' }), hash('{"result":"passed"}'));
          console.log('PASS byte views and JSON proof hashes');
          NODE
