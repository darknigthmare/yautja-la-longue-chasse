name: Quest baseline snapshot 20261109
on:
  push:
    branches: [feat/quetes-vivantes-bible-20261109]
    paths: [.github/workflows/quest-baseline-export-20261109.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19317af4f6cf05532a8ba56dbfe8f56fc4b225d9
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Export installed testing packages and framework guides only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quest-toolchain"
          tar -czf "$RUNNER_TEMP/quest-toolchain/packages.tar.gz" node_modules/typescript node_modules/react node_modules/react-dom node_modules/scheduler node_modules/@types/react node_modules/@types/react-dom node_modules/@types/node node_modules/csstype node_modules/undici-types node_modules/next/dist/docs
          node -e 'const fs=require("fs"); let x={baseline:"19317af4f6cf05532a8ba56dbfe8f56fc4b225d9",note:"Unmodified packages installed from the existing lockfile; no gameplay test result."}; for(const p of ["typescript","react","react-dom","scheduler","next"]) x[p]=require(p+"/package.json").version; fs.writeFileSync(process.env.RUNNER_TEMP+"/quest-toolchain/versions.json",JSON.stringify(x,null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: quest-locked-toolchain-19317af4
          path: ${{ runner.temp }}/quest-toolchain/
          retention-days: 3
          if-no-files-found: error
