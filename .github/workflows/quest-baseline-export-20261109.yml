name: Quest baseline snapshot 20261109
on:
  push:
    branches: [feat/quetes-vivantes-bible-20261109]
    paths: [.github/workflows/quest-baseline-export-20261109.yml]
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19317af4f6cf05532a8ba56dbfe8f56fc4b225d9
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/**/
            !/public/**/*
            /public/**/*.json
      - name: Archive original asset manifests only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quest-manifests"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'quest-manifests'; entries=[]
          with tarfile.open(out/'public-json.tar.gz','w:gz') as t:
            for raw in subprocess.check_output(['git','ls-files','-z','public']).split(b'\0'):
              if not raw: continue
              rel=raw.decode();p=root/rel
              if p.suffix!='.json' or not p.is_file() or p.is_symlink():continue
              data=p.read_bytes();t.add(p,arcname=rel,recursive=False)
              entries.append({'path':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          assert entries,'No JSON manifests exported'
          (out/'manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          print(len(entries),'unchanged public JSON files; no tests or artwork validation claimed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quest-original-public-json-19317af4
          path: ${{ runner.temp }}/quest-manifests/
          retention-days: 3
          if-no-files-found: error
