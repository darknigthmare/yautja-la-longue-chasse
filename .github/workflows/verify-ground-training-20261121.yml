name: Measure field loads and verify the admitted training record
on:
  push:
    branches: [codex/verify-ground-training-20261121]
permissions:
  contents: read
jobs:
  ground:
    name: Measure the unchanged full-load criterion across 24 missions and armors
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b58ee2088d3957e7c56521be1842f880de4d58fb
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /scripts/
            /docs/qa/v112-ground-campaign/campaign-origin-save.json
            /docs/qa/v112-ground-campaign/tool-origin.json
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise actual carriage through boarding and extraction
        run: node scripts/qa-hunt-ground-campaign-v112.mjs --harvest=true --baseSave=docs/qa/v112-ground-campaign/campaign-origin-save.json --replay=true --seconds=360 --minimumRetainedLoad=1 --output=outputs/qa-p0-ground-full
      - name: Preserve all load and extraction results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-ground-campaign-b58ee2088d3957e7c56521be1842f880de4d58fb
          path: outputs/qa-p0-ground-full/
          if-no-files-found: error
  ship-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      AUDIT_CHROME_CHANNEL: chrome
      AUDIT_CHROME_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b58ee2088d3957e7c56521be1842f880de4d58fb
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /tests/
            /scripts/
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        id: dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: New score receipts and runtime regressions
        run: >-
          node --test --test-reporter=spec
          tests/ship-training-receipt-v94.test.mjs
          tests/ship-training-lifecycle-v94.test.mjs
          tests/ship-training-recovery-v94.test.mjs
          tests/ship-training-ack-v94.test.mjs
          tests/ship-service-commit-v94.test.mjs
      - name: Historical ship progression, ownership and training rules
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          tests/ship-progression.test.mjs tests/ship-progression-owner.test.mjs
          tests/ship-hub-input-runtime.test.mjs tests/training-drill.test.mjs
          tests/training-lifecycle-v94.test.mjs
      - name: Strict lint of changed ship training runtime
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
          app/game/ShipHub.tsx app/game/TrainingDrill.tsx
          app/game/useShipTrainingV94.ts app/game/systems/shipTrainingReceiptV94.ts
          app/game/systems/shipTrainingRecoveryV94.ts
          app/game/systems/shipTrainingAcknowledgementV94.ts
          app/game/useShipServiceCommitV94.ts
      - name: Play native ship training and verify score storage in Chrome
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/qa-ship-training-browser-v94.mjs
      - name: Preserve training score and recovery artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ship-training-b58ee2088d3957e7c56521be1842f880de4d58fb
          path: outputs/
          if-no-files-found: warn
