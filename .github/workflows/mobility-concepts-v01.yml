name: Mobility V0.1 - import individual concept PNGs
on:
  push:
    branches: [claude/bible-de-campagne]
    paths:
      - .github/workflows/mobility-concepts-v01.yml
      - docs/campagne/mobilite/SPRITES_EXTRACTION_V0_1.json
      - docs/campagne/mobilite/import_individual_concepts_v01.py
permissions:
  contents: write
concurrency:
  group: mobility-concepts-v01-pr116
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse' && github.ref == 'refs/heads/claude/bible-de-campagne'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            docs/campagne/mobilite
            art-source/mobilite/vehicules-montures/v0.1
      - name: Extract exact source pixels and verify all fifty RGBA fingerprints
        run: python3 docs/campagne/mobilite/import_individual_concepts_v01.py
      - name: Verify idempotent extraction
        run: python3 docs/campagne/mobilite/import_individual_concepts_v01.py
      - name: Commit only provisional source art and its honest status report
        shell: bash
        run: |
          set -euo pipefail
          git add -- art-source/mobilite/vehicules-montures/v0.1 docs/campagne/mobilite/SPRITES_INDIVIDUELS_V0_1.md
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all(p.startswith('art-source/mobilite/vehicules-montures/v0.1/') or p=='docs/campagne/mobilite/SPRITES_INDIVIDUELS_V0_1.md' for p in names), names
          assert not names or len(names)==53, len(names)
          PY
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'art(mobilite): 50 PNG individuels extraits, concepts non valides 1:1 [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/claude/bible-de-campagne; then exit 0; fi
            git fetch origin claude/bible-de-campagne
            git rebase FETCH_HEAD || exit 1
          done
          exit 1
