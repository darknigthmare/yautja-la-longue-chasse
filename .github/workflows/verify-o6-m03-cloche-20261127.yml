name: Verify the native O6 town bell
on:
  push:
    branches: [codex/verify-o6-m03-cloche-20261127]
permissions:
  contents: read
jobs:
  town-bell:
    name: Play the town streets, gate and delivery bell from both M02 outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '357a41300cb814ce0af76de21819e8cd077ba9af'
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /worker/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /content/the-pit/
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/prologue/v47/
            /public/game/prologue/v72/
            /public/game/youth/v48/
            /public/game/homeworld/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/sprites/v5/film-plates/
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Restore original registered runtime assets
        run: node scripts/materialize-asset-raccords-20261120.mjs runtime
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify real origins, room positions and durable receipts
        run: node --experimental-strip-types --test --test-concurrency=1 --test-reporter=spec tests/origin-town-bell-o6.test.mjs tests/origin-cohort-race-o6.test.mjs tests/origin-first-shock-o6.test.mjs tests/homeworld-city-places-m003.test.mjs
      - name: Verify the TypeScript entry and save contracts
        if: ${{ !cancelled() }}
        run: node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint the native scene, rules and recipe
        if: ${{ !cancelled() }}
        run: node node_modules/eslint/bin/eslint.js app/game/HomeworldTownBellO6.tsx app/game/systems/originTownBellO6.ts app/game/systems/originTownBellPlacesO6.ts tests/origin-town-bell-o6.test.mjs tests/helpers/origin-town-bell-o6.mjs scripts/qa-origin-town-bell-o6.mjs
      - name: Walk the streets, open the gate, ring and visit both contacts in Chromium
        if: ${{ !cancelled() }}
        run: node scripts/qa-origin-town-bell-o6.mjs
      - name: Preserve the screenshots and actually committed receipts
        if: ${{ !cancelled() && hashFiles('outputs/qa-origin-town-bell-o6/report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-town-bell-o6
          path: outputs/qa-origin-town-bell-o6/
          if-no-files-found: error
