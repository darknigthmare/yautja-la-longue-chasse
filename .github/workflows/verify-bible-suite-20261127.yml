name: Verify played campaign chapters · 27 November
on:
  push:
    branches: [codex/verify-bible-suite-20261127]
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Verify campaign proofs, workbook and runtime asset inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '827831fb38c4eb668adf31a1d6f79fab9de09716'
      BASE_COMMIT: '2769b094862aea97f10fc0e5c4f1154489a8a8bc'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '827831fb38c4eb668adf31a1d6f79fab9de09716'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /production/INVENTAIRE_BIBLE_20261122.*
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /public/game/xeno-prime/berceau-v1/
            /public/audio/
            /public/game/quatza-rij/
            /public/game/assets/v37/tribes/v2/homeworld-darkjungle-v2--fbc392bc9618642d.webp
            /public/game/assets/v37/tribes/v2/homeworld-forest-v2--8fdc633789dcd9c0.webp
            /public/game/assets/v37/tribes/v2/homeworld-lava-v2--ecd85e06796799d2.webp
            /public/game/backgrounds/ice-depth-v4.webp
            /public/game/backgrounds/ocean-depth-v8.png
            /public/game/backgrounds/ruins-depth-v8.png
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/homeworld/v67/ash-causeway-vista.png
            /public/game/homeworld/v67/glass-processional-vista.png
            /public/game/sprites/v8/ecology/cinder-12/basalt-ram-sheet.png
            /public/game/sprites/v8/ecology/cinder-12/smoke-wyvern-sheet.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
            /public/game/sprites/v8/ecology/nivalis-k/snow-prowler-sheet.png
            /public/game/sprites/v8/ecology/oseris-iv/amber-jaw-stalker-sheet.png
            /public/game/sprites/v8/ecology/pelagos-m/shellback-sheet.png
            /public/game/sprites/v8/ecology/serekh-9/burrow-snake-sheet.png
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues-index.json
            /public/game/assets/v139/rig-gauntlets/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/assets/v133/concept-masks/
            /public/game/assets/v133/decals/decal-atlas.webp
            /public/game/sprites/v62/heads/
            /public/game/assets/v134/
            /public/game/assets/v135/
            /public/game/assets/v136/
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate canonical runtime evidence
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs candidate || { cat outputs/qa-asset-raccords-20261120/runtime-generator.log; exit 1; }
          node scripts/check-hunt-integration-source-v112.mjs --current
      - name: Verify Next types
        if: ${{ !cancelled() }}
        run: |
          node node_modules/next/dist/bin/next typegen
          node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Test the temple, Elder transmission and retained hunt contracts
        if: ${{ !cancelled() }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1 --test-reporter=spec
          tests/blooded-temple-v174.test.mjs tests/quatza-rij.test.mjs tests/ship-receipt-v161.test.mjs
          tests/successor-trial-r2-m054.test.mjs tests/elite-recognition-v174.test.mjs
          tests/youth-training.test.ts tests/youth-campaign.test.mjs tests/nursery-opening.test.mjs tests/nursery-cohort-v172.test.mjs tests/homeworld-route-m034.test.mjs tests/homeworld-pack-trial-m029.test.mjs tests/homeworld-adjutant-save-m029.test.mjs tests/war-command-intro-r2-m036.test.mjs tests/war-narrative-r2-m035.test.mjs tests/clan-war-canyon-m037.test.mjs tests/trophy-introduction-r2-m038.test.mjs tests/long-memory-r2-m055.test.mjs
          tests/elder-workshop-v172.test.mjs tests/clan-ship-operations.test.mjs
          tests/qa-hunt-ground-policy-v112.test.mjs tests/audio-pack-v54.test.mjs
      - name: Lint the new scenario screens, rules and pilots
        if: ${{ !cancelled() }}
        run: >-
          npx eslint app/game/BloodedTempleV174.tsx app/game/ClanChroniclePanel.tsx app/game/NurseryPrologueScreen.tsx app/game/systems/nurseryOpening.ts
          app/game/systems/bloodedTempleV174.ts app/game/EliteRecognition.tsx app/game/systems/eliteRecognitionV174.ts
          app/game/SuccessorTrialR2M054Panel.tsx app/game/systems/successorTrialR2M054.ts
          scripts/qa-blooded-temple-v174.mjs app/game/LongMemoryR2M055Panel.tsx
          app/game/YouthTrainingScreen.tsx app/game/systems/youthWorkshopV174.ts app/game/youthWorkshopRenderingV174.ts
          app/game/systems/longMemoryR2M055.ts app/game/TrophyUsagesV147.tsx app/game/ResidencePanelV149.tsx
          app/game/HomeworldRouteM034.tsx app/game/systems/homeworldRouteM034.ts
          app/game/HomeworldPackTrialM029.tsx app/game/HomeworldAdjutantM029.tsx app/game/systems/homeworldAdjutantM029.ts app/game/WarCommandIntroR2M036Panel.tsx app/game/systems/warCommandIntroR2M036.ts
          app/game/WarNarrativeR2M035.tsx app/game/systems/warNarrativeR2M035.ts app/game/ClanWarCanyonM037.tsx app/game/systems/clanWarM037.ts
      - name: Report canonical inventory differences
        if: ${{ !cancelled() && hashFiles('outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const prior = JSON.parse(readFileSync('docs/qa/current-integration-20261103/runtime-inputs.json'));
          const next = JSON.parse(readFileSync('outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json'));
          const old = new Map(prior.entries.map(item => [item.path, item]));
          const paths = new Set(next.entries.map(item => item.path));
          const changes = next.entries.filter(item => JSON.stringify(old.get(item.path)) !== JSON.stringify(item));
          const removed = prior.entries.filter(item => !paths.has(item.path)).map(item => item.path);
          console.log('V113_DELTA ' + JSON.stringify({ files: next.files, bytes: next.bytes, changes, removed }));
          NODE

