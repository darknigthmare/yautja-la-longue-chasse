name: Mobility V1.2 workbook manifest integrity
on:
  push:
    branches: [codex/mobility-v12-manifest-integrity-20261109]
    paths:
      - '.github/workflows/mobility-v12-manifest-integrity.yml'
      - 'production/mobility-20261108/workbook-manifest.json'
      - 'scripts/verify-mobility-workbook.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/verify-mobility-workbook.py
            /production/mobility-20261108/workbook-manifest.json
            /production/mobility-20261108/Yautja_Mobilite_Gameplay_20261108.xlsx
            /production/homeworld-sectors-20261103/YAUTJA_MARCHE_MONTURES_CHENILS_20261103.xlsx
            /docs/campagne/mobilite/catalogue/
      - name: Verify real V1.2 workbook, historical cells, formulas and Git blob
        run: python3 scripts/verify-mobility-workbook.py
      - name: Reject wrong blob and revision without touching tracked sources
        run: |
          python3 - <<'PY'
          import importlib.util,json,shutil,tempfile
          from pathlib import Path
          root=Path.cwd()
          spec=importlib.util.spec_from_file_location('mobility_verify',root/'scripts/verify-mobility-workbook.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest_path=Path('production/mobility-20261108/workbook-manifest.json')
          original=json.loads((root/manifest_path).read_text())
          assert original['previous_git_blob_sha1']=='39e8f813887f68cbf69a79786f1afab52eeaa362'
          assert original['previous_revision']=='V1.1'
          assert original['qualification_v1_2']['source_commit']=='b5ba1086ba532389d9efa74b3df0108dcf6de3e6'
          with tempfile.TemporaryDirectory() as tmp:
              destination=Path(tmp)
              paths=[manifest_path,Path(original['file']),Path(original['historical_workbook'])]
              paths += [Path('docs/campagne/mobilite/catalogue')/name for name in ('01-10.json','11-20.json','21-30.json','31-40.json','41-50.json')]
              for path in paths:
                  target=destination/path
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/path,target)
              module.ROOT=destination
              module.MANIFEST=destination/manifest_path
              module.main()
              for field,value,expected in [
                  ('git_blob_sha1','0'*40,'Delivered workbook Git blob mismatch'),
                  ('revision','V1.1','Workbook revision mismatch'),
              ]:
                  tampered={**original,field:value}
                  module.MANIFEST.write_text(json.dumps(tampered))
                  try:
                      module.main()
                  except ValueError as error:
                      assert expected in str(error),str(error)
                  else:
                      raise AssertionError('Modified '+field+' was accepted')
              print('PASS: wrong Git blob and revision both rejected; historical evidence retained')
          PY
          git diff --exit-code
          git diff --cached --exit-code
