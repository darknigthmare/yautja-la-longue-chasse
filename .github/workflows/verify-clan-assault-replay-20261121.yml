name: Verify the V115 headless assault replay
on:
  push:
    branches: [codex/verify-clan-assault-replay-20261121]
permissions:
  contents: read
jobs:
  tcp:
    name: Replay the actual assault and validate its final report
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout the candidate and its clan rules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package-lock.json
            /app/
            /lib/
            /scripts/replay-clan-war-assault-v115.mjs
            /tests/clan-war-assault-replay-v115.test.mjs
            /tests/clan-war-tactical-runtime-v115.test.mjs
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the locked esbuild dependency in the temporary workspace
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync, readFileSync, writeFileSync} from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const main = lock.packages['node_modules/esbuild'];
          const manifest = {name: 'v127-tcp-qa', version: '1.0.0', private: true,
            devDependencies: {esbuild: main.version}};
          const packages = {'': manifest, 'node_modules/esbuild': main};
          for (const name of Object.keys(main.optionalDependencies)) {
            const path = 'node_modules/' + name;
            packages[path] = lock.packages[path];
          }
          mkdirSync('.v127-tcp-qa');
          writeFileSync('.v127-tcp-qa/package.json', JSON.stringify(manifest));
          writeFileSync('.v127-tcp-qa/package-lock.json', JSON.stringify(
            {name: manifest.name, version: manifest.version, lockfileVersion: 3, packages},
          ));
          NODE
          npm ci --prefix .v127-tcp-qa --ignore-scripts --no-audit --no-fund
          ln -s .v127-tcp-qa/node_modules node_modules
      - name: Replay the assault and verify V115 tactical regressions
        run: node --test --test-reporter=spec tests/clan-war-assault-replay-v115.test.mjs tests/clan-war-tactical-runtime-v115.test.mjs
