name: Verify the L06 arena and the Queen mandate
on:
  push:
    branches: [codex/verify-elite-l06-arene-mandat-20261128]
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Verify campaign proofs, workbook and runtime asset inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: 'bee025d556d36e8a05fea5c265ce3910c9a566e3'
      BASE_COMMIT: '37a3ddf3e3376331e0798647641880e4e51dd794'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'bee025d556d36e8a05fea5c265ce3910c9a566e3'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /production/INVENTAIRE_BIBLE_20261122.*
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /public/game/xeno-prime/berceau-v1/
            /public/audio/
            /public/game/quatza-rij/
            /public/game/assets/v37/tribes/v2/homeworld-darkjungle-v2--fbc392bc9618642d.webp
            /public/game/assets/v37/tribes/v2/homeworld-forest-v2--8fdc633789dcd9c0.webp
            /public/game/assets/v37/tribes/v2/homeworld-lava-v2--ecd85e06796799d2.webp
            /public/game/backgrounds/ice-depth-v4.webp
            /public/game/backgrounds/ocean-depth-v8.png
            /public/game/backgrounds/ruins-depth-v8.png
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/homeworld/v67/ash-causeway-vista.png
            /public/game/homeworld/v67/glass-processional-vista.png
            /public/game/sprites/v8/ecology/cinder-12/basalt-ram-sheet.png
            /public/game/sprites/v8/ecology/cinder-12/smoke-wyvern-sheet.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
            /public/game/sprites/v8/ecology/nivalis-k/snow-prowler-sheet.png
            /public/game/sprites/v8/ecology/oseris-iv/amber-jaw-stalker-sheet.png
            /public/game/sprites/v8/ecology/pelagos-m/shellback-sheet.png
            /public/game/sprites/v8/ecology/serekh-9/burrow-snake-sheet.png
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/homeworld/v84/npcs/chief/16.png
            /public/game/homeworld/v84/npcs/instructor/18.png
            /public/game/dialogues/v85/bible-dialogues-index.json
            /public/game/assets/v139/rig-gauntlets/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/assets/v133/concept-masks/
            /public/game/assets/v133/decals/decal-atlas.webp
            /public/game/sprites/v62/heads/
            /public/game/assets/v134/
            /public/game/assets/v135/
            /public/game/assets/v136/
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify save compatibility and lint exact changed source
        run: |
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 tests/elite-recognition-v174.test.mjs tests/blooded-temple-v174.test.mjs tests/ship-receipt-v161.test.mjs
          npx eslint app/game/EliteClanRites.tsx app/game/ClanChroniclePanel.tsx app/game/systems/eliteClanRitesV175.ts app/game/systems/eliteRecognitionV174.ts tests/elite-recognition-v174.test.mjs scripts/qa-elite-clan-rites-v175.mjs
      - name: Compile the actual game
        run: node node_modules/next/dist/bin/next build --webpack
      - name: Play the arena, mandate, and the existing recognition routes
        run: |
          mkdir -p outputs/qa-elite-l06-v175
          node node_modules/next/dist/bin/next start --port 4396 --hostname 127.0.0.1 > outputs/qa-elite-l06-v175/server.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4396/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4396/
          ELITE_L06_QA_MODE=mandate ELITE_L06_QA_OUTPUT=outputs/qa-elite-l06-v175/mandate node scripts/qa-elite-clan-rites-v175.mjs
          ELITE_M043_QA_AUDIENCE=restricted ELITE_L06_QA_OUTPUT=outputs/qa-elite-l06-v175/restricted node scripts/qa-elite-clan-rites-v175.mjs
          ELITE_M043_QA_AUDIENCE=public ELITE_L06_QA_OUTPUT=outputs/qa-elite-l06-v175/public node scripts/qa-elite-clan-rites-v175.mjs
      - name: Upload the rites and recognition receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elite-l06-arena-mandate
          path: outputs/qa-elite-l06-v175/
          if-no-files-found: warn
