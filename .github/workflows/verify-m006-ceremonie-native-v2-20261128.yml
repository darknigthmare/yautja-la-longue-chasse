name: Qualify the native M006 score, brazier and cohort responses
on:
  push:
    branches: [codex/qa-m006-ceremonie-native-v2-20261128]
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Verify the native Homeworld training service
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '8bd376d06af18b314817f1d3bdd7617f6122dbe7'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /content/the-pit/les-masques-brises/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /production/INVENTAIRE_BIBLE_20261122.*
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /public/game/xeno-prime/berceau-v1/
            /public/game/homeworld/v72/civilian-roles-atlas.png
            /public/game/homeworld/v74/
            /public/game/homeworld/v75/
            /public/game/youth/
            /public/game/prologue/v47/
            /public/audio/
            /public/game/quatza-rij/
            /public/game/assets/v37/tribes/v2/homeworld-darkjungle-v2--fbc392bc9618642d.webp
            /public/game/assets/v37/tribes/v2/homeworld-forest-v2--8fdc633789dcd9c0.webp
            /public/game/assets/v37/tribes/v2/homeworld-lava-v2--ecd85e06796799d2.webp
            /public/game/backgrounds/ice-depth-v4.webp
            /public/game/backgrounds/ocean-depth-v8.png
            /public/game/backgrounds/ruins-depth-v8.png
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/homeworld/v67/ash-causeway-vista.png
            /public/game/homeworld/v67/glass-processional-vista.png
            /public/game/sprites/v8/ecology/cinder-12/basalt-ram-sheet.png
            /public/game/sprites/v8/ecology/cinder-12/smoke-wyvern-sheet.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
            /public/game/sprites/v8/ecology/nivalis-k/snow-prowler-sheet.png
            /public/game/sprites/v8/ecology/oseris-iv/amber-jaw-stalker-sheet.png
            /public/game/sprites/v8/ecology/pelagos-m/shellback-sheet.png
            /public/game/sprites/v8/ecology/serekh-9/burrow-snake-sheet.png
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues-index.json
            /public/game/assets/v139/rig-gauntlets/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/assets/v133/concept-masks/
            /public/game/assets/v133/decals/decal-atlas.webp
            /public/game/sprites/v62/heads/
            /public/game/assets/v134/
            /public/game/assets/v135/
            /public/game/assets/v136/
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          test "$(git rev-parse HEAD)" = '8bd376d06af18b314817f1d3bdd7617f6122dbe7'
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Linux Opus encoder
        run: |
          archive=$(npm pack @ffmpeg-installer/linux-x64@4.1.0 --pack-destination "$RUNNER_TEMP" --silent)
          mkdir "$RUNNER_TEMP/m006-ffmpeg"
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/m006-ffmpeg" package/ffmpeg
          echo "$RUNNER_TEMP/m006-ffmpeg/package" >> "$GITHUB_PATH"
      - name: Reproduce the original themes, effects and audio inventory
        run: |
          node scripts/generate-m006-rack-audio.mjs
          node scripts/generate-m006-cohort-response.mjs
          node scripts/generate-m006-ceremony-score.mjs --verify
          node scripts/build-audio-manifest.mjs
          git diff --exit-code -- public/audio/manifest.json
      - name: Verify archive compatibility and both workshop orders
        id: behavior
        run: >-
          node --experimental-strip-types --test --test-concurrency=1 --test-reporter=spec
          tests/homeworld-childhood-v175.test.mjs tests/youth-training.test.ts tests/youth-campaign.test.mjs
          tests/nursery-campaign.test.mjs tests/campaign-slots.test.mjs
          tests/audio-manifest.test.mjs tests/audio-files.test.mjs tests/sound-lifecycle.test.mjs tests/audio-pack-v54.test.mjs
          tests/origin-first-shock-o6.test.mjs tests/origin-cohort-race-o6.test.mjs tests/origins-creation-v151.test.mjs
      - name: Check types
        id: types
        run: |
          node node_modules/next/dist/bin/next typegen
          node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint the source and recipe
        run: |
          npx eslint app/game/HomeworldChildhoodV175.tsx app/game/HomeworldHub.tsx app/game/save.ts app/game/systems/homeworldChildhoodV175.ts app/game/systems/youthCampaign.ts app/game/systems/nurseryCampaign.ts app/game/systems/campaignSlots.ts tests/homeworld-childhood-v175.test.mjs tests/helpers/homeworld-childhood-v175.mjs scripts/qa-homeworld-childhood-v175.mjs
          npx eslint app/game/GameClient.tsx app/game/sound.ts scripts/generate-m006-ceremony-score.mjs scripts/generate-m006-rack-audio.mjs scripts/generate-m006-cohort-response.mjs tests/audio-manifest.test.mjs tests/audio-files.test.mjs
      - name: Play through the Homeworld handoff and open the chosen workshop
        id: browser
        if: ${{ !cancelled() && steps.behavior.outcome == 'success' && steps.types.outcome == 'success' }}
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          CHILDHOOD_VERIFY_COHORT_AUDIO: '1'
          CHILDHOOD_VERIFY_CEREMONY_AUDIO: '1'
        run: node scripts/qa-homeworld-childhood-v175.mjs
      - name: Keep the gameplay proof
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m006-braises-themes-et-import
          path: outputs/qa-homeworld-childhood-v175/
          if-no-files-found: error
