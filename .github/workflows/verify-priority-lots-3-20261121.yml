name: Verify the third P0–P3 lots
on:
  push:
    branches: [codex/verify-priority-lots-3-20261121]
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Test the residence, ice passage, duel and server recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '32b53e9bf2738bb3937affac6fc85d72d6df3439'
      BASE_COMMIT: '3d1138af7b22a2d2f02da080ef05706af3170ba7'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '32b53e9bf2738bb3937affac6fc85d72d6df3439'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /public/game/xeno-prime/berceau-v1/
            /public/audio/
            /public/game/quatza-rij/
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate canonical runtime evidence
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs candidate || { cat outputs/qa-asset-raccords-20261120/runtime-generator.log; exit 1; }
          node scripts/check-hunt-integration-source-v112.mjs --current
      - name: Verify Next types
        if: ${{ !cancelled() }}
        run: |
          node node_modules/next/dist/bin/next typegen
          node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Targeted ESLint
        if: ${{ !cancelled() }}
        run: >-
          npx eslint app/game/ResidencePanelV149.tsx app/game/HomeworldRegionV68.tsx
          app/game/systems/residenceV149.ts app/game/systems/iceExplorationRegion.ts
          app/game/ClanSupplyRouteV109.tsx app/game/systems/clanLogisticsV108.ts
          scripts/clan-war-coop-journal.mjs scripts/serve-clan-war-stealth-coop-v115.mjs
          scripts/serve-clan-war-rts-coop-v133.mjs scripts/serve-clan-war-w3-s14-duel.mjs scripts/clan-war-w3-s14-client.mjs
      - name: Verify the new routes and existing progression alongside real TCP
        if: ${{ !cancelled() }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1
          tests/clan-war-rts-coop-v133.test.mjs
          tests/clan-war-stealth-coop-v115.test.mjs
          tests/clan-war-practice-durable-v127.test.mjs
          tests/clan-war-outer-ops-server-v115.test.mjs
          tests/clan-war-w3-s14-duel.test.mjs
          tests/residence-v149.test.mjs
          tests/residence-save-v149.test.mjs
          tests/homeworld-build5-origin-residence-integration.test.mjs
          tests/homeworld-regions-v68.test.mjs
          tests/residence-life-v150.test.mjs
          tests/residence-scenes-v154.test.mjs
          tests/ice-exploration-region.test.mjs
          tests/ice-exploration-physics.test.mjs
          tests/qa-hunt-ground-policy-v112.test.mjs
          tests/hunt-field-guide-v112.test.mjs
          tests/hunt-input-runtime.test.mjs
          tests/field-stash-v112.test.mjs
      - name: Preserve the existing hunting workbook byte for byte
        if: ${{ !cancelled() }}
        run: node scripts/build-hunt-mechanics-workbook-v112.mjs --check


      - name: Report canonical inventory differences
        if: ${{ !cancelled() && hashFiles('outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const prior = JSON.parse(readFileSync('docs/qa/current-integration-20261103/runtime-inputs.json'));
          const next = JSON.parse(readFileSync('outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json'));
          const old = new Map(prior.entries.map(item => [item.path, item]));
          const paths = new Set(next.entries.map(item => item.path));
          const changes = next.entries.filter(item => JSON.stringify(old.get(item.path)) !== JSON.stringify(item));
          const removed = prior.entries.filter(item => !paths.has(item.path)).map(item => item.path);
          console.log('V113_DELTA ' + JSON.stringify({ files: next.files, bytes: next.bytes, changes, removed }));
          NODE

