name: Verify all three lots and the delivered source
on:
  push:
    branches: [codex/verify-priority-lots-3-20261121]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERIFIED_CODE: '32b53e9bf2738bb3937affac6fc85d72d6df3439'
      VERIFIED_INVENTORY: '2c36a2387110fddd7d79b3e2cc598922a3d2f327'
    steps:
      - name: Check out the delivered commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '2e233e0fed1c607035de71e53744664b7994e3d0'
          persist-credentials: false
          fetch-depth: 8
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build-priority-lots-workbook-20261121.mjs
            /scripts/lib/workbook-ooxml.mjs
            /scripts/qa-residence-move-20261121.mjs
            /docs/qa/current-integration-20261103/runtime-inputs.json
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT3_20261121.*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify the delivered code and official asset inventory
        run: |
          git diff --exit-code "$VERIFIED_CODE" HEAD -- app tests scripts ':!scripts/qa-residence-move-20261121.mjs'
          test "$(git hash-object docs/qa/current-integration-20261103/runtime-inputs.json)" = "$VERIFIED_INVENTORY"
          node --check scripts/qa-residence-move-20261121.mjs
      - name: Reproduce the workbooks and inspect the delivered Excel archive
        run: |
          node scripts/build-priority-lots-workbook-20261121.mjs --check
          node scripts/build-priority-lots-workbook-20261121.mjs --lot-2 --check
          node scripts/build-priority-lots-workbook-20261121.mjs --lot-3 --check
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          import json
          workbook = Path("production/YAUTJA_LOTS_P0_P3_LOT3_20261121")
          data = json.loads(workbook.with_suffix(".json").read_text(encoding="utf-8"))
          counts = [len(lot["entries"]) for lot in data["lots"]]
          assert counts == [10, 10, 10, 2]
          ids = [row["id"] for lot in data["lots"] for row in lot["entries"]]
          assert len(ids) == len(set(ids))
          assert "R2-M045" in ids and "R2-M041" not in ids
          assert next(row for lot in data["lots"] for row in lot["entries"] if row["id"] == "R2-M045")["status"] == "Validé"
          ns = {"x": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
          with ZipFile(workbook.with_suffix(".xlsx")) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  if name.endswith((".xml", ".rels")):
                      ET.fromstring(archive.read(name))
              root = ET.fromstring(archive.read("xl/workbook.xml"))
              assert [sheet.attrib["name"] for sheet in root.findall(".//x:sheet", ns)] == ["Synthèse", "P0", "P1", "P2", "P3"]
              for index, count in enumerate(counts, start=2):
                  sheet = ET.fromstring(archive.read(f"xl/worksheets/sheet{index}.xml"))
                  assert len(sheet.findall(".//x:sheetData/x:row", ns)) == count + 4
                  assert sheet.find("./x:autoFilter", ns).attrib["ref"] == f"A4:G{count + 4}"
          print("LOT3_XLSX_OK", counts)
          PY
