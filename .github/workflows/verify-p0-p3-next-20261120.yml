name: Verify debrief honor and Clan Ship dialogue

on:
  push:
    branches: [codex/verify-p0-p3-next-20261120]

permissions:
  contents: read

concurrency:
  group: yautja-p0-p3-next-off-ship-state
  cancel-in-progress: false

jobs:
  source:
    name: Application, tests and reproducible runtime inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '55515da65f0ece85dcfb4de7d32e8050e4a75c35'
      BASE_COMMIT: '62b3658cc04b3404a0e302163230995d47d83d66'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '55515da65f0ece85dcfb4de7d32e8050e4a75c35'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /public/game/xeno-prime/berceau-v1/
            /public/**/manifest.json
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify debrief identity, quota and dialogue recovery with real saves
        run: node --experimental-strip-types --test --test-reporter=spec tests/honor-sources-v169.test.mjs tests/clan-ship-dialogue.test.mjs tests/clan-ship-hunt-dialogue.test.mjs
      - name: Strict lint of the updated state and fixtures
        run: node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/systems/honorSourcesV169.ts app/game/systems/clanShipDialogue.ts tests/honor-sources-v169.test.mjs tests/clan-ship-dialogue.test.mjs
