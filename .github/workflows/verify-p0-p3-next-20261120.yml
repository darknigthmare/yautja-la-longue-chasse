name: Check final runtime inventory and the full audio pack

on:
  push:
    branches: [codex/verify-p0-p3-next-20261120]

permissions:
  contents: read

concurrency:
  group: yautja-p0-p3-next-pack-final
  cancel-in-progress: false

jobs:
  source:
    name: Application, tests and reproducible runtime inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '207ac23418dea1c09e039cf9c0934b34f793d6ea'
      BASE_COMMIT: '62b3658cc04b3404a0e302163230995d47d83d66'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '207ac23418dea1c09e039cf9c0934b34f793d6ea'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /public/game/xeno-prime/berceau-v1/
            /public/audio/
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate the official candidate inventory
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs candidate
          node scripts/snapshot-runtime-v113.mjs --check outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json
          node scripts/check-hunt-integration-source-v112.mjs --current
      - name: Verify all original legacy WAVs and the scored Cradle inventory
        run: node --experimental-strip-types --test --test-reporter=spec tests/audio-pack-v54.test.mjs tests/audio-files.test.mjs tests/audio-manifest.test.mjs
