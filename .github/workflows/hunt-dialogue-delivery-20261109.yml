name: Deliver reviewed hunt conversations 20261109
on:
  push:
    branches: [feat/quetes-vivantes-bible-20261109]
    paths: [.github/workflows/hunt-dialogue-delivery-20261109.yml]
permissions:
  contents: write
concurrency:
  group: hunt-dialogue-delivery-20261109
  cancel-in-progress: false
jobs:
  delivery:
    if: github.ref == 'refs/heads/feat/quetes-vivantes-bible-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
      - name: Check exact source bytes and materialize nine reviewed native paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunt-dialogue-receipts"
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'hunt-dialogue-receipts'
          ids=['48684cedbfbe7589635b4c585ee2d32aa1ea3a1b','d4f5532303847ca659e2f5eb722b31d876735c8f','f0a3bb02fefebc8dc40c2b2b86cdc3e43cab9f71']
          parts=[]
          for sha in ids:
            req=urllib.request.Request('https://api.github.com/repos/darknigthmare/yautja-la-longue-chasse/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=60) as response:data=json.load(response)
            raw=base64.b64decode(data['content']);assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
            parts.append(raw)
          packed=base64.b64decode(b''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='fee090065ec5442f7557e004b88e2535c56c2a0e2de2e9662484318dd314fcf5'
          data=json.loads(lzma.decompress(packed));assert data['baseline']=='9dce866a2f9972800e6adfca3e312d38c6aa8540'
          allowed={'app/game/ClanShipHuntConversation.tsx','app/game/systems/clanShipHuntDialogue.ts','tests/helpers/clan-ship-hunt-dialogue-fixture.mjs','tests/clan-ship-hunt-dialogue.test.mjs','tests/fixtures/companion-recruitment-mechanics-19317af4.json','scripts/qa-clan-hunt-dialogue-browser-20261109.mjs','docs/campagne/QUETES_RETOURS_ET_ACCORDS_20261109.md','app/game/ClanShipCrewDialogue.tsx','app/game/systems/companionResidence.ts'}
          assert set(data['files'])==allowed
          for name,item in data['files'].items():
            p=root/name;assert all(not q.is_symlink() for q in [p,*p.parents])
            old=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
            assert old==item['before'],name+' changed since review; refusing to overwrite'
          for name,item in data['files'].items():
            if 'patch' in item:
              assert name=='app/game/systems/companionResidence.ts'
              patch=out/'companion-prose.patch';patch.write_text(item['patch'])
              subprocess.run(['git','apply','--check',str(patch)],check=True);subprocess.run(['git','apply',str(patch)],check=True)
            else:
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(item['content'])
            assert hashlib.sha256((root/name).read_bytes()).hexdigest()==item['sha256'],name
          (out/'source-files.json').write_text(json.dumps({k:{'before':v['before'],'sha256':v['sha256']} for k,v in data['files'].items()},indent=2)+'\n')
          (out/'paths.txt').write_text('\n'.join(sorted(allowed))+'\n')
          print('Nine exact native source paths restored; original mechanics, saves and art preserved.')
          PY
      - name: Materialize unchanged original assets for the official inventory and recipes
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path.cwd()
          files={x['path'] for x in json.loads((root/'docs/qa/current-integration-20261103/runtime-inputs.json').read_text())['entries']}
          files.update(json.loads((root/'tests/fixtures/clan-ship-browser-assets.json').read_text())['paths'])
          files.update('public'+x['src'] for x in json.loads((root/'app/game/data/buriedCradleArt.json').read_text())['assets'].values())
          files.update(['public/game/prologue/v47/village.png','public/game/prologue/v47/arena.png','public/game/ships/v14/avp-predator-mothership.webp','public/game/ships/v12/classic-predator-spaceship.webp','public/game/ships/v13/classic-predator-spaceship-top.webp','public/game/backgrounds/ship-hub-v4.webp'])
          for name in files:
            p=pathlib.PurePosixPath(name);assert not p.is_absolute() and '..' not in p.parts
          subprocess.run(['git','sparse-checkout','add','--stdin'],input='\n'.join('/'+p for p in sorted(files))+'\n',text=True,check=True)
          assert all((root/p).is_file() for p in files)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official current inventory, full TypeScript and strict lint
        run: |
          set -euo pipefail
          node scripts/snapshot-runtime-v113.mjs --write docs/qa/current-integration-20261103/runtime-inputs.json 2>&1 | tee "$RUNNER_TEMP/hunt-dialogue-receipts/runtime-write.txt"
          node scripts/snapshot-runtime-v113.mjs --check docs/qa/current-integration-20261103/runtime-inputs.json 2>&1 | tee "$RUNNER_TEMP/hunt-dialogue-receipts/runtime-check.txt"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/hunt-dialogue-receipts/typecheck.txt"
          node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/ClanShipHuntConversation.tsx app/game/ClanShipCrewDialogue.tsx app/game/systems/clanShipHuntDialogue.ts app/game/systems/companionResidence.ts tests/helpers/clan-ship-hunt-dialogue-fixture.mjs tests/clan-ship-hunt-dialogue.test.mjs scripts/qa-clan-hunt-dialogue-browser-20261109.mjs 2>&1 | tee "$RUNNER_TEMP/hunt-dialogue-receipts/lint.txt"
      - name: Existing and new regressions with original Cradle assets
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-reporter=tap --test-concurrency=1 tests/clan-ship-hunt-dialogue.test.mjs tests/clan-ship-dialogue.test.mjs tests/clan-ship-operations.test.mjs tests/clan-ship-operations-save.test.mjs tests/clan-ship-space-encounter.test.mjs tests/clan-ship-incidents.test.mjs tests/clan-ship-trophy-case.test.mjs tests/clan-ship-trophy-hearing.test.mjs tests/clan-ship-trophy-hearing-presentation.test.mjs tests/buried-cradle-return.test.mjs tests/buried-cradle-campaign.test.mjs tests/buried-cradle-snapshot.test.mjs tests/companion-residence.test.mjs 2>&1 | tee "$RUNNER_TEMP/hunt-dialogue-receipts/tests.txt"
      - name: Commit only reviewed native files and current inventory to the isolated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/quetes-vivantes-bible-20261109
          test "$(git ls-remote origin refs/heads/feat/quetes-vivantes-bible-20261109 | cut -f1)" = "$GITHUB_SHA"
          git diff --check
          mapfile -t paths < "$RUNNER_TEMP/hunt-dialogue-receipts/paths.txt"
          git add -- "${paths[@]}" docs/qa/current-integration-20261103/runtime-inputs.json
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: quatre chasses racontees, confidentialite du Berceau et accords incarnes'
          git push origin HEAD:refs/heads/feat/quetes-vivantes-bible-20261109
          git rev-parse HEAD | tee "$RUNNER_TEMP/hunt-dialogue-receipts/published-head.txt"
          cp docs/qa/current-integration-20261103/runtime-inputs.json "$RUNNER_TEMP/hunt-dialogue-receipts/runtime-inputs.json"
      - name: Install locked Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Native archived hunts, private returns and reload
        run: |
          set -euo pipefail
          node scripts/qa-clan-hunt-dialogue-browser-20261109.mjs 2>&1 | tee "$RUNNER_TEMP/hunt-dialogue-receipts/browser-run.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-dialogue-native-20261109
          path: |
            ${{ runner.temp }}/hunt-dialogue-receipts/
            outputs/qa-clan-hunt-dialogue-20261109/
          retention-days: 14
          if-no-files-found: error
