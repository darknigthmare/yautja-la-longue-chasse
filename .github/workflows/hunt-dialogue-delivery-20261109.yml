name: Deliver reviewed follow-up workbook 20261109
on:
  push:
    branches: [feat/quetes-vivantes-bible-20261109]
    paths: [.github/workflows/hunt-dialogue-delivery-20261109.yml]
permissions:
  contents: write
concurrency:
  group: hunt-dialogue-delivery-20261109
  cancel-in-progress: false
jobs:
  workbook:
    if: github.ref == 'refs/heads/feat/quetes-vivantes-bible-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
      - name: Reconstruct exact artifact_tool package members and verify workbook bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,json,lzma,os,pathlib,re,urllib.request,zipfile,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          ids=['b6fa3e23c65530b150b242f1458dc837a094ece1','2ca530aa254d4ea7fd9ac8fef2f47f5fb8e7f270']
          def gitsha(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          parts=[]
          for index,sha in enumerate(ids):
            req=urllib.request.Request('https://api.github.com/repos/darknigthmare/yautja-la-longue-chasse/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=60) as response:data=json.load(response)
            raw=base64.b64decode(data['content']);assert gitsha(raw)==sha
            if index==0:
              # Repair the one known duplicated transport character, not workbook data.
              assert raw.count(b'R0lsgxII7k7sNd')==1
              raw=raw.replace(b'R0lsgxII7k7sNd',b'R0lsgxI7k7sNd',1)
              assert len(raw)==12000 and gitsha(raw)=='fe52e66822f4caa8809ae180c55c5d72e0bd9af2'
            parts.append(raw)
          packed=base64.b64decode(b''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='4b89e949101a8d33a5c5efd8aa754e15dd7d7d531f288874c545d7a97c242d3c'
          payload=json.loads(lzma.decompress(packed))
          original='production/quetes-vivantes-20261109/Yautja_Quetes_Vivantes_Bible_20261109.xlsx'
          target='production/quetes-vivantes-suite-20261109/Yautja_Quetes_Vivantes_Suite_20261109.xlsx'
          receipt='production/quetes-vivantes-suite-20261109/verification-classeur.json'
          assert payload['original']==original and payload['target']==target
          old=(root/original).read_bytes()
          assert hashlib.sha256(old).hexdigest()==payload['originalSha256']=='5344019af67069a48268ae866498b4552fdad83ae996cbe002868cfefde2931c'
          for name in [target,receipt]:
            p=root/name;assert not p.exists() and all(not q.is_symlink() for q in [p,*p.parents]),name
          with zipfile.ZipFile(io.BytesIO(old)) as z:members={p:z.read(p) for p in z.namelist()}
          delta=payload['delta'];assert len(set(delta['paths']))==len(delta['paths'])
          assert set(delta['members']).issubset(delta['paths'])
          result={}
          for name in delta['paths']:
            path=pathlib.PurePosixPath(name);assert not path.is_absolute() and '..' not in path.parts
            item=delta['members'].get(name)
            if item is None:raw=members[name]
            elif 'new' in item:raw=item['new'].encode('utf-8')
            else:
              before=members[name];assert hashlib.sha256(before).hexdigest()==item['oldSha256']
              tokens=re.findall(r'<[^>]+>|[^<]+',before.decode('utf-8'));assert ''.join(tokens).encode()==before
              chunks=[]
              for op in item['copy']:
                if isinstance(op,list):
                  assert len(op)==2 and all(type(i) is int for i in op) and 0<=op[0]<=op[1]<=len(tokens)
                  chunks.append(''.join(tokens[op[0]:op[1]]))
                else:assert isinstance(op,str);chunks.append(op)
              raw=''.join(chunks).encode('utf-8')
            if item:assert hashlib.sha256(raw).hexdigest()==item['sha256']
            result[name]=raw
          output=io.BytesIO()
          with zipfile.ZipFile(output,'w') as z:
            for name,raw in sorted(result.items()):
              info=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.create_system=3;info.external_attr=0o600<<16
              z.writestr(info,raw)
          raw=output.getvalue();digest=hashlib.sha256(raw).hexdigest()
          assert digest==payload['targetSha256']=='39c2e6488d6b3362a3d575b0ff07afdb9b6bb2dfb38def857c5a2789143a34c4'
          assert len(raw)==payload['targetBytes']==498931
          meta=payload['receipt'];assert meta['sha256']==digest and meta['bytes']==len(raw)
          ns={'s':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            assert z.testzip() is None
            assert [s.attrib['name'] for s in ET.fromstring(z.read('xl/workbook.xml')).findall('s:sheets/s:sheet',ns)]==meta['sheets']
            assert len(meta['sheets'])==12
            formulas=0
            for name in z.namelist():
              if name.startswith('xl/worksheets/') and name.endswith('.xml'):
                xml=ET.fromstring(z.read(name));assert not xml.findall('.//s:c[@t="e"]',ns)
                for c in xml.findall('.//s:c',ns):
                  if c.find('s:f',ns) is not None:formulas+=1;assert c.find('s:v',ns) is not None
            assert formulas==meta['formulas']==5
          (root/target).parent.mkdir(parents=True,exist_ok=True);(root/target).write_bytes(raw)
          (root/receipt).write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          assert (root/original).read_bytes()==old
          print(json.dumps({'file':target,'bytes':len(raw),'sha256':digest,'gitBlob':gitsha(raw),'sheets':12,'formulas':5,'originalPreserved':True}))
          PY
      - name: Commit only the new workbook and receipt, without changing main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/quetes-vivantes-bible-20261109
          test "$(git ls-remote origin refs/heads/feat/quetes-vivantes-bible-20261109 | cut -f1)" = "$GITHUB_SHA"
          git add -- production/quetes-vivantes-suite-20261109/Yautja_Quetes_Vivantes_Suite_20261109.xlsx production/quetes-vivantes-suite-20261109/verification-classeur.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: douze feuilles pour les retours de chasse, accords et preuves natives'
          git push origin HEAD:refs/heads/feat/quetes-vivantes-bible-20261109
          git rev-parse HEAD
