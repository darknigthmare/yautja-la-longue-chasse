name: Verify Enforcers provenance candidates
on:
  push:
    branches: [codex/verify-enforcers-provenance-20261121]
permissions:
  contents: read
jobs:
  provenance:
    name: Real Git tree, historical receipts and read-only ZIP scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '60001d6692b38abd7893a247716ef76536575a53'
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/audit-enforcer-historical-recovery.mjs
            /scripts/inspect-enforcer-recovery-zip.py
            /tests/enforcer-historical-git-recovery.test.mjs
            /tests/test_enforcer_recovery_zip.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test --test-reporter=spec tests/enforcer-historical-git-recovery.test.mjs
      - run: python3 -B tests/test_enforcer_recovery_zip.py
