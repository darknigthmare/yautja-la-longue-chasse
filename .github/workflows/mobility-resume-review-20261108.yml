name: Mobility interrupted transfer review
on:
  push:
    branches: [feat/mobility-garage-gameplay-20261108]
    paths: [.github/workflows/mobility-resume-review-20261108.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: production/mobility-20261108/transfer
      - name: Decode bounded transferred data without executing source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          paths=[Path(f'production/mobility-20261108/transfer/source.{i:02d}.b64') for i in range(1,5)]
          text=''.join(p.read_text().strip() for p in paths)
          assert len(text)<200000
          packed=base64.b64decode(text,validate=True)
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(packed,max_length=10*1024*1024)
          assert decoder.eof and not decoder.unused_data
          Path('mobility-recovered-source.dat').write_bytes(raw)
          Path('mobility-recovered-source.xz').write_bytes(packed)
          print('Packed SHA256:',hashlib.sha256(packed).hexdigest())
          print('Decoded bytes:',len(raw),'SHA256:',hashlib.sha256(raw).hexdigest())
          print('Header:',repr(raw[:120]))
          try:
            data=json.loads(raw)
            print('JSON type:',type(data).__name__)
            print('Top-level keys:',list(data)[:20])
          except (ValueError,UnicodeDecodeError): pass
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-recovered-source
          path: mobility-recovered-source.*
          retention-days: 3
