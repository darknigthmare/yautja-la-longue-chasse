name: REM112 repli Glace compteurs issus de victoires
on:
  push:
    branches: [codex/qa-rem112-repli-ice-retry-lot4]
permissions:
  contents: read
  actions: read
jobs:
  ice:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /scripts/
            /public/**/manifest.json
            /docs/qa/v112-ground-campaign/campaign-origin-save.json
            /docs/qa/v112-ground-campaign/tool-origin.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rem112-lot4-ice-scout-repli
          run-id: 44942587435
          github-token: ${{ github.token }}
          path: outputs/admission
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          root=outputs/repli-ice
          mkdir -p "$root"
          seed="$(find outputs/admission -path '*/earned-9/after-win.json' -print -quit)"
          test -f "$seed"
          cp "$seed" "$root/attempt-10-origin.json"
          origin="$root/attempt-10-origin.json"
          full=0
          for attempt in 10 11 12; do
            for trial in early270 early360 early460 early720; do
              distance=${trial//[!0-9]/}
              output="$root/$attempt-$trial"
              if node scripts/qa-hunt-ground-campaign-v112.mjs --mission=ice-cryostalker --armor=scout \
                --baseSave="$origin" --insertion=visible-ship --harvest=true --harvestSweep=true --sweepEarly=true \
                "--sweepDistance=$distance" --minimumRetainedLoad=1 --replay=true --seconds=360 --output="$output" > "$output.log" 2>&1
              then full=1
              fi
              if [ -f "$output/report.json" ]; then
                node -e 'const r=require("./"+process.argv[1]);for(const o of r.outcomes)console.log(JSON.stringify({trial:process.argv[2],source:r.commit,mission:o.missionId,armor:o.armorId,attempt:o.admission.encounterRun,success:o.success,boarding:o.retainedLoad.atBoarding?.load,extraction:o.retainedLoad.atExtraction?.load,qualified:o.retainedLoad.qualified,ids:o.retainedLoad.atExtraction?.specimenIds,replayed:o.replay?.verified}));' "$output/report.json" "$trial"
              else
                tail -30 "$output.log"
              fi
              if [ "$full" -eq 1 ]; then break; fi
            done
            if [ "$full" -eq 1 ] || [ "$attempt" -eq 12 ]; then break; fi
            output="$root/earned-$attempt"
            if ! node scripts/qa-hunt-ground-campaign-v112.mjs --mission=ice-cryostalker --armor=berserker \
              --difficulty=young-blood --baseSave="$origin" --replay=true --requireComplete=true --seconds=300 \
              --output="$output" --successSave="$output/after-win.json" > "$output.log" 2>&1
            then tail -30 "$output.log"; break; fi
            origin="$output/after-win.json"
          done
          test "$full" -eq 1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rem112-lot4-ice-targeted-repli
          path: outputs/repli-ice/
