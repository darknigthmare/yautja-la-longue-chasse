name: Verify Apex audio decoy
on:
  push:
    branches: [codex/apex-audio-decoy-20261127]
permissions:
  contents: read
jobs:
  source:
    name: Replay the decoy rules and typecheck the hunt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout the exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 69498bd54f3fbcb7963bb6bcdd2674873d1b8091
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues-index.json
            /public/audio/
      - name: Read exact branch correction
        run: test "$(git rev-parse HEAD)" = '69498bd54f3fbcb7963bb6bcdd2674873d1b8091'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the native hunt and the tests
        run: npx eslint app/game/systems/huntSystems.ts app/game/HuntCanvas.tsx tests/hunt-systems.test.mjs
      - name: Run encounter, regular perception and input regression suites
        run: node --experimental-strip-types --test tests/hunt-systems.test.mjs tests/hunt-level-coherence-v157.test.mjs tests/hunt-input-runtime.test.mjs tests/active-hunt-save.test.mjs
      - name: Typecheck
        run: npm run typecheck
