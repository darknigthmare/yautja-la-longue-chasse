name: Qualify the current P0 and P1 slice

on:
  push:
    branches: [codex/verify-p0p1-20261120]

permissions:
  contents: read

concurrency:
  group: yautja-p0p1-candidate-20261120
  cancel-in-progress: false

jobs:
  source:
    name: Application, tests and reproducible runtime inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '983bfaf640b3e47ef3880c11a14ceadc01ed8e61'
      BASE_COMMIT: '5c44bf24506c71792f9dffa49761be6a87879bd6'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '983bfaf640b3e47ef3880c11a14ceadc01ed8e61'
          persist-credentials: false
          fetch-depth: 3
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /public/**/manifest.json
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate the official candidate inventory
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs candidate
          node scripts/snapshot-runtime-v113.mjs --check outputs/qa-asset-raccords-20261120/runtime-inputs.candidate.json
          node scripts/check-hunt-integration-source-v112.mjs --current
      - name: Verify Next types
        run: |
          node node_modules/next/dist/bin/next typegen
          node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Exercise the changed and adjacent contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_COMMIT"
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "$BASE_COMMIT" HEAD -- 'tests/*.test.mjs' 'tests/*.test.ts')
          mapfile -t suites < <(printf '%s\n' "${changed[@]}" \
            tests/scene-audio.test.mjs \
            tests/warp-module-bay.test.mjs \
            tests/warp-epochs-v165.test.mjs \
            tests/tantalus-warp-v167.test.mjs \
            tests/clan-logistics-v108.test.mjs \
            tests/ship-receipt-v161.test.mjs \
            tests/homeworld-contracts-v68-integration.test.mjs \
            tests/residence-life-v150.test.mjs \
            tests/mobility-training-reward.test.mjs \
            tests/pit-backward-throws-v112.test.mjs \
            tests/pit-forward-throws-v109.test.mjs | sort -u)
          git diff --check "$BASE_COMMIT" HEAD
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1 "${suites[@]}"
      - name: Strict lint of modified source and QA drivers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mapfile -t edited < <(git diff --name-only --diff-filter=AM "$BASE_COMMIT" HEAD -- 'app/**/*.ts' 'app/**/*.tsx' 'scripts/*.mjs' 'tests/*.test.mjs')
          test "${#edited[@]}" -gt 0
          node node_modules/eslint/bin/eslint.js --max-warnings=0 "${edited[@]}"
      - name: Preserve inventory and materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-candidate-983bfaf640b3e47ef3880c11a14ceadc01ed8e61
          path: outputs/qa-asset-raccords-20261120/
          if-no-files-found: error

  browser:
    name: Production Next browser recipes and captures
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: '983bfaf640b3e47ef3880c11a14ceadc01ed8e61'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      AUDIT_CHROME_CHANNEL: chrome
      PHG_QA_URL: http://127.0.0.1:3121
      WARP_QA_URL: http://127.0.0.1:3121
      WARP_QA_OUTPUT: outputs/p0p1-native/warp
      YAUTJA_QA_BASE_URL: http://127.0.0.1:3121
      YAUTJA_LOGISTICS_V108_QA_MODE: compiled-app
      YAUTJA_LOGISTICS_V108_QA_SCENARIO: storage-recovery
      YAUTJA_QA_RUNTIME_COMMIT: '983bfaf640b3e47ef3880c11a14ceadc01ed8e61'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '983bfaf640b3e47ef3880c11a14ceadc01ed8e61'
          persist-credentials: false
          fetch-depth: 3
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /public/**/manifest.json
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize source assets actually used by the scenes
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs catalogue
          ASSET_RACCORDS_PREPARE_ONLY=1 node scripts/qa-asset-raccords-browser-20261120.mjs
      - name: Build and start the production application
        id: server
        run: |
          mkdir -p outputs/p0p1-native
          npm run build:production
          npm run start:production -- --hostname 127.0.0.1 --port 3121 > outputs/p0p1-native/next-server.log 2>&1 &
          for attempt in {1..70}; do
            if curl --fail --silent http://127.0.0.1:3121/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3121/ > /dev/null
          printf 'YAUTJA_QA_BUILD_ID=%s\n' "$(cat .next/BUILD_ID)" >> "$GITHUB_ENV"
      - name: PHG decals and wardrobe palette in Homeworld
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/qa-phg-decal-parity.mjs
      - name: Warp pilot with the archived bay art placed in the current scene
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/qa-warp-module-p0p1-20261109.mjs
      - name: Physical clan logistics and conflicting tabs
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/qa-clan-logistics-v108.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-recipes-983bfaf640b3e47ef3880c11a14ceadc01ed8e61
          path: |
            outputs/p0p1-native/
            outputs/phg-decal-parity/
            outputs/qa-v108/
            outputs/qa-logistics-v108/
            outputs/clan-logistics-v108/
          if-no-files-found: error
