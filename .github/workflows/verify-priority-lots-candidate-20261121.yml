name: Verify browser Volcano with durable resume
on:
  push:
    branches: [codex/verify-volcano-browser-entry-20261121]
permissions:
  contents: read
jobs:
  volcano:
    name: Play and resume the Volcano contract from the documented Glacier save
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /scripts/
            /tests/
            /docs/qa/v112-ground-campaign/campaign-origin-save.json
            /docs/qa/v112-ground-campaign/tool-origin.json
            /docs/qa/v112-campaign-canonical/browser-workshop/browser-report.json
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Play the real client with explicit success and resume gates
        run: node scripts/qa-hunt-campaign-browser-v112.mjs --campaign-source docs/qa/v112-campaign-canonical/browser-workshop/browser-report.json --missions volcano-bad-blood --wall-seconds 600 --chromium /usr/bin/google-chrome --require-complete --require-resume --output outputs/qa-rem112-volcano-browser
      - name: Preserve the Volcano contract result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rem112-volcano-browser
          path: outputs/qa-rem112-volcano-browser/
          if-no-files-found: warn
