name: Verify the first P0–P3 lots
on:
  push:
    branches: [codex/verify-priority-lots-candidate-20261121]
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Test mastery, the server duel, headless replay and the preserved workbook
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      ASSET_RACCORDS_SOURCE_COMMIT: 'f9a0b2083d2492e684c91485b6f30d6b70be7c4d'
      BASE_COMMIT: '09dbd50474fe77e3f055a919dcfc09c66bab69f1'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'f9a0b2083d2492e684c91485b6f30d6b70be7c4d'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /public/game/xeno-prime/berceau-v1/
            /public/audio/
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate canonical runtime evidence
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs candidate
          node scripts/check-hunt-integration-source-v112.mjs --current
      - name: Verify Next types
        run: |
          node node_modules/next/dist/bin/next typegen
          node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Verify the new routes and existing progression alongside real TCP
        if: ${{ !cancelled() }}
        run: >-
          node --experimental-strip-types --test --test-reporter=spec --test-concurrency=1
          tests/elite-mastery-v170.test.mjs tests/elder-assembly-v168.test.mjs tests/nursery-campaign.test.mjs
          tests/clan-war-practice-server-v127.test.mjs tests/clan-war-assault-replay-v115.test.mjs
          tests/clan-war-tactical-runtime-v115.test.mjs tests/qa-hunt-ground-policy-v112.test.mjs
      - name: Preserve the existing hunting workbook byte for byte
        if: ${{ !cancelled() }}
        run: node scripts/build-hunt-mechanics-workbook-v112.mjs --check

