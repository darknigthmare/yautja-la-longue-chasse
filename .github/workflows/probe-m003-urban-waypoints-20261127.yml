name: Probe the native M003 approach and square
on:
  push:
    branches: [codex/verify-m003-urban-waypoints-20261127]
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Measure reachable workshop and market paths
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout the exact candidate and bounded inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '6b948ab218941614adf35fe046fa4a6e3b49bc4d'
          persist-credentials: false
          fetch-depth: 12
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /tests/
            /scripts/
            /build/
            /.openai/
            /.github/workflows/
            /docs/
            /production/INVENTAIRE_BIBLE_20261122.*
            /production/YAUTJA_LOTS_P0_P3_20261121.*
            /production/YAUTJA_LOTS_P0_P3_LOT2_20261121.*
            /public/game/xeno-prime/berceau-v1/
            /public/game/homeworld/v74/
            /public/game/homeworld/v75/
            /public/game/youth/
            /public/audio/
            /public/game/quatza-rij/
            /public/game/assets/v37/tribes/v2/homeworld-darkjungle-v2--fbc392bc9618642d.webp
            /public/game/assets/v37/tribes/v2/homeworld-forest-v2--8fdc633789dcd9c0.webp
            /public/game/assets/v37/tribes/v2/homeworld-lava-v2--ecd85e06796799d2.webp
            /public/game/backgrounds/ice-depth-v4.webp
            /public/game/backgrounds/ocean-depth-v8.png
            /public/game/backgrounds/ruins-depth-v8.png
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/homeworld/v67/ash-causeway-vista.png
            /public/game/homeworld/v67/glass-processional-vista.png
            /public/game/sprites/v8/ecology/cinder-12/basalt-ram-sheet.png
            /public/game/sprites/v8/ecology/cinder-12/smoke-wyvern-sheet.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
            /public/game/sprites/v8/ecology/nivalis-k/snow-prowler-sheet.png
            /public/game/sprites/v8/ecology/oseris-iv/amber-jaw-stalker-sheet.png
            /public/game/sprites/v8/ecology/pelagos-m/shellback-sheet.png
            /public/game/sprites/v8/ecology/serekh-9/burrow-snake-sheet.png
            /public/game/assets/clan-field-20261103/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues-index.json
            /public/game/assets/v139/rig-gauntlets/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/assets/v133/concept-masks/
            /public/game/assets/v133/decals/decal-atlas.webp
            /public/game/sprites/v62/heads/
            /public/game/assets/v134/
            /public/game/assets/v135/
            /public/game/assets/v136/
            /public/game/p0-sprites-20261113/warp/
            /public/game/warp-universe/20261109-p1/193_japon_cloche_bonsho.png
            /public/game/homeworld/v77/lava-transit-skiff.png
            /public/game/homeworld/v77/fauna/yautja-horse-corrected.png
            /public/game/homeworld/v64/clan-shuttle.png
            /public/game/assets/v3/actors/yautja/hunter/armor/registered/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize official runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure street geometry with the real navigation engine
        run: |
          node --input-type=module <<'M003_GEOMETRY'
          import {qaChildhood} from './tests/helpers/homeworld-childhood-v175.mjs';
          const hub=qaChildhood.load('app/game/systems/homeworldWorldV77.ts');
          const nav=qaChildhood.load('app/game/systems/homeworldNavigationV109.ts');
          const civic=qaChildhood.load('app/game/systems/homeworldCivicWorldV80.ts');
          const geo=qaChildhood.load('app/game/systems/homeworldGeometryV64.ts');
          const start=hub.HOMEWORLD_COUNCIL_STAIR_LANDINGS_V77.from.point;
          const door=id=>geo.homeworldBuildingDoorwayV64(hub.HOMEWORLD_BUILDINGS_V77.find(b=>b.id===id)).approach;
          const forge=door('deep-forge'), market=door('market-canopy');
          const named={start,forge,market,armory:door('market-armory'),landing:{x:3980,y:2800}};
          const pack=path=>path.status==='reachable'?{status:path.status,length:Math.round(path.points.slice(1).reduce((d,p,i)=>d+Math.hypot(p.x-path.points[i].x,p.y-path.points[i].y),0)),points:path.points}:path;
          console.log('GEOMETRY',JSON.stringify({named, districts:hub.HOMEWORLD_DISTRICTS_V77.filter(d=>['market','forges'].includes(d.id))}));
          for(const [label,origin,target] of [['Council to forge',start,forge],['Forge to market',forge,market],['forge to market armory',forge,named.armory],['Council to market',start,market]]){
           console.log('LEG',label,JSON.stringify(pack(nav.homeworldWalkRouteV109('0',origin,target))));
          }
          for(const offset of [96,144,192,240,288,360,420]){
           const candidates=[[market.x,market.y+offset],[market.x+offset,market.y],[market.x-offset,market.y],[forge.x,forge.y+offset],[forge.x-offset,forge.y]];
           console.log('OFFSETS',offset,JSON.stringify(candidates.map(([x,y])=>({x,y,walkable:civic.homeworldCivicWalkableV80('0',{x,y})}))));
          }
          M003_GEOMETRY
