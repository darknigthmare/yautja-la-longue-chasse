name: V148 Stale Clan Operations Reset — Real Two-Tab Browser QA
on:
  push:
    branches:
      - feat/v131-gauntlet-hologram-dual-view-20261030
    paths:
      - 'app/game/ClanWarOperationsV115.tsx'
      - 'app/game/systems/clanWarOperationsV115.ts'
      - 'scripts/qa-clan-war-v115-multitab-v148.mjs'
      - 'tests/clan-war-v115-multitab-v148.test.mjs'
      - 'tests/browser/clan-war-v147-four-modes.fixture.tsx'
      - '.github/workflows/clan-war-v148-multitab-ops.yml'
      - 'docs/Yautja_ClanWar_V148_Securite_Multionglets.xlsx'
  pull_request:
    branches:
      - feat/v131-gauntlet-hologram-dual-view-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ops-two-tabs:
    name: Two real V115 panels, stale destructive reset blocked, safe reload
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Sparse checkout actual V115/V6 components, tests and workbook
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /app/
            /types/
            /lib/
            /scripts/qa-clan-war-v115-multitab-v148.mjs
            /scripts/qa-clan-war-four-modes-v147.mjs
            /tests/clan-war-v115-multitab-v148.test.mjs
            /tests/browser/clan-war-v147-four-modes.fixture.tsx
            /tests/clan-war-four-modes-v147.test.mjs
            /docs/Yautja_ClanWar_V148_Securite_Multionglets.xlsx
            /docs/Yautja_ClanWar_V149_Verrou_Local.xlsx
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: V148 source and backwards compatibility regressions
        run: node --experimental-strip-types --test --test-reporter=spec tests/clan-war-v115-multitab-v148.test.mjs tests/clan-war-four-modes-v147.test.mjs
      - name: Real Chrome two-tab stale destructive reset and safe reload
        run: node scripts/qa-clan-war-v115-multitab-v148.mjs
      - name: Check V148 Excel annex
        run: |
          unzip -t docs/Yautja_ClanWar_V148_Securite_Multionglets.xlsx | tail -1
          python3 -c "import zipfile; z=zipfile.ZipFile('docs/Yautja_ClanWar_V148_Securite_Multionglets.xlsx'); assert sum(x.startswith('xl/worksheets/sheet') and x.endswith('.xml') for x in z.namelist()) == 5"
      - name: Check V149 workbook annex
        run: |
          unzip -t docs/Yautja_ClanWar_V149_Verrou_Local.xlsx | tail -1
          python3 -c "import zipfile; z=zipfile.ZipFile('docs/Yautja_ClanWar_V149_Verrou_Local.xlsx'); assert sum(x.startswith('xl/worksheets/sheet') and x.endswith('.xml') for x in z.namelist()) == 6"
      - name: Preserve browser evidence of two real V115 panels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yautja-v148-real-V115-two-tab-stale-reset-evidence
          path: outputs/clan-war-v115-multitab-v148/
          retention-days: 30
          if-no-files-found: warn
