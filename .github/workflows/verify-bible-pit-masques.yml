name: PIT riposte, precision and the Masques Brisés prologue
on:
  push:
    branches: ['codex/verify-bible-pit-precision-20261127']
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.openai/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /build/
            /script*/
            /tests/
            /docs/the-pit/
            /public/game/review/the-pit/greyback-unmasked-20261127/
            /art-source/the-pit/continuation-20261127/greyback-unmasked/
            /content/the-pit/
            /public/game/review/the-pit/les-masques-brises-v1/
            /art-source/the-pit/les-masques-brises-v1/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues-index.json
      - &node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test claims, the original images, combat receipts and save compatibility
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          tests/pit-content-access-v1.test.mjs tests/pit-selection-presentation-v1.test.mjs
          tests/pitSelectionFlow.test.ts tests/pit-save.test.mjs tests/pitHonors.test.ts
          tests/pit-honor-gallery-v1.test.mjs tests/pit-honor-route-game-client.test.mjs
          tests/pit-bonus-trial-v1.test.mjs tests/pit-masks-broken-prologue.test.mjs tests/pit-precision-trial-v1.test.mjs
      - name: Typecheck the live game
        run: npm run typecheck
      - name: Lint the Pit and masked prologue code
        run: >-
          node node_modules/eslint/bin/eslint.js --max-warnings=0
          app/game/PitCanvas.tsx app/game/PitExperienceV79.tsx app/game/PitMasksBrokenPrologue.tsx
          app/game/PitBonusTrialPanelV1.tsx app/game/PitHonorsPanel.tsx app/game/PitHonorDetail.tsx
          app/game/systems/pitMasksBrokenPrologue.ts app/game/systems/pitBonusTrialV1.ts
          app/game/systems/pitPrecisionTrialV1.ts app/game/systems/pitPrecisionRecordsV1.ts app/game/systems/pitBonusSessionV2.ts
          tests/pit-masks-broken-prologue.test.mjs app/pit-lab/expansion app/pit-lab/selection
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PIT_QA_MATERIALIZE_ASSETS: '1'
      PIT_QA_OUTPUT: outputs/qa-bible-pit-masques
    steps:
      - *checkout
      - name: Print the previous browser error observed before first selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          run-id: '46021493028'
          name: pit-masques-brises-browser
          path: outputs/qa-prior-pit
          github-token: ${{ github.token }}
      - run: if test -f outputs/qa-prior-pit/report.json; then cat outputs/qa-prior-pit/report.json; fi
      - *node
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm original candidate files and install Chromium
        run: |
          git diff --exit-code d7777a4ce891fab53eaaa5a19e100970016aa26c HEAD -- app content public art-source
          node node_modules/playwright-core/cli.js install chromium
      - name: Play the actual Pit route, rack and four counters
        run: |
          node scripts/qa-pit-masks-broken.mjs || {
            if test -f "$PIT_QA_OUTPUT/report.json"; then cat "$PIT_QA_OUTPUT/report.json"; fi
            exit 1
          }
          cat "$PIT_QA_OUTPUT/report.json"
      - name: Preserve the selection, act and combat captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pit-masques-brises-browser
          path: outputs/qa-bible-pit-masques/
          if-no-files-found: warn
