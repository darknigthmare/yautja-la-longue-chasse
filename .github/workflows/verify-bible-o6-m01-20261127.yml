name: Verify the native O6 first shock
on:
  push:
    branches: [codex/verify-bible-o6-m01-20261127]
permissions:
  contents: read
jobs:
  first-shock:
    name: Play both first shock branches from the common prologue
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '77d40cedd18ab082283317ed89e24bf57fecb863'
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /worker/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /content/the-pit/
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/prologue/v47/
            /public/game/prologue/v72/
            /public/game/youth/v48/
            /public/game/homeworld/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/sprites/v5/film-plates/
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Restore original registered runtime assets
        run: node scripts/materialize-asset-raccords-20261120.mjs runtime
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay the shared nursery, both choices and owner bound writes
        run: node --experimental-strip-types --test --test-concurrency=1 --test-reporter=spec tests/origin-first-shock-o6.test.mjs tests/nursery-opening.test.mjs tests/nursery-cohort-v172.test.mjs tests/nursery-campaign.test.mjs tests/origins-v151.test.mjs tests/origin-continuation-o6.test.mjs tests/origin-solo-return-o6.test.mjs
      - name: Verify the TypeScript entry and save contracts
        if: ${{ !cancelled() }}
        run: node --max-old-space-size=3300 node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint the native scene, rules and recipe
        if: ${{ !cancelled() }}
        run: node node_modules/eslint/bin/eslint.js app/game/OriginFirstShockO6.tsx app/game/systems/originFirstShockO6.ts app/game/systems/nurseryCampaign.ts app/game/nurseryRendering.ts tests/origin-first-shock-o6.test.mjs tests/helpers/origin-first-shock-o6.mjs scripts/qa-origin-first-shock-o6.mjs
      - name: Walk the courtyard, fail and reload the exercise in Chromium
        if: ${{ !cancelled() }}
        run: node scripts/qa-origin-first-shock-o6.mjs
      - name: Preserve the screenshots and actually committed receipts
        if: ${{ !cancelled() && hashFiles('outputs/qa-origin-first-shock-o6/report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-first-shock-o6
          path: outputs/qa-origin-first-shock-o6/
          if-no-files-found: error
