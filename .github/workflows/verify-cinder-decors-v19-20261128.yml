name: Cinder V19 original asset and scan verification
on:
  push:
    branches: ['codex/verify-cinder-decors-v19-20261128']
permissions:
  contents: read
jobs:
  cinder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - name: Checkout exact app and original Cinder inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '3dbea29b53cc87c53c1e12cdae02c552a44ec2ea'
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /content/the-pit/
            /lib/
            /types/
            /worker/
            /desktop/
            /docs/
            /tests/
            /scripts/
            /build/
            /.openai/hosting.json
            /public/**/manifest.json
            /public/game/assets/v19/biome-decor/
            /art-source/v19/biome-decor/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare original bytes and play production scan in Chromium
        run: |
          test "$(git rev-parse HEAD)" = '3dbea29b53cc87c53c1e12cdae02c552a44ec2ea'
          node scripts/qa-cinder-decors-v19-20261128.mjs
      - name: Check catalogue and TypeScript
        if: ${{ !cancelled() }}
        run: |
          node --experimental-strip-types --test tests/environment-prop-registry-v19.test.mjs tests/environment-prop-catalogue-v19.test.mjs tests/environment-prop-drawing.test.mjs
          npm run typecheck
          node node_modules/eslint/bin/eslint.js --max-warnings=0 app/game/environmentPropRegistry.ts tests/environment-prop-registry-v19.test.mjs scripts/qa-cinder-decors-v19-20261128.mjs
      - name: Upload actual canvas captures and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinder-decors-v19-3dbea29b53cc87c53c1e12cdae02c552a44ec2ea
          path: outputs/qa-cinder-decors-v19-20261128/
          if-no-files-found: warn
          retention-days: 30
