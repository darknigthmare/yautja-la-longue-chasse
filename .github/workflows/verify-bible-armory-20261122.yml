name: Verify M052 at the native armory
on:
  push:
    branches: [codex/verify-bible-armory-20261122]
permissions:
  contents: read
jobs:
  native:
    name: Native armory · ${{ matrix.method }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        method: [repair, support]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      ELDER_WORKSHOP_METHOD: ${{ matrix.method }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /lib/
            /types/
            /worker/
            /scripts/
            /tests/
            /docs/
            /desktop/
            /build/
            /production/quetes-vivantes-20261109/
            /production/quetes-vivantes-suite-20261109/
            /.openai/hosting.json
            /public/**/manifest.json
      - name: Restore original declared assets without modifying their contents
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path.cwd()
          files={x['path'] for x in json.loads((root/'docs/qa/current-integration-20261103/runtime-inputs.json').read_text())['entries']}
          files.update(json.loads((root/'tests/fixtures/clan-ship-browser-assets.json').read_text())['paths'])
          files.update('public'+x['src'] for x in json.loads((root/'app/game/data/buriedCradleArt.json').read_text())['assets'].values())
          files.update(['public/game/prologue/v47/village.png','public/game/prologue/v47/arena.png','public/game/ships/v14/avp-predator-mothership.webp','public/game/ships/v12/classic-predator-spaceship.webp','public/game/ships/v13/classic-predator-spaceship-top.webp','public/game/backgrounds/ship-hub-v4.webp'])
          for name in files:
            path=pathlib.PurePosixPath(name);assert not path.is_absolute() and '..' not in path.parts
          subprocess.run(['git','sparse-checkout','add','--stdin'],input='\n'.join('/'+p for p in sorted(files))+'\n',text=True,check=True)
          assert all((root/p).is_file() for p in files)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint workshop and browser proof
        run: npx eslint app/game/ElderWorkshopV172.tsx app/game/systems/elderWorkshopV172.ts tests/elder-workshop-v172.test.mjs tests/helpers/elder-workshop-fixture-v172.mjs scripts/qa-elder-workshop-v172.mjs
      - name: Check receipts and backward compatibility
        if: matrix.method == 'repair'
        run: node --test --test-concurrency=1 tests/elder-workshop-v172.test.mjs tests/elder-assembly-v168.test.mjs tests/clan-ship-operations-save.test.mjs
      - name: Work at the armory, reload, and hand control back
        if: ${{ !cancelled() }}
        run: node scripts/qa-elder-workshop-v172.mjs
      - name: Preserve captures and receipts
        if: ${{ !cancelled() && hashFiles('outputs/qa-elder-workshop-v172/report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bible-armory-${{ matrix.method }}
          path: outputs/qa-elder-workshop-v172/
          if-no-files-found: error
