name: Play both legacy epilogues in the native campaign
on:
  push:
    branches: [codex/verify-bible-epilogues-m059-m060-20261127]
permissions:
  contents: read
jobs:
  epilogues:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      EPILOGUE_CANDIDATE_SHA: '9c66c3b58a5b6d93dce74a50ed16e8f7bb781e85'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.openai/
            /app/
            /lib/
            /types/
            /desktop/
            /worker/
            /build/
            /scripts/
            /tests/
            /docs/qa/current-integration-20261103/runtime-inputs.json
            /public/audio/
            /public/game/homeworld/v56/
            /public/game/homeworld/v64/
            /public/game/homeworld/v67/
            /public/game/homeworld/v69/
            /public/game/homeworld/v72/
            /public/game/homeworld/v74/
            /public/game/homeworld/v77/
            /public/game/assets/v3/actors/yautja/hunter/
            /public/game/assets/v139/rig-gauntlets/
            /public/game/sprites/v62/
            /public/game/prologue/v47/
            /public/game/backgrounds/ice-depth-v4.webp
            /public/game/backgrounds/swamp-depth-v8.png
            /public/game/sprites/v8/ecology/cinder-12/smoke-wyvern-sheet.png
            /public/game/sprites/v8/ecology/naraka-delta/mire-shell-sheet.png
            /public/game/dialogues/v85/bible-dialogues.json
            /public/**/manifest.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize original runtime inputs and install dependencies
        run: |
          node scripts/materialize-asset-raccords-20261120.mjs runtime
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module > "$RUNNER_TEMP/epilogue-npc-art" <<'NODE'
          import { homeworldSceneSsrV78 } from './tests/helpers/homeworld-scene-ssr-v78.mjs';
          const qa = homeworldSceneSsrV78();
          const variants = qa.load('app/game/systems/homeworldNpcVariantsV84.ts');
          const catalogue = variants.HOMEWORLD_NPC_VARIANT_CATALOGUE_V84;
          const paths = new Set();
          for (const npc of catalogue.cast) {
            if (!['region:storm-chain', 'region:luminous-marshes'].includes(npc.groupId)) continue;
            const file = variants.homeworldNpcVariantV84(npc.id)?.src;
            if (file) paths.add('/public' + file);
          }
          if (!paths.size) throw new Error('Missing local V84 cast');
          console.log([...paths].sort().join('\n'));
          NODE
          git sparse-checkout add --stdin < "$RUNNER_TEMP/epilogue-npc-art"
      - name: Verify exact epilogue logic and retain existing cultural routes
        run: |
          git diff --exit-code "$EPILOGUE_CANDIDATE_SHA" HEAD -- app tests
          node --experimental-strip-types --test --test-concurrency=1 tests/legacy-finale-r2.test.mjs tests/bible-cultural-save-v86.test.mjs tests/bible-cultural-scene-v86.test.mjs
      - name: Typecheck the existing source with the new entry point
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Check the new reducer and native scenes
        if: ${{ !cancelled() }}
        run: |
          node node_modules/eslint/bin/eslint.js app/game/systems/legacyFinaleR2.ts app/game/LegacyFinaleSceneR2.tsx app/game/HomeworldRegionV68.tsx app/game/BibleSceneCulturalV86.tsx app/game/GameClient.tsx tests/legacy-finale-r2.test.mjs tests/helpers/legacy-finale-r2.mjs scripts/qa-legacy-epilogues-m059-m060.mjs
      - name: Enter the cohort scene and walk the native halt
        if: ${{ !cancelled() }}
        run: |
          node node_modules/playwright-core/cli.js install chromium
          node scripts/qa-legacy-epilogues-m059-m060.mjs
          cat outputs/qa-legacy-epilogues-m059-m060/report.json
      - name: Store native captures and journey report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-epilogues-m059-m060
          path: outputs/qa-legacy-epilogues-m059-m060/
          if-no-files-found: warn
