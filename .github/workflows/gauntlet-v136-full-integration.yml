name: V136 Full Gauntlet Campaign and Build Integration
on:
  push:
    branches:
      - feat/v131-gauntlet-hologram-dual-view-20261030
  pull_request:
    branches:
      - feat/v129-w3-rts24-source-objectives
      - main
    paths:
      - 'app/game/**'
      - 'app/gauntlet-qa-v135/**'
      - 'app/gauntlet-qa-v136/**'
      - 'tests/clan-war-gauntlet*.test.mjs'
      - 'scripts/export-gauntlet*.mjs'
      - 'scripts/qa-gauntlet-browser-v137.mjs'
      - 'tests/browser/gauntlet-v136.fixture.tsx'
      - 'tests/browser/gauntlet-war-v137.fixture.tsx'
      - 'scripts/qa-gauntlet-war-v137.mjs'
      - '.github/workflows/gauntlet-v136-full-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-full-typecheck:
    name: Full repository typecheck and production frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDIT_CHROME_CHANNEL: chrome
    steps:
      - name: Checkout complete TypeScript graph without 13GB art archives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /app/
            /scripts/
            /tests/
            /types/
            /desktop/
            /db/
            /drizzle/
            /worker/
            /drizzle.config.ts
            /next-env.d.ts
            /next.config.ts
            /tsconfig.json
            /proxy.ts
            /vite.config.ts
            /postcss.config.mjs
            /eslint.config.mjs
            /.openai/hosting.json
            /build/sites-vite-plugin.ts
            /public/game/assets/v18/enemy-trophy-gameplay/manifest.json
            /public/game/assets/v17/enemy-trophies/manifest.json
            /public/game/assets/v16/franchise-trophies/manifest.json
            /public/game/assets/v14/hunter-kit/manifest.json
            /public/game/assets/v15/trophies/manifest.json
            /public/game/assets/v28/sprite-review/manifest.json
            /public/game/assets/v134/gauntlets/jungle-hunter/
            /public/game/assets/v135/gauntlets/
            /public/game/assets/v136/gauntlets/
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full TypeScript graph, including GameClient, save and live scenarios
        run: npm run typecheck
      - name: Realistic artwork audit lives in sparse dedicated workflow
        run: echo "Asset audit remains under V131, where the exact SVG paths are checked and rendered."
      - name: Real V13 campaign export-import and multitab conflict tests
        run: node --import tsx --test --test-reporter=spec tests/gauntlet-save-roundtrip-v136.test.mjs
      - name: Browser interactions on all 54 models (real Chrome, not screenshots-only)
        run: node scripts/qa-gauntlet-browser-v137.mjs
      - name: Preserve evidence for browser UI and mobile layouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-browser-qa-v137
          path: outputs/gauntlet-v137-browser/
          retention-days: 30
          if-no-files-found: warn
      - name: Browser contract of real V131 wrapper, single mounted atlas and mobile skins
        run: node scripts/qa-gauntlet-war-v137.mjs
      - name: Preserve screenshots from dual-view and camera-state regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-dual-view-browser-v137
          path: outputs/gauntlet-v137-war-browser/
          retention-days: 30
          if-no-files-found: warn
      - name: Frontend production build (code-only checkout, diagnostic)
        run: npm run build
      - name: Sanity check real campaign persistence test bundle
        run: node --version
