name: Mobility V1.1 workbook and evidence delivery
on:
  push:
    branches: [feat/mobility-garage-gameplay-20261108]
    paths: [.github/workflows/mobility-publish-resume-v11.yml]
permissions:
  contents: write
concurrency:
  group: mobility-resume-v11-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'darknigthmare/yautja-la-longue-chasse' && github.ref == 'refs/heads/feat/mobility-garage-gameplay-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            docs/campagne/mobilite
            production/mobility-20261108
            production/homeworld-sectors-20261103
            scripts
            .github/workflows
      - name: Import exactly the reviewed workbook and native evidence
        run: |
          python3 - <<'PY'
          import hashlib,io,json,subprocess,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          url='https://d2ol7oe51mr4n9.cloudfront.net/user_3JHwJlNzgmcxQy32tjF7NiVZPuH/cb871a85-adde-4eb6-a277-ca4acedf34d0.zip'
          with urllib.request.urlopen(url,timeout=60) as response:
            data=response.read(3531596)
          assert len(data)==3531595 and hashlib.sha256(data).hexdigest()=='1038bbc28adc32b411fadc47982ef067b4341d7b43423e2726fbba6a5832ab75'
          manifest_path='production/mobility-20261108/qa/resume-delivery-v11.json'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
            assert archive.testzip() is None
            raw=archive.read(manifest_path)
            assert hashlib.sha256(raw).hexdigest()=='b6dddbec5c9abd446ce1e95efb135c65d87d0e66772f48cf307a26adf9166b1a'
            manifest=json.loads(raw)
            assert manifest['source_commit']=='2fa19db1c3f600323350c8256dd7a1d6e6c0ee71'
            rows=manifest['files'];paths={e['path'] for e in rows}|{manifest_path}
            assert len(rows)==19 and len(paths)==20 and set(archive.namelist())==paths
            assert sum(i.file_size for i in archive.infolist())<10_000_000
            outputs={manifest_path:raw}
            for entry in rows:
              name=entry['path'];p=Path(name)
              assert '..' not in PurePosixPath(name).parts and not p.is_absolute()
              assert name.startswith('production/mobility-20261108/') or name in ('scripts/verify-mobility-workbook.py','docs/campagne/mobilite/GAMEPLAY_GARAGE_V1.md')
              body=archive.read(name);old=entry['expected_previous_git_blob']
              assert len(body)==entry['bytes'] and hashlib.sha256(body).hexdigest()==entry['sha256']
              assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==entry['git_blob_sha1']
              if p.exists():
                existing=p.read_bytes()
                actual=hashlib.sha1(b'blob '+str(len(existing)).encode()+b'\0'+existing).hexdigest()
                assert existing==body or actual==old,'Concurrent change: '+name
              else: assert old is None,'Prior file missing: '+name
              outputs[name]=body
            if Path(manifest_path).exists():assert Path(manifest_path).read_bytes()==raw
          for name,body in outputs.items():
            path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(body)
          subprocess.run(['python3','scripts/verify-mobility-workbook.py'],check=True)
          for name,count in [('browser-report.json',21),('controls-browser-report.json',12)]:
            report=json.loads(Path('production/mobility-20261108/qa/native-2fa19db1/qa-mobility-native',name).read_text())
            assert report['sourceCommit']==manifest['source_commit'] and report['passed'] is True
            assert len(report['checks'])==count and all(c['passed'] for c in report['checks'])
          workflow='.github/workflows/mobility-publish-resume-v11.yml'
          Path(workflow).unlink();paths.add(workflow)
          subprocess.run(['git','add','--sparse','--',*sorted(paths)],check=True)
          actual=set(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          assert actual==paths and len(actual)==21,(len(actual),actual^paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print(json.dumps({'verified_delivery_files':20,'workbook_sheets':23,'formulas':779,'historical_cells_preserved':2428,'native_driving_checks':21,'controls_checks':12,'runtime_modified':False,'temporary_publisher_removed':True}))
          PY
      - name: Commit bounded delivery without force-push or merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(mobilite): reprise V1.1, Excel 23 feuilles et preuves 167 tests [skip ci]'
          git push origin HEAD:refs/heads/feat/mobility-garage-gameplay-20261108
          git rev-parse HEAD
