name: REM112 prélèvement avec atelier en navigateur
on:
  push:
    branches: [codex/qa-rem112-ice-workshop-lot4-20261121]
permissions:
  contents: read
jobs:
  gameplay:
    name: ${{ matrix.case.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        case:
          - id: ice-xeno-bone-control
            mission: ice-cryostalker
            seed: browser-ice
            species: nivalis-k--frost-xeno
            action: harvest-bone
            budget: 720
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/
            !/docs/
            !/production/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues.json
            /docs/qa/v112-campaign-canonical/browser-workshop/browser-report.json
            /docs/qa/v112-campaign-canonical/browser-ice/browser-report.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          node scripts/qa-hunt-campaign-browser-v112.mjs \
            --campaign-source "docs/qa/v112-campaign-canonical/${{ matrix.case.seed }}/browser-report.json" \
            --missions "${{ matrix.case.mission }}" \
            --harvest-species "${{ matrix.case.species }}" \
            --harvest-action "${{ matrix.case.action }}" \
            --replay-completed --require-harvest-workshop --require-complete --require-resume \
            --wall-seconds "${{ matrix.case.budget }}" --chromium /usr/bin/google-chrome \
            --asset-cache outputs/source-cache --output outputs/browser
      - if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const path='outputs/browser/browser-report.json';
          let report;
          try { report=JSON.parse(await readFile(path,'utf8')); }
          catch (error) { console.log(error.message); process.exit(0); }
          console.log(JSON.stringify({qualification:report.qualification,coverage:report.coverage,errors:report.errors,harvests:report.harvestAttempts,workshop:report.workshop,assetCount:report.missingAssets.length,attempts:report.attempts.map(x=>({missionId:x.missionId,delivered:x.delivered,resumed:x.suspendedAndReloaded,final:{phase:x.final?.phase,elapsed:x.final?.elapsed,health:x.final?.player?.health},specimens:x.specimensAfterDelivery}))}));
          NODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rem112-lot4-${{ matrix.case.id }}
          path: outputs/browser/
