name: REM112 extraction depuis le tendon réellement conservé
on:
  push:
    branches: [codex/qa-rem112-volcan-authentic-carry-lot4]
permissions:
  contents: read
  actions: read
jobs:
  gameplay:
    name: ${{ matrix.case.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        case:
          - id: volcano-hound-tissue
            mission: volcano-bad-blood
            seed: browser-workshop
            species: cinder-12--hell-hound-stalker
            action: harvest-tissue
            budget: 1000
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/
            !/docs/
            !/production/
            /public/**/manifest.json
            /public/game/dialogues/v85/bible-dialogues.json
            /docs/qa/v112-campaign-canonical/browser-workshop/browser-report.json
            /docs/qa/v112-campaign-canonical/browser-ice/browser-report.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44942225541
          name: rem112-lot4-volcano-hound-tissue
          github-token: ${{ github.token }}
          path: evidence
      - run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const report=JSON.parse(await readFile('evidence/report.json','utf8'));
          const store=JSON.parse(await readFile('evidence/browser-storage-state.json','utf8'));
          const active=store.origins.flatMap(x=>x.localStorage).find(row=>row.name==='yautja-long-hunt.active-hunt');
          assert.equal(JSON.stringify(report.activeHunt),active.value);
          assert.equal(createHash('sha256').update(active.value).digest('hex'),'496609d2401572703892fd6d33f1385357ace12e9885d9bb2af9f16ef54382ef');
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          node scripts/qa-hunt-campaign-browser-v112.mjs \
            --campaign-source evidence/report.json --continue-active-hunt --max-retries 0 \
            --missions "${{ matrix.case.mission }}" \
            --harvest-species "${{ matrix.case.species }}" \
            --harvest-action "${{ matrix.case.action }}" \
            --replay-completed --require-harvest-workshop --require-complete --require-resume \
            --wall-seconds "${{ matrix.case.budget }}" --chromium /usr/bin/google-chrome \
            --asset-cache outputs/source-cache --output outputs/browser
      - if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const path='outputs/browser/report.json';
          let report;
          try { report=JSON.parse(await readFile(path,'utf8')); }
          catch (error) { console.log(error.message); process.exit(0); }
          console.log(JSON.stringify({qualification:report.qualification,coverage:report.coverage,failure:report.failure,errors:report.errors,harvests:report.harvestAttempts,workshop:report.workshop.map(({before,after,...work})=>work),assetCount:report.missingAssets.length,attempts:report.attempts.map(x=>({missionId:x.missionId,delivered:x.delivered,resumed:x.suspendedAndReloaded,final:{phase:x.final?.state.phase,elapsed:x.final?.state.elapsed,health:x.final?.state.player?.health},specimens:x.delivered}))}));
          NODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rem112-lot4-exact-tendon-continuation
          path: outputs/browser/
