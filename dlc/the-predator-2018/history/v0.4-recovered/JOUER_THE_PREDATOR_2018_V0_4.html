function startCampaign(id,index,room=0,resume=false){state.campaign=id;state.index=clamp(index,0,sceneList(id).length-1);loadScene(room,resume)}
function weaponDef(){return D.weapons[state.scene?.weapon]||D.weapons.none}
function maxHpForActor(){return state.scene.actor==='Upgrade Predator'?165:state.scene.predator?125:100}

function makeEnemy(type,i,count,boss=false){const lanes=state.scene.lanes||D.locations[state.scene.location].lanes||1,actual=type==='mixed-hunt'?(i%3===0?'upgrade':i%2?'stargazer':'human-hunters'):type==='final-humans'?(i%3===0?'quinn':i%3===1?'casey':'predator-dog'):type;const hp=enemyHp(actual,boss),armor=/upgrade/.test(actual)?(boss?125:65):0;return{x:innerWidth*(.43+.49*(i+1)/(count+1)),lane:i%lanes,hp,maxHp:hp,armor,maxArmor:armor,type:actual,dir:-1,cd:350+deterministic(state.scene.id+state.roomIndex+i)*900,shotCd:500+deterministic('s'+state.scene.id+i)*900,boss,phase:1,chargeCd:1500,taggedT:0}}
function buildRoomState(roomIndex){const r=route()[roomIndex],final=roomIndex===route().length-1,s=state.scene;let count=Math.min(8,r.enemyBudget||0);let boss=false;if(final&&s.goal==='boss'){count=1;boss=true}if(final&&s.goal==='scripted-loss'&&/upgrade-boss|final-humans/.test(s.enemy||''))count=Math.max(1,Math.min(3,s.enemies||1));if(final&&s.goal==='survive'&&s.enemies)count=Math.max(1,Math.min(3,s.enemies));const enemies=[];for(let i=0;i<count;i++)enemies.push(makeEnemy(s.enemy||'enemy',i,count,boss));const picks=[];const seed=deterministic(`${s.id}:${roomIndex}`);if(s.location!=='orbit'&&seed>.28){const kind=s.predator?(seed>.72?'energy-cell':'medkit'):(seed>.72?'ammo':'medkit');picks.push({kind,x:innerWidth*(.38+.38*((seed*7)%1)),lane:Math.floor(seed*(s.lanes||1))%(s.lanes||1),taken:false})}return{enemies,pickups:picks,cleared:false,alerted:false,secondaryComplete:false}}
function persistRoom(){if(!state.scene||!state.roomCache)return;const old=state.roomCache.get(state.roomIndex)||{};state.roomCache.set(state.roomIndex,{...old,enemies:state.enemies,pickups:state.pickups,cleared:state.enemies.every(e=>e.hp<=0),alerted:state.alerted,secondaryComplete:old.secondaryComplete||false})}
function coverPositions(){const r=currentRoom(),s=state.scene,lanes=s?.lanes||D.locations[s?.location]?.lanes||1,n=r?.coverNodes||0,out=[];for(let i=0;i<n;i++){const seed=deterministic(`${r.id}:cover:${i}`);out.push({x:innerWidth*(.22+.58*((seed*9+i*.31)%1)),lane:i%lanes})}return out}
